name: Build immortalwrt


permissions:
  contents: write


on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      docker:
        description: '是否编译docker'
        required: false
        default: 'false'

      tag2:
        description: 'ImmortalWrt版本'
        required: false
        default: 'v24.10.4'

env:
  REPO_URL_IMM: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: main

  CONFIG_FILE: ./config/immortalwrt.config
  CONFIG_FILE_DOCKER: ./config/docker.config

  DIY_P1_SH: ./sh/scripts-part1.sh
  DIY_P2_SH: ./sh/scripts-part2.sh

  DEFAULT_SETTING: ./default-settings-m0eak

  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    ##################################################
    # Checkout
    ##################################################

    - name: Checkout
      uses: actions/checkout@main



    ##################################################
    # 显示调试信息
    ##################################################

    - name: 显示调试上下文
      run: |
        echo "::group::Workflow inputs"

        echo "docker=${{ github.event.inputs.docker }}"
        echo "tag2=${{ github.event.inputs.tag2 }}"

        echo "repo-url=$REPO_URL_IMM"
        echo "repo-branch=$REPO_BRANCH"

        echo "config-file=$CONFIG_FILE"
        echo "docker-config=$CONFIG_FILE_DOCKER"

        echo "diy-p1=$DIY_P1_SH"
        echo "diy-p2=$DIY_P2_SH"

        echo "default-setting=$DEFAULT_SETTING"


        for path in \
          "$CONFIG_FILE" \
          "$CONFIG_FILE_DOCKER" \
          "$DIY_P1_SH" \
          "$DIY_P2_SH" \
          "$DEFAULT_SETTING" \
          "files"
        do

          if [ -e "$path" ]; then
            echo "exists: $path"
          else
            echo "missing: $path"
          fi

        done


        echo "::endgroup::"



    ##################################################
    # 清理空间
    ##################################################

    - name: 释放磁盘空间
      run: |

        echo "::group::Disk cleanup"


        echo "清理前:"
        df -hT


        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL


        sudo docker image prune \
          --all \
          --force


        echo "清理后:"
        df -hT


        echo "::endgroup::"



    ##################################################
    # 初始化环境
    ##################################################

    - name: 初始化环境

      env:
        DEBIAN_FRONTEND: noninteractive


      run: |

        sudo -E apt-get update


        sudo -E apt-get install -y \
          dos2unix \
          libfuse-dev


        sudo bash -c \
        'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'


        sudo systemctl daemon-reload


        sudo timedatectl set-timezone "$TZ"



        sudo mkdir -p /workdir


        sudo chown \
          $USER:$GROUPS \
          /workdir



        echo "WORKFLOW_NAME=x86_immortalwrt" >> $GITHUB_ENV


        echo "TAG2=${{ github.event.inputs.tag2 }}" \
        | tr ' ' '_' \
        >> $GITHUB_ENV




    ##################################################
    # 克隆 ImmortalWrt
    ##################################################

    - name: 克隆源代码

      working-directory: /workdir


      run: |


        df -hT $PWD



        git clone \
          $REPO_URL_IMM \
          --single-branch \
          openwrt



        ln -sf \
          /workdir/openwrt \
          $GITHUB_WORKSPACE/openwrt



        cd openwrt



        echo "::group::Git tags"

        git fetch \
          --tags \
          --force


        echo "::endgroup::"




        ################################################
        # 固定版本
        ################################################


        echo "Checkout ImmortalWrt ${TAG2}"


        git checkout \
          "tags/${TAG2}" \
          || \
        git checkout \
          "${TAG2}"



        echo "::group::ImmortalWrt source revision"



        echo "Commit:"
        git rev-parse HEAD



        echo

        echo "Short:"
        git log \
          -1 \
          --oneline



        echo

        echo "Remote:"
        git remote -v



        echo

        echo "Status:"
        git status --short



        echo "::endgroup::"



        ################################################
        # 保存路径
        ################################################


        echo "OPENWRT_PATH=$PWD" \
        >> $GITHUB_ENV
    
    ##################################################
    # feeds 更新 + hash锁定
    ##################################################

    - name: 更新并锁定 feeds

      run: |

        cd openwrt


        echo "::group::Feeds configuration"


        pwd


        ls -l feeds.conf.default || true


        sed -n '1,120p' feeds.conf.default || true


        echo "::endgroup::"



        ################################################
        # 更新 feeds
        ################################################


        ./scripts/feeds update -a



        ################################################
        # 记录 feeds commit
        ################################################


        echo "::group::Feeds commit lock"



        rm -rf feeds.lock

        mkdir -p feeds.lock



        for feed in feeds/*; do


          if [ -d "$feed/.git" ]; then


            name=$(basename "$feed")


            commit=$(git -C "$feed" rev-parse HEAD)



            echo "$commit" \
              > feeds.lock/$name.lock



            echo "$name=$commit"


          fi


        done



        echo "::endgroup::"





        ################################################
        # 保存 feeds 信息
        ################################################


        echo "FEEDS_HASH=$(find feeds.lock -type f -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)" \
        >> $GITHUB_ENV




    ##################################################
    # 安装 feeds
    ##################################################

    - name: 安装源

      run: |

        cd openwrt


        ./scripts/feeds install -a




    ##################################################
    # 加载自定义配置
    ##################################################

    - name: 加载自定义配置


      run: |


        echo "WORKFLOW_NAME=x86_immortalwrt" \
        >> $GITHUB_ENV



        ################################################
        # 默认设置
        ################################################


        if [ -e "$DEFAULT_SETTING" ]; then

          mv \
            "$DEFAULT_SETTING" \
            openwrt/package/default-settings-m0eak

        fi




        ################################################
        # files目录
        ################################################


        if [ -e files ]; then

          mv \
            ./files \
            openwrt/files

        fi




        ################################################
        # 主配置
        ################################################


        if [ -e "$CONFIG_FILE" ]; then

          mv \
            "$CONFIG_FILE" \
            openwrt/.config

        fi





        ################################################
        # Docker配置
        ################################################


        if [ "${{ github.event.inputs.docker }}" = "true" ] \
        && [ -e "$CONFIG_FILE_DOCKER" ]; then


          cat \
            "$CONFIG_FILE_DOCKER" \
            >> openwrt/.config


        fi





        ################################################
        # DIY脚本
        ################################################


        chmod +x \
          "$DIY_P2_SH"



        cd openwrt



        echo "::group::Pre defconfig snapshot"



        pwd


        ls -ld \
          package/default-settings-m0eak \
          files \
          .config \
          2>/dev/null \
          || true



        grep -E \
        '^(CONFIG_TARGET|CONFIG_PACKAGE_(docker|dockerd|luci-app-dockerman|containerd|runc))' \
        .config \
        || true



        echo "::endgroup::"




        "$GITHUB_WORKSPACE/$DIY_P2_SH"




        make defconfig




        echo "::group::当前 diffconfig"



        ./scripts/diffconfig.sh



        echo "::endgroup::"






    ##################################################
    # 缓存
    ##################################################

    - name: 检查并恢复缓存

      id: check-cache


      uses: actions/cache@v4


      with:


        key: |
          ${{ runner.os }}-${{ github.workflow }}-${{ env.TAG2 }}-${{ env.FEEDS_HASH }}-${{ hashFiles('openwrt/.config','**/scripts-part*.sh') }}



        restore-keys: |

          ${{ runner.os }}-${{ github.workflow }}-${{ env.TAG2 }}-${{ env.FEEDS_HASH }}-


        path: |

          openwrt/.ccache

          openwrt/staging_dir/host*

          openwrt/staging_dir/tool*





    ##################################################
    # 缓存处理
    ##################################################

    - name: 更新缓存并处理时间戳


      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      run: |


        echo "cache-hit=${{ steps.check-cache.outputs.cache-hit }}"



        if [ "${{ steps.check-cache.outputs.cache-hit }}" = "true" ]; then



          echo "缓存命中，更新时间戳"



          cd openwrt



          find staging_dir \
            -type d \
            -name stamp \
            -not -path "*target*" \
            | while read -r DIR;


          do

            find "$DIR" \
              -type f \
              -exec touch {} +


          done



          echo "完成"



        else



          echo "缓存未命中"



          rm -rf \
            openwrt/dl/go-mod-cache



          CACHE_PREFIX="${{ runner.os }}-${{ github.workflow }}-${{ env.TAG2 }}-"



          echo "查找旧缓存:${CACHE_PREFIX}"



          CACHE_LIST=$(gh cache list --key "$CACHE_PREFIX" | cut -f1)



          if [ -n "$CACHE_LIST" ]; then


            for CACHE_KEY in $CACHE_LIST;

            do

              echo "删除:"
              echo "$CACHE_KEY"


              gh cache delete \
                "$CACHE_KEY"


            done


          fi


        fi

    ##################################################
    # 下载软件包
    ##################################################

    - name: 下载软件包

      id: package


      run: |

        cd openwrt



        make download -j8




        echo "::group::Download directory summary"



        du -sh dl || true



        echo

        echo "检查异常小文件"



        find dl \
          -size -1024c \
          -exec ls -lh {} \;



        echo "::endgroup::"




        # 删除损坏的小文件

        find dl \
          -size -1024c \
          -delete






    ##################################################
    # 编译固件
    ##################################################

    - name: 编译固件

      id: compile


      run: |


        cd openwrt



        echo "$(nproc)线程编译"



        make \
          -j$(expr $(nproc) + 1) \
          || \
        make \
          -j1 \
          V=s





        echo "compile-status=success" \
          >> $GITHUB_ENV





        ################################################
        # 获取设备名称
        ################################################


        grep '^CONFIG_TARGET.*DEVICE.*=y' \
          .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' \
          > DEVICE_NAME





        if [ -s DEVICE_NAME ]; then


          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" \
          >> $GITHUB_ENV


        fi





        ################################################
        # 时间
        ################################################


        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" \
        >> $GITHUB_ENV






        ################################################
        # 输出状态
        ################################################


        echo "compile=success" \
        >> $GITHUB_OUTPUT



        if [ -s DEVICE_NAME ]; then


          echo "device-name=$(cat DEVICE_NAME)" \
          >> $GITHUB_OUTPUT


        fi





        echo "file-date=$(date +"%Y%m%d%H%M")" \
        >> $GITHUB_OUTPUT






        echo "::group::Compile outputs"



        echo "device-name:"


        cat DEVICE_NAME \
          2>/dev/null \
          || true



        echo


        echo "date:"


        date +"%Y%m%d%H%M"




        echo


        find bin/targets \
          -maxdepth 3 \
          -type f \
          -printf '%p %s bytes\n' \
          | sort \
          || true



        echo "::endgroup::"







    ##################################################
    # 检查空间
    ##################################################

    - name: 检查空间使用情况

      if: (!cancelled())


      run: |

        df -hT







    ##################################################
    # 上传 bin
    ##################################################

    - name: 上传 bin 目录


      uses: actions/upload-artifact@main


      if: |

        steps.compile.outputs.compile == 'success'
        &&
        env.UPLOAD_BIN_DIR == 'true'



      with:


        name: |

          OpenWrt_bin_${{ steps.compile.outputs.device-name }}_${{ steps.compile.outputs.file-date }}



        path: |

          openwrt/bin







    ##################################################
    # 发布固件
    ##################################################

    - name: Release firmware


      uses: ./.github/actions/openwrt-release-firmware



      if: |

        steps.compile.outputs.compile == 'success'
        &&
        !cancelled()



      with:


        upload-firmware:

          ${{ env.UPLOAD_FIRMWARE }}



        upload-release:

          ${{ env.UPLOAD_RELEASE }}



        workflow-name:

          ${{ env.WORKFLOW_NAME }}



        source-tag:

          ${{ env.TAG2 }}



        release-tag-prefix:

          immortalwrt_x86_64



        source-url:

          ${{ env.REPO_URL_IMM }}



        artifact-name:

          OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}      
