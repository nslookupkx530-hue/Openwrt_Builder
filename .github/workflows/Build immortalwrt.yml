name: Build immortalWrt x86_64


on:


  workflow_dispatch:


    inputs:


      docker:


        description: Enable docker packages


        required: false


        default: false


        type: boolean





      tag2:


        description: Branch or Tag


        required: false


        default: master


        type: string





permissions:


  contents: read





jobs:





  build:





    uses: ./.github/workflows/_openwrt-build-device.yml





    with:





      device: immortalwrt-x86_64





      repo_url: https://github.com/immortalwrt/immortalwrt.git





      repo_branch: ${{ inputs.tag2 }}





      config_file: config/immortalwrt.config





      docker: ${{ inputs.docker && 'true' || 'false' }}





      sonic_fullcone: "false"





      install_automake_117: "false"
