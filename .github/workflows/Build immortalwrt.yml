name: Build immortalwrt


on:

  workflow_dispatch:

    inputs:

      docker:

        description: Enable docker

        required: false

        default: "false"



      tag2:

        description: ImmortalWrt tag

        required: false

        default: "v25.12.1"



env:

  TZ: Asia/Shanghai

  WORKDIR: /workdir

  REPO_URL_IMM: https://github.com/immortalwrt/immortalwrt.git

  REPO_BRANCH: v25.12.1

  CONFIG_FILE: ./config/immortalwrt.config

  CONFIG_FILE_DOCKER: ./config/docker.config

  UPLOAD_FIRMWARE: true

  UPLOAD_RELEASE: true



permissions:

  contents: write



jobs:


  build:


    name: Build ImmortalWrt x86_64


    runs-on: ubuntu-22.04



    steps:



    - name: Checkout

      uses: actions/checkout@v4





    - name: Free disk space

      shell: bash

      run: |

        set -e


        sudo rm -rf /usr/share/dotnet

        sudo rm -rf /usr/local/lib/android

        sudo rm -rf /opt/ghc


        sudo docker image prune -af


        df -h






    - name: Prepare workdir

      shell: bash

      run: |

        set -e


        sudo mkdir -p $WORKDIR


        sudo chown $USER:$USER $WORKDIR


        ls -ld $WORKDIR






    - name: Init build environment

      shell: bash

      run: |

        set -e


        sudo apt-get update


        sudo apt-get install -y \

          curl \

          wget \

          rsync \

          dos2unix \

          libfuse-dev





        curl -fsSL \

        https://build-scripts.immortalwrt.org/init_build_environment.sh \

        -o /tmp/init_build_environment.sh




        chmod +x /tmp/init_build_environment.sh




        sudo bash /tmp/init_build_environment.sh




        sudo timedatectl set-timezone "$TZ"






    - name: Clone ImmortalWrt source

      shell: bash

      working-directory: ${{ env.WORKDIR }}

      run: |

        set -e



        git clone \

          --single-branch \

          --branch "${{ github.event.inputs.tag2 || env.REPO_BRANCH }}" \

          "$REPO_URL_IMM" \

          openwrt




        cd openwrt




        echo "===== SOURCE ====="


        git log -1 --oneline


        git remote -v




        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV




        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    - name: Debug source

      shell: bash

      run: |

        set -e


        ls -la /workdir


        ls -la /workdir/openwrt


        test -f /workdir/openwrt/feeds.conf.default






    - name: Apply feeds config

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -e



        echo "===== Original feeds ====="


        cat feeds.conf.default




        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then


          echo "Using custom feeds.conf.default"


          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \

          feeds.conf.default


        fi




        echo "===== Current feeds ====="


        cat feeds.conf.default






    - name: Update feeds

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -e



        ./scripts/feeds update -a




        mkdir -p .github-feed-lock




        for feed in feeds/*; do


          if [ -d "$feed/.git" ]; then


            name=$(basename "$feed")



            cd "$feed"


            git rev-parse HEAD \

            > "../../.github-feed-lock/${name}.commit"


            cd ../..

          fi


        done





        echo "===== Feed lock ====="


        cat .github-feed-lock/* || true







    - name: Install feeds

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -e



        ./scripts/feeds install -a






    - name: Load x86 config

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -e



        echo "===== Copy config ====="



        if [ ! -f "${GITHUB_WORKSPACE}/${CONFIG_FILE}" ]; then


          echo "Config file missing:"


          echo "${GITHUB_WORKSPACE}/${CONFIG_FILE}"


          exit 1


        fi




        cp "${GITHUB_WORKSPACE}/${CONFIG_FILE}" .config




        if [ "${{ github.event.inputs.docker }}" = "true" ]; then



          if [ -f "${GITHUB_WORKSPACE}/${CONFIG_FILE_DOCKER}" ]; then



            cat "${GITHUB_WORKSPACE}/${CONFIG_FILE_DOCKER}" \

            >> .config


          fi


        fi




        echo "===== Target ====="


        grep "^CONFIG_TARGET" .config || true






    - name: Defconfig

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -e




        make defconfig




        echo "===== diffconfig ====="



        ./scripts/diffconfig.sh || true






    - name: Generate cache key

      id: cache

      shell: bash

      run: |

        set -e



        HASH=$(sha256sum \

        openwrt/.config \

        openwrt/feeds.conf.default \

        openwrt/.github-feed-lock/* 2>/dev/null \

        | sha256sum | cut -d' ' -f1)



        echo "key=${{ runner.os }}-immortalwrt-${HASH}" \

        >> $GITHUB_OUTPUT






    - name: Restore build cache

      uses: actions/cache@v4


      with:

        key: ${{ steps.cache.outputs.key }}


        restore-keys: |

          ${{ runner.os }}-immortalwrt-


        path: |

          openwrt/dl

          openwrt/staging_dir

          openwrt/build_dir






    - name: Download packages

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -e



        make download -j$(nproc)




        find dl -size -1024c -delete




        du -sh dl

    - name: Compile firmware

      id: compile

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -e



        echo "===== Start compile ====="



        make -j$(nproc) V=s



        echo "compile=success" >> $GITHUB_OUTPUT





        echo "===== Build output ====="



        find bin/targets \

          -maxdepth 5 \

          -type f \

          -printf "%p %s bytes\n" \

          | sort






    #
    # 检查生成文件
    #

    - name: Check build result

      if: always()

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        echo "===== bin directory ====="



        ls -la bin || true



        echo ""



        echo "===== target directory ====="



        find bin/targets \

          -maxdepth 5 \

          -type f \

          | sort || true






    #
    # 上传完整 bin
    #

    - name: Upload firmware

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86_64-firmware


        path: |

          openwrt/bin/targets/**/*


        if-no-files-found: error


        retention-days: 30






    #
    # 上传 target APK feed
    #
    # ImmortalWrt 25.12 APK:
    #
    # packages.adb
    # kernel.apk
    # kmod-*.apk
    #

    - name: Upload target APK packages

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: target-packages-x86_64


        path: |

          openwrt/bin/targets/x86/64/packages/**


        if-no-files-found: error


        retention-days: 30






    #
    # 上传普通 packages feed
    #
    # base
    # luci
    # packages
    # routing
    # telephony
    #

    - name: Upload normal APK feed

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: packages-x86_64


        path: |

          openwrt/bin/packages/x86_64/**


        if-no-files-found: error


        retention-days: 30






    #
    # 上传配置和编译信息
    #

    - name: Upload build information

      if: always()

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86-build-info


        path: |

          openwrt/.config

          openwrt/.github-feed-lock/**

          openwrt/bin/targets/x86/64/*.buildinfo

          openwrt/bin/targets/x86/64/*.manifest

          openwrt/bin/targets/x86/64/*sha256sums


        if-no-files-found: ignore


        retention-days: 30






    #
    # 发布 Release
    #

    - name: Release firmware

      if: steps.compile.outputs.compile == 'success'

      uses: softprops/action-gh-release@v2


      with:


        tag_name: immortalwrt-x86-${{ github.run_number }}


        name: ImmortalWrt x86_64 ${{ github.run_number }}


        files: |

          openwrt/bin/targets/**/*


      env:


        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}






    #
    # 最终检查
    #

    - name: Final summary

      if: always()

      shell: bash

      run: |

        echo "=============================="



        echo "ImmortalWrt Build Summary"



        echo "=============================="



        echo "Commit:"


        echo "${OPENWRT_COMMIT}"



        echo ""



        echo "Tag:"


        echo "${{ github.event.inputs.tag2 || env.REPO_BRANCH }}"



        echo ""



        df -h
