name: Build ImmortalWrt x86_64


on:

  workflow_dispatch:

    inputs:

      docker:

        description: Enable docker

        required: false

        default: "false"


      tag2:

        description: ImmortalWrt branch or tag

        required: false

        default: "master"





env:

  TZ: Asia/Shanghai

  REPO_URL: https://github.com/immortalwrt/immortalwrt.git

  WORKDIR: /workdir

  OPENWRT_PATH: /workdir/openwrt

  CONFIG_FILE: ./config/immortalwrt.config





permissions:

  contents: write





jobs:

  build:


    name: Build ImmortalWrt x86_64


    runs-on: ubuntu-22.04



    steps:



    - name: Checkout builder

      uses: actions/checkout@v4






    #
    # 清理空间
    #

    - name: Free disk space

      shell: bash

      run: |

        set -euxo pipefail


        sudo rm -rf /usr/share/dotnet || true

        sudo rm -rf /usr/local/lib/android || true

        sudo rm -rf /opt/ghc || true


        sudo docker image prune -af || true


        df -hT





    #
    # 初始化环境
    #

    - name: Init build environment

      shell: bash

      run: |

        set -euxo pipefail



        sudo apt-get update



        sudo apt-get install -y \
          curl \
          rsync \
          dos2unix \
          libfuse-dev \
          build-essential




        curl --version





        sudo curl -L \
          https://build-scripts.immortalwrt.org/init_build_environment.sh \
          -o /tmp/init_build_environment.sh





        sudo chmod +x /tmp/init_build_environment.sh





        sudo bash /tmp/init_build_environment.sh





        sudo timedatectl set-timezone "$TZ"





        sudo mkdir -p "$WORKDIR"





        sudo chown "$USER:$USER" "$WORKDIR"





        ls -ld "$WORKDIR"






    #
    # 拉取源码
    #

    - name: Clone ImmortalWrt source

      shell: bash

      working-directory: /workdir

      run: |

        set -euxo pipefail



        rm -rf openwrt




        git clone \
          "${REPO_URL}" \
          openwrt





        cd openwrt





        git fetch --all --tags --force





        echo "===== TAG LIST ====="

        git tag | tail -100 || true





        echo "===== BRANCH ====="

        git branch -a





        TARGET="${{ github.event.inputs.tag2 }}"





        echo "Checkout: ${TARGET}"





        git checkout "${TARGET}"





        echo "===== SOURCE ====="

        git log -1 --oneline





        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV





        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV






    #
    # 检查源码
    #

    - name: Verify source

      shell: bash

      run: |

        set -euxo pipefail



        test -d "$OPENWRT_PATH"

        test -f "$OPENWRT_PATH/Makefile"



        echo "OpenWrt source OK"

    #
    # feeds 配置
    #

    - name: Apply feeds configuration

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        echo "===== Original feeds ====="



        cat feeds.conf.default || true





        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then


          echo "Using custom feeds.conf.default"



          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \
             feeds.conf.default


        fi





        echo "===== Current feeds ====="



        cat feeds.conf.default






    #
    # 更新 feeds 并锁定版本
    #

    - name: Update feeds and lock commit

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        ./scripts/feeds update -a





        mkdir -p .github-feed-lock





        echo "===== Feed commits ====="





        for feed in feeds/*; do


          if [ -d "$feed/.git" ]; then


            name=$(basename "$feed")



            (

              cd "$feed"


              git rev-parse HEAD \
              > "../../.github-feed-lock/${name}.commit"


              echo "$name $(git rev-parse HEAD)"


            )


          fi


        done





        echo "===== Locked ====="



        cat .github-feed-lock/* || true






    #
    # 安装 feeds
    #

    - name: Install feeds

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        ./scripts/feeds install -a






    #
    # 加载配置
    #

    - name: Load ImmortalWrt config

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail





        echo "Config file: ${CONFIG_FILE}"





        if [ ! -f "${GITHUB_WORKSPACE}/${CONFIG_FILE}" ]; then


          echo "ERROR: config missing"



          ls -la "${GITHUB_WORKSPACE}/config" || true



          exit 1


        fi





        cp "${GITHUB_WORKSPACE}/${CONFIG_FILE}" .config





        echo "===== Target ====="



        grep "^CONFIG_TARGET" .config || true






    #
    # Docker支持
    #

    - name: Enable docker config

      if: github.event.inputs.docker == 'true'

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        if [ -f "${GITHUB_WORKSPACE}/config/docker.config" ]; then


          cat "${GITHUB_WORKSPACE}/config/docker.config" >> .config


        fi






    #
    # 生成最终配置
    #

    - name: Defconfig

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        make defconfig





        echo "===== diffconfig ====="



        ./scripts/diffconfig.sh || true






    #
    # 生成缓存 KEY
    #

    - name: Generate cache key

      id: cache-key

      shell: bash

      run: |

        set -euxo pipefail





        HASH=$(sha256sum \
          "${OPENWRT_PATH}/.config" \
          "${OPENWRT_PATH}/feeds.conf.default" \
          ${OPENWRT_PATH}/.github-feed-lock/* \
          2>/dev/null \
          | sha256sum \
          | cut -d' ' -f1)





        echo "key=immortalwrt-x86-${HASH}" >> $GITHUB_OUTPUT






    #
    # 编译缓存
    #

    - name: Restore build cache

      uses: actions/cache@v4


      with:


        key: ${{ steps.cache-key.outputs.key }}


        restore-keys: |

          immortalwrt-x86-



        path: |


          /workdir/openwrt/dl


          /workdir/openwrt/build_dir


          /workdir/openwrt/staging_dir






    #
    # 下载源码包
    #

    - name: Download packages

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        make download -j$(nproc)





        find dl -size -1024c -delete





        echo "===== Download ====="



        du -sh dl

    #
    # 编译固件
    #

    - name: Compile ImmortalWrt firmware

      id: compile

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        echo "=============================="

        echo " Start ImmortalWrt Build "

        echo "=============================="



        make -j$(nproc) V=s





        echo "compile=success" >> $GITHUB_OUTPUT





        echo "===== Build output ====="



        find bin/targets \
          -maxdepth 5 \
          -type f \
          -printf "%p %s bytes\n" \
          | sort || true






    #
    # 检查输出
    #

    - name: Check build output

      if: always()

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set +e



        echo "===== TARGET DIRECTORY ====="



        find bin/targets \
          -maxdepth 5 \
          -type f \
          | sort





        echo ""

        echo "===== APK FILES ====="





        find bin \
          -type f \
          \( \
          -name "*.apk" \
          -o -name "packages.adb" \
          \) \
          | sort || true






    #
    # 上传固件
    #

    - name: Upload firmware

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4



      with:


        name: immortalwrt-x86_64-firmware-${{ github.run_number }}



        path: |


          openwrt/bin/targets/**



        if-no-files-found: error



        retention-days: 30






    #
    # 上传 target APK feed
    #
    # ImmortalWrt 25.12:
    #
    # packages.adb
    # kernel.apk
    # kmod apk
    #

    - name: Upload target APK feed

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4



      with:


        name: immortalwrt-target-apk-${{ github.run_number }}



        path: |


          openwrt/bin/targets/**/packages/**


          openwrt/bin/targets/**/packages.adb



        if-no-files-found: warn



        retention-days: 90






    #
    # 上传普通软件源
    #
    # base
    # luci
    # packages
    # routing
    #

    - name: Upload package feed

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4



      with:


        name: immortalwrt-packages-${{ github.run_number }}



        path: |


          openwrt/bin/packages/**



        if-no-files-found: warn



        retention-days: 90






    #
    # 保存配置
    #

    - name: Upload build information

      if: always()

      uses: actions/upload-artifact@v4



      with:


        name: immortalwrt-build-info-${{ github.run_number }}



        path: |


          openwrt/.config


          openwrt/.github-feed-lock/**


          openwrt/bin/targets/**/*.buildinfo


          openwrt/bin/targets/**/*.manifest


          openwrt/bin/targets/**/*sha256sums



        if-no-files-found: ignore



        retention-days: 30






    #
    # GitHub Release
    #

    - name: Create GitHub Release

      if: steps.compile.outputs.compile == 'success'

      uses: softprops/action-gh-release@v2



      with:


        tag_name: immortalwrt-x86_64-${{ github.run_number }}



        name: ImmortalWrt x86_64 Build ${{ github.run_number }}



        files: |


          openwrt/bin/targets/**/*





      env:


        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}







    #
    # 总结
    #

    - name: Build summary

      if: always()

      shell: bash

      run: |

        echo "================================"


        echo " ImmortalWrt Build Summary "


        echo "================================"



        echo "Commit:"


        echo "${OPENWRT_COMMIT}"



        echo ""



        echo "Branch/Tag:"


        echo "${{ github.event.inputs.tag2 }}"



        echo ""



        echo "Disk:"


        df -hT
