name: Build immortalwrt


on:


  workflow_dispatch:

    inputs:


      docker:

        description: '是否编译docker'

        required: false

        default: 'false'


      tag2:

        description: 'ImmortalWrt版本'

        required: false

        default: 'v25.12.1'



env:


  REPO_URL_IMM: https://github.com/immortalwrt/immortalwrt.git


  REPO_BRANCH: v25.12.1


  FEEDS_CONF: feeds.conf.default


  CONFIG_FILE: ./config/immortalwrt.config


  CONFIG_FILE_DOCKER: ./config/docker.config


  DIY_P1_SH: ./sh/scripts-part1.sh


  DIY_P2_SH: ./sh/scripts-part2.sh


  DEFAULT_SETTING: ./default-settings-m0eak


  UPLOAD_BIN_DIR: true


  UPLOAD_FIRMWARE: true


  UPLOAD_RELEASE: true


  TZ: Asia/Shanghai



permissions:

  contents: write



jobs:


  build:


    runs-on: ubuntu-22.04



    steps:



    - name: Checkout

      uses: actions/checkout@v4



    - name: 显示调试上下文

      run: |


        echo "docker=${{ github.event.inputs.docker }}"

        echo "tag=${{ github.event.inputs.tag2 }}"

        echo "repo=$REPO_URL_IMM"

        echo "branch=$REPO_BRANCH"



    - name: 释放磁盘空间

      run: |


        sudo rm -rf /usr/share/dotnet

        sudo rm -rf /usr/local/lib/android

        sudo rm -rf /opt/ghc

        sudo docker image prune --all --force


        df -hT



    - name: 初始化环境

      env:

        DEBIAN_FRONTEND: noninteractive


      run: |


        sudo apt-get update


        sudo apt-get install -y \

          dos2unix \

          libfuse-dev



        sudo bash -c \

        'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'



        sudo timedatectl set-timezone "$TZ"



        sudo mkdir -p /workdir


        sudo chown $USER:$GROUPS /workdir



        echo "WORKFLOW_NAME=x86_immortalwrt" >> $GITHUB_ENV


        echo "TAG2=${{ github.event.inputs.tag2 || 'v25.12.1' }}" >> $GITHUB_ENV



    - name: 克隆源码

      working-directory: /workdir

      run: |


        git clone \

        --single-branch \

        "$REPO_URL_IMM" \

        openwrt



        cd openwrt



        git fetch --tags



        git checkout "${TAG2}"



        echo "===== Source ====="


        git log -1 --oneline


        git remote -v



        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

          - name: 加载自定义源

      run: |


        if [ -e "$FEEDS_CONF" ]; then

          mv "$FEEDS_CONF" openwrt/feeds.conf.default

        fi



        cd openwrt



        echo "===== feeds.conf ====="


        cat feeds.conf.default



        ./scripts/feeds update -a



    - name: 锁定 feeds hash

      working-directory: openwrt

      run: |


        echo "===== Feed commit lock ====="



        mkdir -p feeds.lock



        for feed in feeds/*; do


          if [ -d "$feed/.git" ]; then


            name=$(basename "$feed")

            (

              cd "$feed"


              git rev-parse HEAD \

              > "../../feeds.lock/${name}.commit"


            )


          fi


        done



        echo "===== locked feeds ====="


        cat feeds.lock/* || true



        tar -czf feeds-hash.tar.gz feeds.lock



    - name: 安装 feeds

      working-directory: openwrt

      run: |


        ./scripts/feeds install -a



    - name: 加载自定义配置

      run: |


        if [ -e "$DEFAULT_SETTING" ]; then


          mv "$DEFAULT_SETTING" \

          openwrt/package/default-settings-m0eak


        fi



        if [ -e files ]; then


          mv files openwrt/files


        fi



        cp "$CONFIG_FILE" openwrt/.config



        if [ "${{ github.event.inputs.docker }}" = "true" ]; then


          if [ -e "$CONFIG_FILE_DOCKER" ]; then


            cat "$CONFIG_FILE_DOCKER" \

            >> openwrt/.config


          fi


        fi



        chmod +x "$DIY_P2_SH"



        cd openwrt



        "$GITHUB_WORKSPACE/$DIY_P2_SH"



        make defconfig



        echo "===== diffconfig ====="



        ./scripts/diffconfig.sh



    - name: 保存 feeds hash artifact

      uses: actions/upload-artifact@v4

      with:


        name: feeds-lock-x86


        path:

          openwrt/feeds-hash.tar.gz



        retention-days: 30



    - name: 检查缓存

      id: check-cache

      uses: actions/cache@v4


      with:


        key: |

          ${{ runner.os }}-immortalwrt-${{ env.TAG2 }}-${{ hashFiles('openwrt/.config','openwrt/feeds.conf.default','feeds.lock/*') }}


        restore-keys: |

          ${{ runner.os }}-immortalwrt-${{ env.TAG2 }}-


        path: |

          openwrt/.ccache

          openwrt/staging_dir

          openwrt/build_dir



    - name: 缓存处理

      run: |


        echo "cache-hit=${{ steps.check-cache.outputs.cache-hit }}"



        if [ "${{ steps.check-cache.outputs.cache-hit }}" = "true" ]; then


          echo "更新时间戳"



          cd openwrt



          find staging_dir \

          -type d \

          -name stamp \

          -not -path "*target*" \

          -exec touch {} \;



        fi



    - name: 下载软件包

      working-directory: openwrt

      run: |


        make download -j8



        find dl -size -1024c -delete



        echo "===== download size ====="



        du -sh dl

           - name: 编译固件

      id: compile

      working-directory: openwrt

      run: |


        echo "===== Start compile ====="



        make -j$(nproc) || make -j1 V=s



        echo "compile=success" >> $GITHUB_OUTPUT



        grep '^CONFIG_TARGET.*DEVICE.*=y' .config || true



        echo "===== Build output ====="



        find bin/targets \

        -maxdepth 4 \

        -type f \

        -printf "%p %s bytes\n" \

        | sort




    #
    # 上传固件
    #

    - name: 上传 bin 目录

      uses: actions/upload-artifact@v4


      if: steps.compile.outputs.compile == 'success' && env.UPLOAD_BIN_DIR == 'true'


      with:


        name: OpenWrt_bin_x86_${{ github.run_number }}


        path: |

          openwrt/bin




    #
    # 上传 target packages
    #
    # 包含：
    # packages.adb
    # kernel.apk
    # kmod-*.apk
    #

    - name: 上传 x86 target packages

      uses: actions/upload-artifact@v4


      if: steps.compile.outputs.compile == 'success'


      with:


        name: target-packages-x86


        path: |


          openwrt/bin/targets/x86/64/packages



        retention-days: 30




    #
    # 上传 feeds packages
    #

    - name: 上传普通 packages

      uses: actions/upload-artifact@v4


      if: steps.compile.outputs.compile == 'success'


      with:


        name: packages-x86_64


        path: |


          openwrt/bin/packages/x86_64



        retention-days: 30





    #
    # 上传编译信息
    #

    - name: 上传 buildinfo


      uses: actions/upload-artifact@v4


      if: always()


      with:


        name: buildinfo-x86


        path: |


          openwrt/bin/targets/x86/64/*.buildinfo

          openwrt/bin/targets/x86/64/*.manifest

          openwrt/bin/targets/x86/64/*sha256sums



        retention-days: 30




    #
    # 发布 Release
    #

    - name: Release firmware

      uses: ./.github/actions/openwrt-release-firmware


      if: steps.compile.outputs.compile == 'success'


      with:


        upload-firmware: ${{ env.UPLOAD_FIRMWARE }}


        upload-release: ${{ env.UPLOAD_RELEASE }}


        workflow-name: ${{ env.WORKFLOW_NAME }}


        source-tag: ${{ env.TAG2 }}


        release-tag-prefix: immortalwrt_x86_64


        source-url: ${{ env.REPO_URL_IMM }}



    - name: 检查空间

      if: always()

      run: |


        df -hT 
