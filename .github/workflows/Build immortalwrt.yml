name: Build ImmortalWrt x86_64


on:

  workflow_dispatch:

    inputs:

      docker:

        description: "Enable Docker"

        required: false

        default: "false"



      tag2:

        description: "ImmortalWrt version"

        required: false

        default: "v25.12.1"




env:

  TZ: Asia/Shanghai


  REPO_URL: https://github.com/immortalwrt/immortalwrt.git


  BRANCH: v25.12.1


  WORKDIR: /workdir


  OPENWRT_PATH: /workdir/openwrt


  CONFIG_FILE: ./config/immortalwrt.config


  UPLOAD_RELEASE: true




permissions:

  contents: write




jobs:


  build:


    name: Build ImmortalWrt x86_64


    runs-on: ubuntu-22.04




    steps:





    - name: Checkout repository


      uses: actions/checkout@v4






    #
    # 释放 Github Runner 空间
    #

    - name: Free disk space


      shell: bash


      run: |


        set -euxo pipefail



        sudo rm -rf /usr/share/dotnet || true


        sudo rm -rf /usr/local/lib/android || true


        sudo rm -rf /opt/ghc || true



        sudo docker image prune -af || true



        df -hT






    #
    # 初始化编译环境
    #

    - name: Init build environment


      shell: bash


      run: |


        set -euxo pipefail



        sudo apt-get update



        sudo apt-get install -y \


          curl \


          rsync \


          dos2unix \


          libfuse-dev \


          build-essential






        echo "Download ImmortalWrt build init script"



        sudo curl \


          -L \


          "https://build-scripts.immortalwrt.org/init_build_environment.sh" \


          -o /tmp/init_build_environment.sh





        sudo chmod +x /tmp/init_build_environment.sh




        sudo bash /tmp/init_build_environment.sh





        sudo timedatectl set-timezone "$TZ"





        sudo mkdir -p "$WORKDIR"




        sudo chown "$USER:$USER" "$WORKDIR"






    #
    # 克隆 ImmortalWrt
    #

    - name: Clone ImmortalWrt source


      shell: bash


      working-directory: ${{ env.WORKDIR }}


      run: |


        set -euxo pipefail





        echo "===== Clone source ====="




        git clone \


          --depth=1 \


          --single-branch \


          --branch "${BRANCH}" \


          "${REPO_URL}" \


          openwrt





        cd openwrt






        echo "===== Source info ====="




        git log -1 --oneline




        git remote -v





        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV





        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV





    #
    # 检查源码目录
    #

    - name: Verify OpenWrt source


      shell: bash


      run: |


        set -euxo pipefail



        test -d "$OPENWRT_PATH"



        test -f "$OPENWRT_PATH/Makefile"



        echo "OpenWrt source OK"



        ls -la "$OPENWRT_PATH"

    #
    # feeds 配置
    #

    - name: Apply feeds configuration

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        echo "===== Original feeds ====="



        if [ -f feeds.conf.default ]; then

          sed -n '1,120p' feeds.conf.default

        fi




        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then


          echo "Using custom feeds.conf.default"



          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \

             feeds.conf.default


        fi




        echo "===== Current feeds ====="



        cat feeds.conf.default






    #
    # 更新 feeds
    #

    - name: Update feeds


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail




        ./scripts/feeds update -a





        echo "===== Feed revision ====="




        mkdir -p .github-feed-lock




        for feed in feeds/*; do



          if [ -d "$feed/.git" ]; then



            name=$(basename "$feed")



            (

              cd "$feed"



              git rev-parse HEAD \

              > "../../.github-feed-lock/${name}.commit"



            )



          fi



        done





        cat .github-feed-lock/* || true








    #
    # 安装 feeds
    #

    - name: Install feeds


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail



        ./scripts/feeds install -a






    #
    # 导入配置
    #

    - name: Load OpenWrt config


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail




        echo "Using config:"


        echo "${CONFIG_FILE}"





        if [ ! -f "${GITHUB_WORKSPACE}/${CONFIG_FILE}" ]; then


          echo "Config file missing"


          exit 1


        fi





        cp "${GITHUB_WORKSPACE}/${CONFIG_FILE}" .config






        echo "===== Target ====="



        grep "^CONFIG_TARGET" .config || true






    #
    # Docker 可选配置
    #

    - name: Enable docker config


      if: github.event.inputs.docker == 'true'


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail



        if [ -f "${GITHUB_WORKSPACE}/config/docker.config" ]; then



          cat "${GITHUB_WORKSPACE}/config/docker.config" \

          >> .config



        fi






    #
    # 生成最终配置
    #

    - name: Make defconfig


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail




        make defconfig






        echo "===== Diffconfig ====="



        ./scripts/diffconfig.sh || true






    #
    # 保存配置缓存
    #

    - name: Generate cache key


      id: cache


      shell: bash


      run: |


        set -euxo pipefail




        HASH=$(sha256sum \

        "$OPENWRT_PATH/.config" \

        "$OPENWRT_PATH/feeds.conf.default" \

        "$OPENWRT_PATH/.github-feed-lock/"* 2>/dev/null \

        | sha256sum | cut -d' ' -f1)





        echo "key=${{ runner.os }}-immortalwrt-${HASH}" \

        >> $GITHUB_OUTPUT






    #
    # 编译缓存
    #

    - name: Restore build cache


      uses: actions/cache@v4


      with:


        key: ${{ steps.cache.outputs.key }}



        restore-keys: |


          ${{ runner.os }}-immortalwrt-




        path: |


          /workdir/openwrt/dl


          /workdir/openwrt/staging_dir


          /workdir/openwrt/build_dir







    #
    # 下载源码包
    #

    - name: Download packages


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail




        make download -j$(nproc)





        find dl -size -1024c -delete





        echo "===== dl size ====="



        du -sh dl

    #
    # 编译固件
    #

    - name: Compile firmware

      id: compile

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        echo "=============================="

        echo " Start ImmortalWrt compile "

        echo "=============================="



        make -j1 V=s



        echo "compile=success" >> $GITHUB_OUTPUT





        echo "===== Build output ====="



        find bin/targets \

          -maxdepth 5 \

          -type f \

          -printf "%p %s bytes\n" \

          | sort






    #
    # 检查 APK feed
    #

    - name: Check APK packages

      if: always()

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        echo "===== Target APK feed ====="



        if [ -d "bin/targets/x86/64/packages" ]; then


          find bin/targets/x86/64/packages \

          -type f \

          | sort


        else


          echo "No target packages directory"



        fi







    #
    # 上传固件
    #

    - name: Upload firmware

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86_64-firmware-${{ github.run_number }}


        path: |


          openwrt/bin/targets/x86/64/**



        if-no-files-found: error


        retention-days: 30







    #
    # 上传 target APK feed
    #
    # ImmortalWrt 25.12:
    #
    # packages.adb
    # kernel.apk
    # kmod-*.apk
    #

    - name: Upload target APK feed

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86-target-apk-feed-${{ github.run_number }}



        path: |


          openwrt/bin/targets/x86/64/packages/**



        if-no-files-found: error


        retention-days: 90







    #
    # 上传普通 APK feed
    #
    # base
    # luci
    # packages
    # routing
    #

    - name: Upload normal APK feed

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86-apk-feed-${{ github.run_number }}



        path: |


          openwrt/bin/packages/x86_64/**



        if-no-files-found: error


        retention-days: 90







    #
    # 上传构建信息
    #

    - name: Upload build info

      if: always()

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86-build-info-${{ github.run_number }}



        path: |


          openwrt/.config


          openwrt/.github-feed-lock/**


          openwrt/bin/targets/x86/64/*.buildinfo


          openwrt/bin/targets/x86/64/*.manifest


          openwrt/bin/targets/x86/64/*sha256sums



        if-no-files-found: ignore


        retention-days: 30







    #
    # GitHub Release
    #

    - name: Create GitHub Release

      if: steps.compile.outputs.compile == 'success'

      uses: softprops/action-gh-release@v2


      with:


        tag_name: immortalwrt-x86_64-${{ github.run_number }}



        name: ImmortalWrt x86_64 Build ${{ github.run_number }}



        files: |


          openwrt/bin/targets/x86/64/**/*



      env:


        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}







    #
    # 最终状态
    #

    - name: Build summary

      if: always()

      shell: bash

      run: |


        echo "================================"


        echo " ImmortalWrt x86_64 Build Summary "


        echo "================================"



        echo "Commit:"


        echo "${OPENWRT_COMMIT}"



        echo ""


        echo "Branch:"


        echo "${BRANCH}"



        echo ""


        echo "Disk:"


        df -hT
