name: Build ImmortalWrt x86_64


on:


  workflow_dispatch:


    inputs:


      docker:


        description: Enable docker packages


        required: false


        default: false


        type: boolean





  schedule:


    - cron: "0 2 1 * *"





concurrency:


  group: immortalwrt-x86_64-build


  cancel-in-progress: true





permissions:


  contents: write





jobs:



  build:



    strategy:


      fail-fast: false





      matrix:


        include:





          - device: x86_64


            repo_url: https://github.com/immortalwrt/immortalwrt.git


            repo_branch: master


            config_file: config/immortalwrt.config


            sonic_fullcone: "false"




    uses: ./.github/workflows/_openwrt-build-device.yml


    with:


      device: ${{ matrix.device }}


      repo_url: ${{ matrix.repo_url }}


      repo_branch: ${{ matrix.repo_branch }}


      config_file: ${{ matrix.config_file }}


      install_automake_117: "true"


      sonic_fullcone: ${{ matrix.sonic_fullcone }}


      docker: ${{ inputs.docker }}


      release: true
