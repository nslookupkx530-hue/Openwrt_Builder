name: Build immortalwrt


on:

  workflow_dispatch:

    inputs:

      docker:

        description: "是否编译 docker"

        required: false

        default: "false"


      tag2:

        description: "ImmortalWrt版本"

        required: false

        default: "v25.12.1"



permissions:

  contents: write



env:

  REPO_URL_IMM: https://github.com/immortalwrt/immortalwrt.git

  REPO_BRANCH: v25.12.1

  CONFIG_FILE: ./config/immortalwrt.config

  CONFIG_FILE_DOCKER: ./config/docker.config

  DIY_P2_SH: ./sh/scripts-part2.sh

  DEFAULT_SETTING: ./default-settings-m0eak

  TZ: Asia/Shanghai

  WORKDIR: /workdir



jobs:


  build:


    name: Build ImmortalWrt x86_64


    runs-on: ubuntu-22.04



    steps:



    - name: Checkout

      uses: actions/checkout@v4




    - name: Debug

      run: |

        echo "docker=${{ github.event.inputs.docker }}"

        echo "tag=${{ github.event.inputs.tag2 }}"




    - name: Free disk space

      run: |

        sudo rm -rf /usr/share/dotnet

        sudo rm -rf /usr/local/lib/android

        sudo rm -rf /opt/ghc

        sudo docker image prune -af

        df -h




    - name: Init environment

      run: |


        sudo apt-get update


        sudo apt-get install -y \

          dos2unix \

          libfuse-dev \

          rsync



        sudo bash -c \

        'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'



        sudo timedatectl set-timezone "$TZ"



        sudo mkdir -p $WORKDIR

        sudo chown $USER:$GROUPS $WORKDIR



        echo "TAG2=${{ github.event.inputs.tag2 || 'v25.12.1' }}" >> $GITHUB_ENV




    - name: Clone ImmortalWrt source

      working-directory: ${{ env.WORKDIR }}

      run: |


        git clone \

          --single-branch \

          https://github.com/immortalwrt/immortalwrt.git \

          openwrt



        cd openwrt



        git fetch --tags



        git checkout "${TAG2}"



        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV



        echo "===== Source ====="



        git log -1 --oneline



        echo "================="

    - name: Apply feeds config

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        echo "===== feeds.conf.default ====="



        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then


          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \

             feeds.conf.default


        fi



        cat feeds.conf.default






    - name: Update feeds and lock hash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        echo "===== Update feeds ====="



        ./scripts/feeds update -a



        mkdir -p feeds.lock




        echo "===== Feed commit ====="



        for feed in feeds/*; do


          if [ -d "$feed/.git" ]; then



            name=$(basename "$feed")



            (

              cd "$feed"



              git rev-parse HEAD \

              > "../../feeds.lock/${name}.commit"


            )



          fi


        done





        echo "===== feeds lock ====="



        cat feeds.lock/* || true





        tar czf feeds-lock.tar.gz feeds.lock






    - name: Install feeds


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        ./scripts/feeds install -a






    - name: Apply custom files and config


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |



        echo "===== Apply config ====="



        if [ -d "${GITHUB_WORKSPACE}/files" ]; then


          cp -rf "${GITHUB_WORKSPACE}/files" .


        fi




        if [ -d "${GITHUB_WORKSPACE}/default-settings-m0eak" ]; then


          mkdir -p package/default-settings-m0eak


          cp -rf \

          "${GITHUB_WORKSPACE}/default-settings-m0eak/"* \

          package/default-settings-m0eak/


        fi





        cp "${GITHUB_WORKSPACE}/${CONFIG_FILE}" .config





        if [ "${{ github.event.inputs.docker }}" = "true" ]; then


          echo "Enable docker config"



          if [ -f "${GITHUB_WORKSPACE}/${CONFIG_FILE_DOCKER}" ]; then


            cat "${GITHUB_WORKSPACE}/${CONFIG_FILE_DOCKER}" \

            >> .config


          fi


        fi





        if [ -f "${GITHUB_WORKSPACE}/${DIY_P2_SH}" ]; then


          chmod +x "${GITHUB_WORKSPACE}/${DIY_P2_SH}"



          "${GITHUB_WORKSPACE}/${DIY_P2_SH}"


        fi






        make defconfig





        echo "===== diffconfig ====="



        ./scripts/diffconfig.sh || true






    - name: Upload feeds lock


      uses: actions/upload-artifact@v4


      with:


        name: feeds-lock-x86


        path: |


          openwrt/feeds-lock.tar.gz


        retention-days: 30






    - name: Cache build files


      id: cache


      uses: actions/cache@v4


      with:


        key: |

          ${{ runner.os }}-immortalwrt-${{ env.TAG2 }}-${{ hashFiles('openwrt/.config','openwrt/feeds.conf.default','openwrt/feeds.lock/*') }}



        restore-keys: |


          ${{ runner.os }}-immortalwrt-${{ env.TAG2 }}-



        path: |


          openwrt/dl


          openwrt/staging_dir


          openwrt/build_dir





    - name: Download packages


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |



        make download -j$(nproc)



        find dl -size -1024c -delete



        echo "===== dl size ====="



        du -sh dl

    - name: Compile firmware

      id: compile

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        echo "===== Start compile ====="



        make -j$(nproc) V=s || make -j1 V=s




        echo "compile=success" >> $GITHUB_OUTPUT




        echo "===== Target files ====="



        find bin/targets \

          -maxdepth 5 \

          -type f \

          -printf "%p %s bytes\n" \

          | sort






    #
    # 上传完整 bin
    #

    - name: Upload firmware bin


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4


      with:


        name: firmware-x86_64-${{ github.run_number }}



        path: |


          openwrt/bin/targets/x86/64/*.bin


          openwrt/bin/targets/x86/64/*.img*


          openwrt/bin/targets/x86/64/*.manifest


          openwrt/bin/targets/x86/64/*sha256sums


          openwrt/bin/targets/x86/64/*.buildinfo



        retention-days: 30





    #
    # 上传 x86 target apk feed
    #
    # ImmortalWrt 25.12:
    #
    # packages.adb
    # kernel.apk
    # kmod-*.apk
    #

    - name: Upload x86 target packages


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:


        name: target-packages-x86



        path: |


          openwrt/bin/targets/x86/64/packages/**



        retention-days: 30






    #
    # 上传普通 apk packages
    #
    # base
    # luci
    # packages
    # routing
    # telephony
    #

    - name: Upload x86 apk feeds


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:


        name: apk-packages-x86_64



        path: |


          openwrt/bin/packages/x86_64/**



        retention-days: 30






    #
    # 上传编译配置
    #

    - name: Upload build information


      if: always()


      uses: actions/upload-artifact@v4



      with:


        name: build-info-x86



        path: |


          openwrt/.config


          openwrt/bin/targets/x86/64/*.buildinfo


          openwrt/bin/targets/x86/64/*.manifest


          openwrt/bin/targets/x86/64/*sha256sums



        retention-days: 30






    #
    # 发布 Release
    #

    - name: Release firmware


      if: steps.compile.outputs.compile == 'success'


      uses: ./.github/actions/openwrt-release-firmware



      with:


        release-tag-prefix: immortalwrt-x86-64



        source-url: ${{ env.REPO_URL_IMM }}



        source-branch: ${{ env.TAG2 }}



        release-files: |


          openwrt/bin/targets/x86/64/*.bin


          openwrt/bin/targets/x86/64/*.img*


          openwrt/bin/targets/x86/64/*.manifest


          openwrt/bin/targets/x86/64/*sha256sums


          openwrt/bin/targets/x86/64/*.buildinfo






    - name: Disk usage


      if: always()


      run: |


        echo "===== Disk ====="



        df -hT
