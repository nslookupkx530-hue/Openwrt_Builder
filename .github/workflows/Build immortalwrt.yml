name: Build ImmortalWrt x86_64


on:
  workflow_dispatch:
    inputs:

      tag2:
        description: ImmortalWrt version
        required: false
        default: v25.12.1


      docker:
        description: Enable docker
        required: false
        default: "false"



env:

  TZ: Asia/Shanghai

  REPO_URL:
    https://github.com/immortalwrt/immortalwrt.git


  BRANCH:
    v25.12.1


  WORKDIR:
    /workdir


  OPENWRT_PATH:
    /workdir/openwrt



  CONFIG_FILE:
    ./config/immortalwrt.config



  UPLOAD_RELEASE:
    true



permissions:

  contents: write



jobs:


  build:


    name: Build ImmortalWrt x86_64


    runs-on: ubuntu-22.04



    steps:



    - name: Checkout

      uses: actions/checkout@v4





    - name: Free disk space

      shell: bash

      run: |

        set -e



        sudo rm -rf /usr/share/dotnet

        sudo rm -rf /usr/local/lib/android

        sudo rm -rf /opt/ghc



        sudo docker image prune -af



        df -h





    #
    # 修复 curl 问题
    #

    - name: Init build environment

      shell: bash

      run: |

        set -euo pipefail



        sudo apt-get update



        sudo apt-get install -y \

          curl \

          rsync \

          dos2unix \

          libfuse-dev



        echo "Download ImmortalWrt build init script"



        curl -fsSL \

        https://build-scripts.immortalwrt.org/init_build_environment.sh \

        -o /tmp/init_build_environment.sh



        chmod +x /tmp/init_build_environment.sh



        sudo bash /tmp/init_build_environment.sh



        sudo timedatectl set-timezone "$TZ"



        sudo mkdir -p "$WORKDIR"



        sudo chown "$USER:$GROUPS" "$WORKDIR"





    - name: Clone ImmortalWrt source

      shell: bash

      working-directory: ${{ env.WORKDIR }}

      run: |

        set -e



        git clone \

          --depth=1 \

          --branch "${BRANCH}" \

          "${REPO_URL}" \

          openwrt



        cd openwrt



        echo "===== SOURCE ====="



        git log -1 --oneline



        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check source

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euo pipefail



        echo "===== OpenWrt path ====="


        pwd



        ls -la



        test -f feeds.conf.default





    - name: Update feeds

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euo pipefail



        echo "===== feeds.conf ====="



        cat feeds.conf.default




        ./scripts/feeds update -a






        mkdir -p .github-feed-lock




        echo "===== Lock feeds ====="



        for feed in feeds/*; do


          if [ -d "$feed/.git" ]; then


            name=$(basename "$feed")



            cd "$feed"



            git rev-parse HEAD \

            > "../../.github-feed-lock/${name}.commit"



            cd ../..



          fi


        done




        cat .github-feed-lock/* || true






    - name: Install feeds

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euo pipefail



        ./scripts/feeds install -a






    - name: Load x86 configuration

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euo pipefail



        if [ ! -f "${GITHUB_WORKSPACE}/${CONFIG_FILE}" ]; then


          echo "Config file not found:"


          echo "${GITHUB_WORKSPACE}/${CONFIG_FILE}"


          exit 1


        fi





        cp "${GITHUB_WORKSPACE}/${CONFIG_FILE}" .config






        if [ "${{ github.event.inputs.docker }}" = "true" ]; then



          echo "Enable docker config"



          if [ -f "${GITHUB_WORKSPACE}/config/docker.config" ]; then


            cat "${GITHUB_WORKSPACE}/config/docker.config" \

            >> .config


          fi



        fi





        echo "===== Target config ====="



        grep "^CONFIG_TARGET" .config || true






    - name: Verify x86 target

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -e



        echo "===== Verify target ====="



        grep "CONFIG_TARGET_x86" .config



        grep "CONFIG_TARGET_x86_64" .config





    - name: Defconfig

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euo pipefail



        make defconfig



        echo "===== diffconfig ====="



        ./scripts/diffconfig.sh || true






    - name: Generate cache key

      id: cache

      shell: bash

      run: |

        set -e



        HASH=$(sha256sum \

        openwrt/.config \

        openwrt/feeds.conf.default \

        openwrt/.github-feed-lock/* 2>/dev/null \

        | sha256sum \

        | cut -d' ' -f1)



        echo "key=immortalwrt-x86-${HASH}" >> $GITHUB_OUTPUT






    - name: Restore build cache

      uses: actions/cache@v4


      with:


        key: ${{ steps.cache.outputs.key }}


        restore-keys: |

          immortalwrt-x86-



        path: |


          openwrt/dl


          openwrt/build_dir


          openwrt/staging_dir






    - name: Download packages

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euo pipefail



        echo "===== Download packages ====="



        make download -j1 V=s



        find dl -size -1024c -delete



        du -sh dl

    - name: Compile firmware

      id: compile

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euo pipefail



        echo "============================"

        echo " Start ImmortalWrt build "

        echo "============================"



        make -j1 V=s



        echo "compile=success" >> $GITHUB_OUTPUT





        echo "===== Build output ====="



        find bin/targets \

          -maxdepth 5 \

          -type f \

          -printf "%p %s bytes\n" \

          | sort





    - name: Check APK target feed

      if: always()

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        echo "===== APK files ====="



        find bin/targets/x86/64 \

          -type f \

          \( \

          -name "*.apk" \

          -o -name "packages.adb" \

          \) \

          | sort || true





    #
    # 上传固件
    #

    - name: Upload firmware

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86_64-firmware



        path: |


          openwrt/bin/targets/x86/64/**



        if-no-files-found: error


        retention-days: 30






    #
    # 上传 target APK feed
    #
    # 这里解决：
    #
    # x86/64/packages.adb
    # kernel.apk
    # kmod-*.apk
    #

    - name: Upload x86 target APK repository

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86-target-apk-feed



        path: |


          openwrt/bin/targets/x86/64/packages/**



        if-no-files-found: error


        retention-days: 90






    #
    # 上传普通 APK feed
    #
    # base
    # luci
    # packages
    # routing
    #

    - name: Upload x86 normal APK feed

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86-apk-feed



        path: |


          openwrt/bin/packages/x86_64/**



        if-no-files-found: error


        retention-days: 90






    #
    # 保存编译配置
    #

    - name: Upload build information

      if: always()

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86-build-info



        path: |


          openwrt/.config


          openwrt/.github-feed-lock/**


          openwrt/bin/targets/x86/64/*.buildinfo


          openwrt/bin/targets/x86/64/*.manifest


          openwrt/bin/targets/x86/64/*sha256sums



        if-no-files-found: ignore


        retention-days: 30






    #
    # GitHub Release
    #

    - name: Create Release

      if: steps.compile.outputs.compile == 'success'

      uses: softprops/action-gh-release@v2


      with:


        tag_name: immortalwrt-x86-${{ github.run_number }}


        name: ImmortalWrt x86_64 ${{ github.run_number }}



        files: |


          openwrt/bin/targets/x86/64/**/*



      env:


        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}







    - name: Build summary

      if: always()

      shell: bash

      run: |


        echo "============================"


        echo " ImmortalWrt x86_64 summary "


        echo "============================"



        echo "Commit:"


        echo "${OPENWRT_COMMIT}"



        echo ""



        echo "Version:"


        echo "${BRANCH}"



        echo ""



        df -h
