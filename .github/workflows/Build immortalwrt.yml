name: Build ImmortalWrt x86_64


on:

  workflow_dispatch:

    inputs:

      docker:

        description: Enable docker

        required: false

        default: "false"

        type: choice

        options:

          - "true"

          - "false"



      tag2:

        description: ImmortalWrt branch or tag

        required: false

        default: "master"

        type: string



env:


  TZ: Asia/Shanghai


  REPO_URL: https://github.com/immortalwrt/immortalwrt.git


  WORKDIR: /workdir


  OPENWRT_PATH: /workdir/openwrt


  CONFIG_FILE: ./config/immortalwrt.config



permissions:


  contents: write



jobs:



  build:



    name: Build ImmortalWrt x86_64


    runs-on: ubuntu-22.04



    steps:



    - name: Checkout

      uses: actions/checkout@v4





    - name: Free disk space

      shell: bash

      run: |

        set -euxo pipefail


        sudo rm -rf /usr/share/dotnet || true

        sudo rm -rf /usr/local/lib/android || true

        sudo rm -rf /opt/ghc || true


        sudo docker image prune -af || true


        df -hT





    - name: Init build environment

      shell: bash

      run: |

        set -euxo pipefail



        sudo apt-get update



        sudo apt-get install -y \

          curl \

          rsync \

          dos2unix \

          libfuse-dev \

          build-essential



        sudo curl -L \

          https://build-scripts.immortalwrt.org/init_build_environment.sh \

          -o /tmp/init_build_environment.sh



        sudo chmod +x /tmp/init_build_environment.sh



        sudo bash /tmp/init_build_environment.sh



        sudo timedatectl set-timezone "$TZ"



        sudo mkdir -p "$WORKDIR"



        sudo chown "$USER:$USER" "$WORKDIR"






    #
    # Clone source
    #
    # 不使用 depth=1
    # 避免 tag 不存在
    #



    - name: Clone ImmortalWrt source

      shell: bash

      working-directory: ${{ env.WORKDIR }}

      run: |

        set -euxo pipefail



        rm -rf openwrt



        git clone \

          "${REPO_URL}" \

          openwrt



        cd openwrt



        echo "===== Fetch tags ====="



        git fetch --tags --force



        echo "===== Available tags ====="



        git tag | tail -30 || true



        TARGET="${{ github.event.inputs.tag2 || 'master' }}"



        echo "Checkout: ${TARGET}"



        git checkout "${TARGET}"



        echo "===== Source ====="



        git log -1 --oneline



        git remote -v



        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV



        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV





    - name: Verify source

      shell: bash

      run: |

        set -euxo pipefail



        test -d "$OPENWRT_PATH"



        test -f "$OPENWRT_PATH/Makefile"



        echo "OpenWrt source OK"






    #
    # feeds
    #



    - name: Apply feeds configuration

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        echo "===== Default feeds ====="



        cat feeds.conf.default || true




        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then


          echo "Using custom feeds.conf.default"



          cp \

          "${GITHUB_WORKSPACE}/feeds.conf.default" \

          feeds.conf.default



        fi




        echo "===== Current feeds ====="



        cat feeds.conf.default




    - name: Update feeds and lock revision

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        ./scripts/feeds update -a




        mkdir -p .github-feed-lock




        echo "===== Feed lock ====="



        for feed in feeds/*; do


          if [ -d "$feed/.git" ]; then



            name=$(basename "$feed")



            (

              cd "$feed"



              git rev-parse HEAD \

              > "../../.github-feed-lock/${name}.commit"


            )


          fi


        done




        cat .github-feed-lock/* || true

    - name: Install feeds

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail


        ./scripts/feeds install -a





    #
    # Load config
    #

    - name: Load ImmortalWrt config

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        echo "Config file: ${CONFIG_FILE}"



        if [ ! -f "${GITHUB_WORKSPACE}/${CONFIG_FILE}" ]; then


          echo "ERROR: config file missing"


          ls -la "${GITHUB_WORKSPACE}/config" || true


          exit 1


        fi




        cp \

        "${GITHUB_WORKSPACE}/${CONFIG_FILE}" \

        .config




        echo "===== Target ====="



        grep "^CONFIG_TARGET" .config || true





    #
    # Docker option
    #

    - name: Enable docker

      if: github.event.inputs.docker == 'true'

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        if [ -f "${GITHUB_WORKSPACE}/config/docker.config" ]; then


          cat "${GITHUB_WORKSPACE}/config/docker.config" \

          >> .config


        fi





    #
    # Generate config
    #

    - name: Defconfig

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        make defconfig




        echo "===== diffconfig ====="



        ./scripts/diffconfig.sh || true





    #
    # Cache
    #

    - name: Generate cache key

      id: cache

      shell: bash

      run: |

        set -euxo pipefail



        HASH=$( \

        sha256sum \

        "$OPENWRT_PATH/.config" \

        "$OPENWRT_PATH/feeds.conf.default" \

        "$OPENWRT_PATH/.github-feed-lock/"* \

        2>/dev/null \

        | sha256sum \

        | cut -d' ' -f1 \

        )



        echo "key=immortalwrt-x86-${HASH}" \

        >> $GITHUB_OUTPUT





    - name: Restore build cache

      uses: actions/cache@v4


      with:


        key: ${{ steps.cache.outputs.key }}



        restore-keys: |


          immortalwrt-x86-



        path: |


          /workdir/openwrt/dl


          /workdir/openwrt/build_dir


          /workdir/openwrt/staging_dir


          /workdir/openwrt/.ccache






    #
    # Download sources
    #

    - name: Download packages

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        make download -j$(nproc)



        find dl -size -1024c -delete




        echo "===== DL size ====="



        du -sh dl






    #
    # Compile
    #

    - name: Compile ImmortalWrt

      id: compile

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail




        echo "=============================="

        echo " Start ImmortalWrt compile "

        echo "=============================="




        make -j$(nproc) || make -j1 V=s





        echo "compile=success" >> $GITHUB_OUTPUT





        echo "===== Build output ====="



        find bin/targets \

          -maxdepth 5 \

          -type f \

          -printf "%p %s bytes\n" \

          | sort || true





    #
    # Check output
    #

    - name: Check build result

      if: always()

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        echo "===== TARGET DIR ====="



        find bin/targets \

        -maxdepth 3 \

        -type d \

        | sort || true




        echo ""


        echo "===== Firmware files ====="



        find bin/targets \

        -type f \

        \( \

        -name "*.img*" \

        -o -name "*.bin" \

        -o -name "*.manifest" \

        -o -name "*sha256sums" \

        \) \

        | sort || true




        echo ""


        echo "===== APK ====="



        find bin/targets \

        -type f \

        \( \

        -name "*.apk" \

        -o -name "packages.adb" \

        \) \

        | sort || true

    #
    # Upload firmware
    #

    - name: Upload firmware

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86_64-firmware-${{ github.run_number }}


        path: |


          openwrt/bin/targets/**/*



        if-no-files-found: error


        retention-days: 30






    #
    # Upload target APK feed
    #
    # ImmortalWrt APK:
    #
    # packages.adb
    # kernel.apk
    # kmod-*.apk
    #

    - name: Upload target APK feed

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-x86-target-apk-${{ github.run_number }}


        path: |


          openwrt/bin/targets/**/packages/**



        if-no-files-found: ignore


        retention-days: 90






    #
    # Upload normal packages feed
    #
    # base
    # luci
    # packages
    # routing
    #

    - name: Upload packages feed


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-packages-x86-${{ github.run_number }}


        path: |


          openwrt/bin/packages/**/*



        if-no-files-found: ignore


        retention-days: 90






    #
    # Save build information
    #

    - name: Upload build information


      if: always()


      uses: actions/upload-artifact@v4


      with:


        name: immortalwrt-build-info-${{ github.run_number }}


        path: |


          openwrt/.config


          openwrt/.github-feed-lock/**


          openwrt/bin/targets/**/*



        if-no-files-found: ignore


        retention-days: 30






    #
    # GitHub Release
    #

    - name: Create GitHub Release


      if: steps.compile.outputs.compile == 'success'


      uses: softprops/action-gh-release@v2


      with:


        tag_name: immortalwrt-x86_64-${{ github.run_number }}


        name: ImmortalWrt x86_64 Build ${{ github.run_number }}



        body: |


          ImmortalWrt x86_64 automated build


          Source:

          ${{ env.REPO_URL }}



          Commit:

          ${{ env.OPENWRT_COMMIT }}



        files: |


          openwrt/bin/targets/**/*


      env:


        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}







    #
    # Summary
    #

    - name: Build summary


      if: always()


      shell: bash


      run: |


        echo "================================="


        echo " ImmortalWrt x86_64 Build Summary "


        echo "================================="



        echo ""


        echo "Commit:"


        echo "${OPENWRT_COMMIT}"



        echo ""


        echo "Tag/Branch:"


        echo "${{ github.event.inputs.tag2 }}"



        echo ""


        echo "Disk:"


        df -hT
