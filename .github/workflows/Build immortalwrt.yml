name: Build ImmortalWrt x86_64


on:

  workflow_dispatch:


    inputs:


      docker:


        description: Enable Docker


        required: false


        default: "false"



      tag2:


        description: Branch or Tag


        required: false


        default: "master"





env:


  TZ: Asia/Shanghai


  REPO_URL: https://github.com/immortalwrt/immortalwrt.git


  WORKDIR: /workdir


  OPENWRT_PATH: /workdir/openwrt


  CONFIG_FILE: ./config/immortalwrt.config





permissions:


  contents: write


  actions: write





jobs:





  build:



    name: Build ImmortalWrt x86_64



    runs-on: ubuntu-22.04





    steps:





      - name: Checkout


        uses: actions/checkout@v4





      - name: Free disk space


        shell: bash


        run: |


          set -euxo pipefail



          sudo rm -rf /usr/share/dotnet || true


          sudo rm -rf /usr/local/lib/android || true


          sudo rm -rf /opt/ghc || true



          sudo docker image prune -af || true



          df -hT





      - name: Init build environment


        shell: bash


        run: |


          set -euxo pipefail



          sudo apt-get update



          sudo apt-get install -y \

            curl \

            rsync \

            dos2unix \

            libfuse-dev \

            build-essential



          curl --version





          sudo curl -L \

            https://build-scripts.immortalwrt.org/init_build_environment.sh \

            -o /tmp/init_build_environment.sh





          sudo chmod +x /tmp/init_build_environment.sh





          sudo bash /tmp/init_build_environment.sh





          sudo timedatectl set-timezone "$TZ"





          sudo mkdir -p "$WORKDIR"





          sudo chown "$USER:$USER" "$WORKDIR"





          ls -ld "$WORKDIR"





      - name: Clone ImmortalWrt source


        shell: bash


        working-directory: /workdir


        run: |


          set -euxo pipefail





          rm -rf openwrt





          git clone \

            "${REPO_URL}" \

            openwrt





          cd openwrt





          git fetch --all --tags --force





          TARGET="${{ github.event.inputs.tag2 }}"





          echo "Checkout target: ${TARGET}"





          if git rev-parse "${TARGET}" >/dev/null 2>&1; then


            git checkout "${TARGET}"


          else


            echo "Target not found, use default branch"


            git checkout -B build origin/master


          fi





          echo "===== SOURCE ====="


          git log -1 --oneline





          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"





          echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"





      - name: Verify source


        shell: bash


        run: |


          set -euxo pipefail





          test -d "$OPENWRT_PATH"


          test -f "$OPENWRT_PATH/Makefile"





          echo "OpenWrt source OK"



      - name: Apply feeds configuration


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail





          echo "===== feeds.conf.default ====="





          cat feeds.conf.default || true





          if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then



            echo "Use custom feeds.conf.default"





            cp "${GITHUB_WORKSPACE}/feeds.conf.default" \

               feeds.conf.default



          fi





          echo "===== Current feeds ====="





          cat feeds.conf.default





      - name: Update feeds


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail





          ./scripts/feeds update -a





          mkdir -p .github-feed-lock





          for feed in feeds/*; do



            if [ -d "$feed/.git" ]; then



              name=$(basename "$feed")





              (



                cd "$feed"





                git rev-parse HEAD \

                  > "../../.github-feed-lock/${name}.commit"





              )



            fi



          done





          echo "===== Feed lock ====="





          cat .github-feed-lock/* || true





      - name: Install feeds


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail





          ./scripts/feeds install -a





      - name: Load config


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail





          echo "Config: ${CONFIG_FILE}"





          if [ ! -f "${GITHUB_WORKSPACE}/${CONFIG_FILE}" ]; then



            echo "Config file missing"





            ls -la "${GITHUB_WORKSPACE}/config" || true





            exit 1



          fi





          cp "${GITHUB_WORKSPACE}/${CONFIG_FILE}" .config





          echo "===== CONFIG TARGET ====="





          grep "^CONFIG_TARGET" .config || true





      - name: Enable docker


        if: github.event.inputs.docker == 'true'


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail





          if [ -f "${GITHUB_WORKSPACE}/config/docker.config" ]; then



            cat "${GITHUB_WORKSPACE}/config/docker.config" >> .config



          fi





      - name: Check target config


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail





          echo "===== TARGET CONFIG ====="





          grep "^CONFIG_TARGET.*=y" .config || true





      - name: Defconfig


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail





          make defconfig





          echo "===== FINAL TARGET ====="





          grep "^CONFIG_TARGET.*=y" .config || true





          ./scripts/diffconfig.sh || true





      - name: Generate cache key


        id: cache-key


        shell: bash


        run: |


          set -euxo pipefail





          HASH=$(sha256sum \

            "${OPENWRT_PATH}/.config" \

            "${OPENWRT_PATH}/feeds.conf.default" \

            ${OPENWRT_PATH}/.github-feed-lock/* \

            2>/dev/null \

            | sha256sum \

            | cut -d' ' -f1)





          echo "key=immortalwrt-x86-${HASH}" >> "$GITHUB_OUTPUT"



      - name: Restore build cache


        uses: actions/cache@v4


        with:


          key: ${{ steps.cache-key.outputs.key }}


          restore-keys: |


            immortalwrt-x86-



          path: |


            /workdir/openwrt/dl


            /workdir/openwrt/build_dir


            /workdir/openwrt/staging_dir





      - name: Download packages


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail





          make download -j$(nproc)





          find dl -size -1024c -delete || true





          du -sh dl || true





      - name: Compile firmware


        id: compile


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail





          echo "=============================="


          echo " Start ImmortalWrt Build "


          echo "=============================="





          make -j$(nproc) V=s





          echo "compile=success" >> "$GITHUB_OUTPUT"





      - name: Check build output


        if: always()


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set +e





          echo "===== TARGET TREE ====="





          find bin -maxdepth 5 -type f | sort || true





          echo ""


          echo "===== APK FILES ====="





          find bin \


            -type f \


            \( \


              -name "*.apk" \


              -o -name "packages.adb" \


            \) | sort || true





      - name: Upload firmware


        if: steps.compile.outputs.compile == 'success'


        uses: actions/upload-artifact@v4





        with:


          name: immortalwrt-x86_64-firmware-${{ github.run_number }}


          path: |


            /workdir/openwrt/bin/targets/**


          if-no-files-found: warn


          retention-days: 30





      - name: Upload APK feed


        if: steps.compile.outputs.compile == 'success'


        uses: actions/upload-artifact@v4





        with:


          name: apk-feed-immortalwrt-x86-${{ github.run_number }}


          path: |


            /workdir/openwrt/bin/targets/**/packages/**


            /workdir/openwrt/bin/targets/**/packages.adb


            /workdir/openwrt/bin/packages/**


          if-no-files-found: warn


          retention-days: 90





      - name: Upload build information


        if: always()


        uses: actions/upload-artifact@v4





        with:


          name: immortalwrt-build-info-${{ github.run_number }}


          path: |


            /workdir/openwrt/.config


            /workdir/openwrt/.github-feed-lock/**


            /workdir/openwrt/bin/targets/**/*.buildinfo


            /workdir/openwrt/bin/targets/**/*.manifest


            /workdir/openwrt/bin/targets/**/*sha256sums


          if-no-files-found: ignore


          retention-days: 30





      - name: Create GitHub Release


        if: steps.compile.outputs.compile == 'success'


        uses: softprops/action-gh-release@v2





        with:


          tag_name: immortalwrt-x86_64-${{ github.run_number }}


          name: ImmortalWrt x86_64 Build ${{ github.run_number }}


          files: |


            /workdir/openwrt/bin/targets/**/*





        env:


          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}





      - name: Build summary


        if: always()


        shell: bash


        run: |


          echo "================================"


          echo " ImmortalWrt Build Summary "


          echo "================================"





          echo "Commit:"


          echo "${OPENWRT_COMMIT}"





          echo ""


          echo "Build target:"


          grep "^CONFIG_TARGET.*=y" "${OPENWRT_PATH}/.config" || true





          echo ""


          echo "Disk usage:"


          df -hT





  publish-feed:



    name: Publish APK Feed



    needs: build



    runs-on: ubuntu-22.04





    steps:



      - name: Trigger Publish APK Feed



        uses: actions/github-script@v7





        with:



          script: |


            await github.rest.actions.createWorkflowDispatch({


              owner: context.repo.owner,


              repo: context.repo.repo,


              workflow_id: 'publish-apk-feed.yml',


              ref: 'main'


            })
