name: Build Tenda-BE12PRO

on:

  workflow_dispatch:

    inputs:

      third_party:

        description: Enable third-party packages

        required: false

        default: disabled

        type: choice

        options:

         - disabled
         - enabled

      docker:

        description: Enable docker packages

        required: false

        default: false

        type: boolean

      release:

        description: Create GitHub release

        required: false

        default: false

        type: boolean


  schedule:

    - cron: "0 2 3 1,7 *"


concurrency:

  group: Tenda-BE12PRO-build

  cancel-in-progress: true


permissions:

  contents: write


jobs:


  build-standard:


    if: ${{ github.event_name == 'schedule' || inputs.third_party == 'disabled' }}


    uses: ./.github/workflows/_openwrt-build-device.yml


    with:

      device: Tenda-BE12PRO

      repo_url: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git

      repo_branch: 25.12-dev-wifi7

      config_file: config/be12pro.config

      sonic_fullcone: "false"

      third_party: disabled

      docker: ${{ inputs.docker }}

      release: ${{ inputs.release }}



  build-third-party:


    if: ${{ inputs.third_party == 'enabled' }}


    uses: ./.github/workflows/_openwrt-build-device_DSF.yml


    with:

      device: Tenda-BE12PRO

      repo_url: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git

      repo_branch: 25.12-dev-wifi7

      config_file: config/be12pro.config

      sonic_fullcone: "false"

      third_party: enabled

      docker: ${{ inputs.docker }}

      release: ${{ inputs.release }}
