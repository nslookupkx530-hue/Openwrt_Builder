name: Build JDC-AX6600


on:

  workflow_dispatch:

    inputs:

      version:

        description: JDC-AX6600 version/tag

        required: false

        default: 25.12.5

        type: string
      
      docker:

        description: Enable docker packages

        required: false

        default: false

        type: boolean


      release:

        description: Create GitHub release

        required: false

        default: false

        type: boolean


  schedule:

    - cron: "0 2 5 1,7 *"


concurrency:

  group: JDC-AX6600-build

  cancel-in-progress: true


permissions:

  contents: write


jobs:


  build:


    strategy:

      fail-fast: false


      matrix:

        include:


          - device: JDC-AX6600

            repo_url: https://github.com/m0eak/libwrt.git

            repo_branch: ${{ github.event.inputs.tag || '25.12.4' }}

            config_file: config/jdcax6600.config


    uses: ./.github/workflows/_openwrt-build-device.yml


    with:

      device: ${{ matrix.device }}

      repo_url: ${{ matrix.repo_url }}

      repo_branch: ${{ matrix.repo_branch }}

      config_file: ${{ matrix.config_file }}

      sonic_fullcone: "false"

      docker: ${{ inputs.docker }}

      release: ${{ inputs.release }}
