name: Publish OpenWrt APK Feed


on:

  workflow_run:

    workflows:

      - Build x86

      - Build filogic

    types:

      - completed


  workflow_dispatch:




permissions:


  contents: write

  pages: write

  id-token: write






jobs:



  publish-apk-feed:



    name: Publish APK Feed



    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}



    runs-on: ubuntu-22.04





    steps:



      - name: Checkout

        uses: actions/checkout@v4






      - name: Prepare directory

        shell: bash

        run: |

          set -eux


          rm -rf downloaded

          rm -rf public


          mkdir -p downloaded


          mkdir -p public/packages/x86_64/targets/x86/64


          mkdir -p public/packages/aarch64_cortex-a53/targets/mediatek/filogic






      - name: Download APK artifacts

        uses: actions/download-artifact@v4

        with:


          pattern: apk-feed-*


          path: downloaded


          merge-multiple: false






      - name: Show downloaded artifacts

        shell: bash

        run: |

          set +e


          echo "========== downloaded =========="


          if [ -d downloaded ]; then

            find downloaded -type f

          else

            echo "No downloaded artifacts"

          fi






      - name: Collect x86 packages

        shell: bash

        run: |

          set -eux


          echo "========== x86 packages =========="


          if [ -d downloaded ]; then


            find downloaded -path "*x86*" -type f -exec cp {} public/packages/x86_64/targets/x86/64/ \;


          else


            echo "No x86 artifacts"

          fi






      - name: Collect filogic packages

        shell: bash

        run: |

          set -eux


          echo "========== filogic packages =========="


          if [ -d downloaded ]; then


            find downloaded -path "*filogic*" -type f -exec cp {} public/packages/aarch64_cortex-a53/targets/mediatek/filogic/ \;


          else


            echo "No filogic artifacts"

          fi






      - name: Collect all apk files

        shell: bash

        run: |

          set -eux


          echo "========== apk files =========="


          if [ -d downloaded ]; then


            find downloaded -name "*.apk" -exec cp {} public/packages/ \;


          fi






      - name: Collect packages database

        shell: bash

        run: |

          set -eux


          echo "========== packages.adb =========="


          if [ -d downloaded ]; then


            find downloaded -name "packages.adb" -exec cp {} public/packages/ \;


          fi






      - name: Check feed

        shell: bash

        run: |

          set +e


          echo "========== FINAL FEED =========="


          find public -type f






      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:


          path: public






      - name: Deploy GitHub Pages

        uses: actions/deploy-pages@v4
