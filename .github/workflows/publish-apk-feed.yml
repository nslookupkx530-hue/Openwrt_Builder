name: Publish OpenWrt APK Feed


on:


  workflow_dispatch:


  workflow_run:


    workflows:


      - Build x86


      - Build filogic


      - Build ImmortalWrt x86_64


    types:


      - completed





permissions:


  contents: write


  pages: write


  id-token: write





jobs:


  publish-apk-feed:



    name: Publish APK Feed



    if: >-


      github.event_name == 'workflow_dispatch' ||


      github.event.workflow_run.conclusion == 'success'



    runs-on: ubuntu-22.04





    steps:





      - name: Checkout


        uses: actions/checkout@v4





      - name: Prepare directories


        shell: bash


        run: |


          set -euxo pipefail





          rm -rf downloaded


          rm -rf public





          mkdir -p downloaded





          mkdir -p public/packages





      - name: Download APK artifacts


        uses: actions/download-artifact@v4


        with:


          pattern: "*apk*"


          path: downloaded


          merge-multiple: false





      - name: Show downloaded artifacts


        shell: bash


        run: |


          set +e





          echo "=============================="


          echo "Downloaded artifacts"


          echo "=============================="





          find downloaded -type f | sort || true





      - name: Create package directories


        shell: bash


        run: |


          set -euxo pipefail





          mkdir -p \


            public/packages/x86_64/targets/x86/64





          mkdir -p \


            public/packages/aarch64_cortex-a53/targets/mediatek/filogic





      - name: Collect x86 packages


        shell: bash


        run: |


          set -euxo pipefail





          echo "========== x86 packages =========="





          find downloaded \


            -type f \


            \(


              -name "*.apk" \


              -o -name "packages.adb"


            \) \


            | grep -E "x86_64|x86" \


            | while read file


              do


                cp "$file" \


                public/packages/x86_64/targets/x86/64/


              done || true



      - name: Collect filogic packages


        shell: bash


        run: |


          set -euxo pipefail





          echo "========== filogic packages =========="





          find downloaded \


            -type f \


            \(


              -name "*.apk" \


              -o -name "packages.adb"


            \) \


            | grep -E "aarch64|filogic|mediatek" \


            | while read file


              do


                cp "$file" \


                public/packages/aarch64_cortex-a53/targets/mediatek/filogic/


              done || true





      - name: Collect all APK files


        shell: bash


        run: |


          set -euxo pipefail





          echo "========== all apk files =========="





          find downloaded \


            -type f \


            -name "*.apk" \


            -exec cp --parents {} public/packages/ \;


          true





      - name: Collect all packages database


        shell: bash


        run: |


          set -euxo pipefail





          echo "========== packages.adb =========="





          find downloaded \


            -type f \


            -name "packages.adb" \


            -exec cp --parents {} public/packages/ \;


          true





      - name: Generate package index


        shell: bash


        run: |


          set -euxo pipefail





          echo "========== package tree =========="





          find public -type f | sort





      - name: Upload Pages artifact


        uses: actions/upload-pages-artifact@v3


        with:


          path: public





      - name: Deploy GitHub Pages


        uses: actions/deploy-pages@v4
