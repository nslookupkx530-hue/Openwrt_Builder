name: Publish OpenWrt APK Feed


on:

  workflow_run:

    workflows:

      - Build x86

      - Build filogic

    types:

      - completed


  workflow_dispatch:





permissions:

  contents: read

  pages: write

  id-token: write





concurrency:

  group: github-pages

  cancel-in-progress: true





jobs:


  publish-apk-feed:


    name: Publish APK Feed


    if: >-

      github.event_name == 'workflow_dispatch' ||

      github.event.workflow_run.conclusion == 'success'


    runs-on: ubuntu-22.04



    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}



    steps:



      - name: Checkout

        uses: actions/checkout@v4





      - name: Setup Pages

        uses: actions/configure-pages@v5





      - name: Prepare directories

        shell: bash

        run: |

          set -eux


          rm -rf downloaded

          rm -rf public


          mkdir -p downloaded


          mkdir -p public/packages/x86_64/targets/x86/64


          mkdir -p public/packages/aarch64_cortex-a53/targets/mediatek/filogic





      - name: Download APK artifacts

        uses: actions/download-artifact@v4

        with:

          pattern: apk-feed-*

          path: downloaded

          merge-multiple: false





      - name: Show downloaded artifacts

        shell: bash

        run: |

          set +e


          echo "=============================="

          echo "Downloaded artifacts"

          echo "=============================="


          if [ -d downloaded ]; then

            find downloaded -type f | sort

          else

            echo "No downloaded directory"

          fi





      - name: Collect x86 packages

        shell: bash

        run: |

          set -eux


          if [ -d downloaded ]; then

            find downloaded -type f -path "*x86*" -exec cp {} public/packages/x86_64/targets/x86/64/ \;

          fi





      - name: Collect filogic packages

        shell: bash

        run: |

          set -eux


          if [ -d downloaded ]; then

            find downloaded -type f -path "*filogic*" -exec cp {} public/packages/aarch64_cortex-a53/targets/mediatek/filogic/ \;

          fi





      - name: Collect APK files

        shell: bash

        run: |

          set -eux


          if [ -d downloaded ]; then

            find downloaded -type f -name "*.apk" -exec cp --parents {} public/packages/ \;

          fi





      - name: Collect packages database

        shell: bash

        run: |

          set -eux


          if [ -d downloaded ]; then

            find downloaded -type f -name "packages.adb" -exec cp --parents {} public/packages/ \;

          fi





      - name: Check final feed

        shell: bash

        run: |

          set +e


          echo "=============================="

          echo "Final feed"

          echo "=============================="


          find public -type f | sort





      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: public





      - name: Deploy Pages

        id: deployment

        uses: actions/deploy-pages@v4
