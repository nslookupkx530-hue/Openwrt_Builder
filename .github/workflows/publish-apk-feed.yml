name: Publish OpenWrt APK Feed


on:


  workflow_run:

    workflows:

      - Build x86

      - Build filogic


    types:

      - completed



permissions:


  contents: write

  pages: write

  id-token: write



jobs:


  publish-apk-feed:


    if: github.event.workflow_run.conclusion == 'success'


    runs-on: ubuntu-22.04



    steps:



    - name: Checkout

      uses: actions/checkout@v4





    #
    # 下载上一次 workflow artifact
    #

    - name: Download artifacts from workflow run


      uses: actions/github-script@v7


      with:


        github-token: ${{ secrets.GITHUB_TOKEN }}


        script: |


          const run_id = context.payload.workflow_run.id;


          const artifacts =
            await github.rest.actions.listWorkflowRunArtifacts({

              owner: context.repo.owner,

              repo: context.repo.repo,

              run_id

            });



          const fs = require('fs');

          const cp = require('child_process');



          for (const artifact of artifacts.data.artifacts) {


            if (

              artifact.name.startsWith('target-packages')

            ) {


              console.log(
                "Downloading:",
                artifact.name
              );


              const zip =
              await github.rest.actions.downloadArtifact({

                owner: context.repo.owner,

                repo: context.repo.repo,

                artifact_id: artifact.id,

                archive_format: 'zip'

              });



              fs.writeFileSync(

                `/tmp/${artifact.name}.zip`,

                Buffer.from(zip.data)

              );



              cp.execSync(

                `unzip -o /tmp/${artifact.name}.zip -d downloaded`

              );


            }

          }





    - name: Show downloaded packages


      run: |


        find downloaded -type f | sort





    #
    # 创建 feed
    #

    - name: Prepare APK repository


      shell: bash


      run: |


        mkdir -p public/packages/x86_64/targets/x86/64


        mkdir -p public/packages/aarch64_cortex-a53/targets/mediatek/filogic





        echo "===== x86 packages ====="



        find downloaded \

        -path "*target-packages-x86*" \

        -type f \

        -exec cp {} \

        public/packages/x86_64/targets/x86/64/ \;



        echo "===== filogic packages ====="



        find downloaded \

        -path "*target-packages-GL*" \

        -o -path "*target-packages-Tenda*" \

        | while read f

        do

          cp "$f" \

          public/packages/aarch64_cortex-a53/targets/mediatek/filogic/

        done





    - name: Check repository


      run:


        tree public || true





    #
    # 发布 GitHub Pages
    #

    - name: Deploy Pages


      uses: peaceiris/actions-gh-pages@v4


      with:


        github_token: ${{ secrets.GITHUB_TOKEN }}


        publish_dir: ./public


        force_orphan: true
