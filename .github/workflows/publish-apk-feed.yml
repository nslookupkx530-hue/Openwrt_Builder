name: OpenWrt Publish Feed


on:


  workflow_run:


    workflows:


      - Build filogic
      - Build immortalWrt x86_64


    types:


      - completed





permissions:


  contents: write





jobs:



  publish:



    if: ${{ github.event.workflow_run.conclusion == 'success' }}



    runs-on: ubuntu-22.04





    steps:



      - name: Checkout repository


        uses: actions/checkout@v4





      - name: Download build artifacts


        uses: actions/download-artifact@v4


        with:


          github-token: ${{ secrets.GITHUB_TOKEN }}


          run-id: ${{ github.event.workflow_run.id }}


          path: downloaded





      - name: Check artifacts


        shell: bash


        run: |


          set +e


          echo "=============================="


          echo "Downloaded artifacts"


          echo "=============================="


          if [ -d downloaded ]; then


            find downloaded -type f | sort


          else


            echo "No artifacts found"


          fi





      - name: Prepare version information


        shell: bash


        run: |


          set -euxo pipefail





          DATE=$(date +%Y-%m-%d)


          RUN_ID="${{ github.event.workflow_run.id }}"





          echo "FEED_DATE=${DATE}" >> $GITHUB_ENV


          echo "FEED_VERSION=${DATE}-${RUN_ID}" >> $GITHUB_ENV





          echo "=============================="


          echo "Feed version"


          echo "${DATE}-${RUN_ID}"


          echo "=============================="



      - name: Prepare gh-pages workspace


        shell: bash


        run: |


          set -euxo pipefail





          rm -rf gh-pages





          git clone \

            --branch gh-pages \

            --single-branch \

            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \

            gh-pages \

            || mkdir -p gh-pages





          echo "=============================="


          echo "Existing gh-pages"


          echo "=============================="


          find gh-pages -maxdepth 2 -type d | sort || true





      - name: Create feed directories


        shell: bash


        run: |


          set -euxo pipefail





          mkdir -p gh-pages/latest





          mkdir -p "gh-pages/archive/${FEED_VERSION}"





          echo "=============================="


          echo "Create version"


          echo "${FEED_VERSION}"


          echo "=============================="





      - name: Copy APK feed files


        shell: bash


        run: |


          set -euxo pipefail





          echo "=============================="


          echo "Collect APK files"


          echo "=============================="


          if [ -d downloaded ]; then





            find downloaded \

              -type f \

              -name "*.apk" \

              -exec cp -f {} gh-pages/latest/ \;





            find downloaded \

              -type f \

              -name "packages.adb" \

              -exec cp -f {} gh-pages/latest/ \;





          fi





          cp -rf gh-pages/latest/. \

            "gh-pages/archive/${FEED_VERSION}/" \

            || true





          echo "=============================="


          echo "Latest feed"


          echo "=============================="


          find gh-pages/latest -type f | sort || true





          echo "=============================="


          echo "Archive feed"


          echo "=============================="


          find "gh-pages/archive/${FEED_VERSION}" -type f | sort || true



      - name: Generate feed index


        shell: bash


        run: |


          set -euxo pipefail





          cat > gh-pages/index.html <<EOF


          <!DOCTYPE html>


          <html>


          <head>


          <meta charset="utf-8">


          <title>OpenWrt APK Feed</title>


          </head>


          <body>


          <h1>OpenWrt APK Feed</h1>


          <h2>Latest</h2>


          <ul>


          <li><a href="latest/">latest feed</a></li>


          </ul>


          <h2>Archive</h2>


          <ul>


          <li><a href="archive/${FEED_VERSION}/">${FEED_VERSION}</a></li>


          </ul>


          </body>


          </html>


          EOF





          echo "=============================="


          echo "Feed index"


          echo "=============================="


          cat gh-pages/index.html





      - name: Commit and publish gh-pages


        shell: bash


        working-directory: gh-pages


        run: |


          set -euxo pipefail





          git config user.name "github-actions"


          git config user.email "github-actions@github.com"





          git add .





          if git diff --cached --quiet; then


            echo "No changes"


            exit 0


          fi





          git commit \


            -m "Update OpenWrt APK feed ${FEED_VERSION}"





          git push origin gh-pages





      - name: Publish summary


        if: always()


        shell: bash


        run: |


          echo "================================"


          echo " OpenWrt APK Feed Publish "


          echo "================================"





          echo "Source workflow:"


          echo "${{ github.event.workflow_run.name }}"





          echo ""


          echo "Feed version:"


          echo "${FEED_VERSION}"





          echo ""


          echo "Latest feed:"


          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest/"





          echo ""


          echo "Archive feed:"


          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/archive/${FEED_VERSION}/"
