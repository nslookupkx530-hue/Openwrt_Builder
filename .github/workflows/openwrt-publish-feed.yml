name: OpenWrt Publish Feed

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Build GL-MT5000
      - Build Tenda-BE12PRO
      - Build immortalwrt
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: downloaded

      - name: Check
        run: |
          ls -la
          find downloaded -type f || true
