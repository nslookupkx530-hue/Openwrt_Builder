name: OpenWrt Publish Feed

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Build GL-MT5000
      - Build Tenda-BE12PRO
      - Build immortalwrt
    types:
      - completed


permissions:
  contents: write
  actions: read


jobs:

  publish:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-22.04


    steps:

      - name: Test
        run: |
          echo "OpenWrt Publish Feed OK"
          echo "${{ github.event.workflow_run.name }}"


      - name: Checkout
        uses: actions/checkout@v4
