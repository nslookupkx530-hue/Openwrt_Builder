name: OpenWrt Publish Feed


on:

  workflow_dispatch:

  workflow_run:
    workflows:
      - Build GL-MT5000
      - Build Tenda-BE12PRO
      - Build immortalwrt
    types:
      - completed


permissions:

  contents: write

  actions: read


jobs:


  publish:

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'


    runs-on: ubuntu-22.04


    steps:


      - name: Checkout
        uses: actions/checkout@v4


      - name: Download artifact

        if: github.event_name == 'workflow_run'

        uses: actions/download-artifact@v4

        with:

          github-token: ${{ secrets.GITHUB_TOKEN }}

          run-id: ${{ github.event.workflow_run.id }}

          path: downloaded


      - name: Check artifact

        shell: bash

        run: |

          set -euxo pipefail

          echo "=============================="
          
          echo "Downloaded artifacts"

          echo "=============================="

          if [ -d downloaded ]; then

            find downloaded -maxdepth 3 -type f | sort

          else

            echo "No artifact found"

          fi


      - name: Prepare version
        shell: bash
        run: |
          set -euxo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION="$(date +%Y-%m-%d)-${{ github.event.workflow_run.id }}"
          else
            VERSION="$(date +%Y-%m-%d)-${{ github.run_id }}"
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

          echo "Feed version:"
          echo "${VERSION}"
  
     
      - name: Create or prepare gh-pages branch

        shell: bash

        run: |

          set -euxo pipefail


          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"


          if git ls-remote --heads "${REPO_URL}" gh-pages | grep -q gh-pages; then

            echo "gh-pages already exists"

            git clone --branch gh-pages --single-branch "${REPO_URL}" gh-pages

          else

            mkdir gh-pages

            cd gh-pages

            git init -b gh-pages

            git config user.name "github-actions"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git remote add origin "${REPO_URL}"

            echo "# OpenWrt APK Feed" > README.md

            git add README.md

            git commit -m "Create gh-pages"

            git push origin gh-pages

            cd ..

          fi


      - name: Publish APK feed
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p gh-pages/latest
          mkdir -p "gh-pages/archive/${VERSION}"

          for artifact in downloaded/*; do

            [ -d "${artifact}" ] || continue

            NAME=$(basename "${artifact}")

            if [[ "${NAME}" == *"-apk-feed-"* ]]; then

              DEVICE="${NAME%-apk-feed-*}"

              echo "Publishing ${DEVICE}"

              LATEST="gh-pages/latest/${DEVICE}"
              ARCHIVE="gh-pages/archive/${VERSION}/${DEVICE}"

              mkdir -p "${LATEST}"
              mkdir -p "${ARCHIVE}"

              find "${artifact}" -type f -name "*.apk" -exec cp -f {} "${LATEST}/" \;

              find "${artifact}" -type f -name "packages.adb" -exec cp -f {} "${LATEST}/" \;

              cp -rf "${LATEST}/." "${ARCHIVE}/"

            fi

          done 
          

      - name: Commit gh-pages
        shell: bash
        working-directory: gh-pages
        run: |
          set -euxo pipefail

          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

            git commit -m "Update OpenWrt APK Feed"

            git push origin gh-pages

