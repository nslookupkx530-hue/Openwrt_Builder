name: Create Release

on:

  workflow_run:

    workflows:

      - Build GL-MT5000
      - Build Tenda-BE12PRO
      - Build immortalwrt
      - Build AXT-1800
      - Build JDC-AX6600
      - Build GL-MT3600BE
      - Build Cudy-TR3000-v1-256MB

    types:

      - completed


permissions:

  contents: write


jobs:

  release:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-22.04


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Download firmware artifacts

        uses: actions/download-artifact@v4

        with:

          github-token: ${{ secrets.GITHUB_TOKEN }}

          run-id: ${{ github.event.workflow_run.id }}

          path: artifacts


      - name: Debug downloaded artifacts
        #输出固件下载日志
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "All downloaded files"
          echo "=========================================="

          find artifacts -type f -ls | sort

          echo "=========================================="
          echo "All downloaded directories"
          echo "=========================================="

          find artifacts -type d -print | sort


      - name: Detect device

        shell: bash

        run: |

          set -euxo pipefail


          DEVICE="unknown"


          for item in artifacts/*

          do

            NAME=$(basename "${item}")


            if [[ "${NAME}" == *"GL-MT5000"* ]]; then

              DEVICE="GL-MT5000"

            fi


            if [[ "${NAME}" == *"Tenda-BE12PRO"* ]]; then

              DEVICE="Tenda-BE12PRO"

            fi


            if [[ "${NAME}" == *"immortalwrt"* ]]; then

              DEVICE="immortalwrt"

            fi

            if [[ "${NAME}" == *"AXT-1800"* ]]; then

              DEVICE="AXT-1800"

            fi

            if [[ "${NAME}" == *"JDC-AX6600"* ]]; then

              DEVICE="JDC-AX6600"

            fi

            if [[ "${NAME}" == *"GL-MT3600BE"* ]]; then

              DEVICE="GL-MT3600BE"

            fi

            if [[ "${NAME}" == *"Cudy-TR3000-256MB"* ]]; then

              DEVICE="Cudy-TR3000-256MB"

            fi

          done


          if [ "${DEVICE}" = "unknown" ]; then

            echo "Device detection failed"

            exit 1

          fi


          echo "DEVICE=${DEVICE}" >> "${GITHUB_ENV}"


      - name: Check firmware files

        shell: bash

        run: |

          set -euxo pipefail


          echo "Device: ${DEVICE}"

          echo "Artifacts:"

          find artifacts -type f | sort



      - name: Prepare release information

        shell: bash

        run: |

          set -euxo pipefail


          DATE=$(date +%Y-%m-%d)

          RUN_ID="${{ github.event.workflow_run.id }}"


          TAG="${DEVICE}-${DATE}-${RUN_ID}"


          echo "TAG=${TAG}" >> "${GITHUB_ENV}"


          echo "Release tag: ${TAG}"



      - name: Collect release files
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p release

          echo "=========================================="
          echo "Downloaded artifact files:"
          echo "=========================================="

          find artifacts -type f -print | sort

          echo "=========================================="
          echo "Collect firmware files"
          echo "=========================================="

          # 收集固件文件
          find artifacts \
            -type f \
            \( \
            -name "*.bin" \
            -o -name "*.img" \
            -o -name "*.img.gz" \
            -o -name "*.vmdk" \
            -o -name "*.tar" \
            -o -name "*.tar.gz" \
            \) \
            -exec cp -f {} release/ \;

          echo "=========================================="
          echo "Collect LuCI package list"
          echo "=========================================="          
          # 收集 LuCI package list
          find artifacts \
            -type f \
            -name "${DEVICE}-luci.md" \
            -exec cp -f {} "release/${DEVICE}-luci.md" \;

          echo "=========================================="
          echo "Collect third-party package list"
          echo "=========================================="          
          # 收集 third-party package list
          # 普通版没有该文件时，find 不会报错，也不会复制任何文件
          find artifacts \
            -type f \
            -name "${DEVICE}-third-party.md" \
            -exec cp -f {} "release/${DEVICE}-third-party.md" \;

          echo "=========================================="
          echo "Release files:"
          echo "=========================================="  
          
          find release -type f -print | sort


      - name: Generate release README
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p release

          cat > release/README.md <<EOF
          OpenWrt automated build release

          Device:

          ${DEVICE}

          Run ID:

          ${{ github.event.workflow_run.id }}

          LuCI package list

          EOF

          LUCI_LIST="release/${DEVICE}-luci.md"
          THIRD_PARTY_LIST="release/${DEVICE}-third-party.md"

          if [ -f "${LUCI_LIST}" ]; then
            cat "${LUCI_LIST}" >> release/README.md
          else
            echo "No LuCI package list found." >> release/README.md
          fi

          # 只有第三方 APK 版存在该文件时，才追加第三方列表
          if [ -f "${THIRD_PARTY_LIST}" ]; then
            echo "" >> release/README.md
            echo "" >> release/README.md
            cat "${THIRD_PARTY_LIST}" >> release/README.md
          fi

          echo "" >> release/README.md

          echo "Generated release README:"
          cat release/README.md


      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ env.TAG }}

          name: ${{ env.TAG }}

          body_path: release/README.md

          files: |

            release/*


        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
