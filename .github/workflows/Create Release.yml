name: Create Release

on:

  workflow_run:

    workflows:

      - Build GL-MT5000
      - Build Tenda-BE12PRO
      - Build immortalwrt
      - Build AXT-1800
      - Build JDC-AX6600
      - Build GL-MT3600BE
      - Build Cudy-TR3000-v1-256MB

    types:

      - completed


permissions:

  contents: write


jobs:

  release:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-22.04


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Download firmware artifacts

        uses: actions/download-artifact@v4

        with:

          github-token: ${{ secrets.GITHUB_TOKEN }}

          run-id: ${{ github.event.workflow_run.id }}

          path: artifacts



      - name: Detect device

        shell: bash

        run: |

          set -euxo pipefail


          DEVICE="unknown"


          for item in artifacts/*

          do

            NAME=$(basename "${item}")


            if [[ "${NAME}" == *"GL-MT5000"* ]]; then

              DEVICE="GL-MT5000"

            fi


            if [[ "${NAME}" == *"Tenda-BE12PRO"* ]]; then

              DEVICE="Tenda-BE12PRO"

            fi


            if [[ "${NAME}" == *"immortalwrt"* ]]; then

              DEVICE="immortalwrt"

            fi

            if [[ "${NAME}" == *"AXT-1800"* ]]; then

              DEVICE="AXT-1800"

            fi

            if [[ "${NAME}" == *"JDC-AX6600"* ]]; then

              DEVICE="JDC-AX6600"

            fi

            if [[ "${NAME}" == *"GL-MT3600BE"* ]]; then

              DEVICE="GL-MT3600BE"

            fi

            if [[ "${NAME}" == *"Cudy-TR3000-256MB"* ]]; then

              DEVICE="Cudy-TR3000-256MB"

            fi

          done


          if [ "${DEVICE}" = "unknown" ]; then

            echo "Device detection failed"

            exit 1

          fi


          echo "DEVICE=${DEVICE}" >> "${GITHUB_ENV}"


      - name: Check firmware files

        shell: bash

        run: |

          set -euxo pipefail


          echo "Device: ${DEVICE}"

          echo "Artifacts:"

          find artifacts -type f | sort



      - name: Prepare release information

        shell: bash

        run: |

          set -euxo pipefail


          DATE=$(date +%Y-%m-%d)

          RUN_ID="${{ github.event.workflow_run.id }}"


          TAG="${DEVICE}-${DATE}-${RUN_ID}"


          echo "TAG=${TAG}" >> "${GITHUB_ENV}"


          echo "Release tag: ${TAG}"



      - name: Collect release files

        shell: bash

        run: |

          set -euxo pipefail


          mkdir -p release


          find artifacts -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" \) -exec cp -f {} release/ \;


          find artifacts -name "luci-package-list.md" \
          -exec cp -f {} release/${DEVICE}-luci.md \;


          echo "Release files:"

          find release -type f | sort


      - name: Generate release README

        shell: bash

        run: |

          set -euxo pipefail

          mkdir -p release


          cat > release/README.md <<EOF

          OpenWrt automated build release


          Device:

          ${DEVICE}

          Run ID:

          ${{ github.event.workflow_run.id }}

          LuCI package list

          EOF


          cat artifacts/*release-info*/*.md >> release/README.md

          echo "" >> release/README.md

          cat release/README.md


      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ env.TAG }}

          name: ${{ env.TAG }}

          body_path: release/README.md

          files: |

            release/*


        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
