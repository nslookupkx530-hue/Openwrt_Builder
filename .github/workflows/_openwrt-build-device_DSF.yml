name: OpenWrt Build Device With Third-Party APK

on:

  workflow_call:

    inputs:

      device:
        required: true
        type: string

      repo_url:
        required: true
        type: string

      repo_branch:
        required: true
        type: string

      config_file:
        required: true
        type: string

      sonic_fullcone:
        required: false
        type: string
        default: "false"

      third_party:
        required: false
        type: string
        default: enabled

      docker:
        required: false
        type: boolean
        default: false

      release:
        required: false
        type: boolean
        default: false


jobs:

  build:

    name: Build ${{ inputs.device }}

    runs-on: ubuntu-22.04


    steps:


      - name: Checkout builder repository

        uses: actions/checkout@v4


      - name: Install dependencies

        shell: bash

        run: |

          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y build-essential clang flex bison gawk gcc g++ gettext git libncurses-dev libssl-dev python3 rsync unzip wget zstd curl dos2unix


      - name: Clone OpenWrt source
        # 获取 OpenWrt 源码
      
        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          rm -rf "${SOURCE_DIR}"

          git clone --depth=1 --branch "${{ inputs.repo_branch }}" "${{ inputs.repo_url }}" "${SOURCE_DIR}"

          ls -la "${SOURCE_DIR}"


      - name: Clean build environment
        # 清理编译环境

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          rm -rf staging_dir build_dir tmp

          mkdir -p dl


      - name: Check source version
        # 检查源版本

        shell: bash

        run: |

          set -euxo pipefail

          cd openwrt

          git describe --tags || true
          git branch
          git log -1


      - name: Modify APK mirror
        # 修改软件包地址
        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          APK_MIRROR="https://mirror.nju.edu.cn/openwrt/releases"


          FILE="${SOURCE_DIR}/package/emortal/default-settings/files/99-default-settings-chinese"


          if [ -f "${FILE}" ]; then

            echo "Found APK mirror config"

            sed -i -E \
            "s#https?://[^\" ]+/openwrt#${APK_MIRROR%/releases}#g" \
            "${FILE}"


            echo "Current APK mirror:"
            grep "apk_mirror" "${FILE}"


          else

            echo "No emortal default settings file"

          fi


      - name: Check APK package mirror
        #检测是否已修改成功，是否为：https://mirror.nju.edu.cn/openwrt
        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          cd "${SOURCE_DIR}"


          echo "=== Search APK mirror ==="


          grep -Rni \
          "apk_mirror" \
          package \
          --exclude-dir=.git \
          || true


      - name: Apply device files

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          FILE_DIR="${{ github.workspace }}/files/${{ inputs.device }}"

          if [ -d "${FILE_DIR}" ]; then

            cp -rf "${FILE_DIR}/." "${SOURCE_DIR}/files/"

            echo "Applied files for ${{ inputs.device }}"


          # 保证 uci-defaults 脚本可执行
          if [ -d "${SOURCE_DIR}/files/etc/uci-defaults" ]; then

            chmod 755 "${SOURCE_DIR}/files/etc/uci-defaults/"*

            echo "uci-defaults permissions fixed"

            ls -la "${SOURCE_DIR}/files/etc/uci-defaults/"

          fi

            echo "Applied files list:"
            find "${SOURCE_DIR}/files" -type f

          else
            
            echo "No custom files for ${{ inputs.device }}"

          fi


      - name: Check custom files

        shell: bash

        run: |

          set -euxo pipefail

          if [ -d "openwrt/files" ]; then

             find openwrt/files -type f | sort

          else
          
             echo "No custom files directory"

          fi


      - name: Add third-party source feeds

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"          

          THIRD_PARTY_CONFIG="${{ github.workspace }}/config/Third-Party/third-party.config"
          
          if [ ! -f "${THIRD_PARTY_CONFIG}" ]; then

            echo "No third-party.config"
            
            exit 0
            
          fi
          
          echo "Load third-party.config"
          source "${THIRD_PARTY_CONFIG}"

          if [ -z "${CUSTOM_SOURCE_FEEDS:-}" ]; then

            echo "No custom source feeds"
            
            exit 0

          fi

          echo "${CUSTOM_SOURCE_FEEDS}" | while IFS='|' read -r name url branch

          do
          
            [ -z "${name}" ] && continue

            echo "Add source feed: ${name}"
            
            echo "src-git ${name} ${url};${branch}" \
              >> "${SOURCE_DIR}/feeds.conf.default"

          done

          echo "Current feeds.conf.default"

          cat "${SOURCE_DIR}/feeds.conf.default"


      - name: Update feeds

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          ./scripts/feeds update -a


      - name: Install feeds

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          ./scripts/feeds install -a -f


      - name: Check luci packages

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          find feeds -path "*luci*" -print | sed -n '1,50p'
         

      - name: Prepare config

        shell: bash

        env:

          CONFIG_FILE: ${{ inputs.config_file }}

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          CONFIG_PATH="${{ github.workspace }}/${CONFIG_FILE}"

          if [ ! -f "${CONFIG_PATH}" ]; then

            echo "Missing config: ${CONFIG_PATH}"

            exit 1

          fi


          cd "${SOURCE_DIR}"

          cp "${CONFIG_PATH}" .config

          echo "Base config applied"


      - name: Load third-party config

        shell: bash

        run: |

          set -euxo pipefail

          CONFIG_PATH="${{ github.workspace }}/config/Third-Party/third-party.config"
          
          if [ ! -f "${CONFIG_PATH}" ]; then

            echo "Missing third-party config:"
            echo "${CONFIG_PATH}"
            exit 1
          fi
          
          source "${CONFIG_PATH}"

          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES:-}" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Third-party CUSTOM_PACKAGES:"
          echo "${CUSTOM_PACKAGES:-}"
          echo "=========================================="


      - name: Apply third-party APK feeds

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          THIRD_CONFIG="${{ github.workspace }}/config/Third-Party/third-party.config"


          if [ ! -f "${THIRD_CONFIG}" ]; then

            echo "No third-party.config"

            exit 0

          fi

          source "${THIRD_CONFIG}"

          if [ -z "${CUSTOM_APK_FEEDS:-}" ]; then

            echo "No custom APK feeds"

            exit 0

          fi

          mkdir -p "${SOURCE_DIR}/files/etc/apk/repositories.d"

          echo "${CUSTOM_APK_FEEDS}" | while IFS='|' read -r name url

          do

            [ -z "${name}" ] && continue

            echo "Add custom APK feed: ${name}"


            echo "${url}" \
              >> "${SOURCE_DIR}/files/etc/apk/repositories.d/${name}.list"

          done

          echo "Custom APK feeds:"

          find "${SOURCE_DIR}/files/etc/apk/repositories.d" -type f \
            -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;          
 

      - name: Check target architecture
        #检测当前的硬件架构，X86、arm64、arm64-a53

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          cd "${SOURCE_DIR}"

          echo "=========================================="
          echo "Target architecture configuration"
          echo "=========================================="

          if grep -q '^CONFIG_TARGET_x86_64=y' .config; then
          
             ARCH="x86"
             
          elif grep -q '^CONFIG_TARGET_x86=y' .config; then   
          
             ARCH="x86"

          elif grep -q '^CONFIG_CPU_TYPE_cortex-a53=y' .config; then 

             ARCH="arm64-a53"

          elif grep -q '^CONFIG_TARGET_arm64=y' .config; then 

             ARCH="arm64"

          else

              echo "Unsupported architecture"

             exit 1

          fi


          echo "Architecture:"
          echo "${ARCH}"


          echo "ARCH=${ARCH}" >> "${GITHUB_ENV}"


      - name: Prepare third-party APK packages

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          THIRD_PARTY_CONFIG="${{ github.workspace }}/config/Third-Party/third-party.config"

          if [ ! -f "${THIRD_PARTY_CONFIG}" ]; then
            echo "Missing third-party.config"
            exit 1
          fi

          source "${THIRD_PARTY_CONFIG}"

          cd "${SOURCE_DIR}"

          export SOURCE_DIR
          export CUSTOM_PACKAGES

          bash \
          "${{ github.workspace }}/shell/apk-prepare-packages.sh"


      - name: Make defconfig

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          make defconfig V=s


      - name: Verify qosify override
        #临时增加：CONFIG_PACKAGE_qosify=n
        shell: bash
        run: |
          set -uo pipefail
          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "qosify final state"
          echo "=========================================="

          grep -E '^CONFIG_PACKAGE_qosify=' .config || true

          echo
          echo "=========================================="
          echo "BPF toolchain final state"
          echo "=========================================="

          grep -E '^CONFIG_(NEED_BPF_TOOLCHAIN|USE_LLVM_BUILD)=' .config || true


      - name: Verify BPF trigger packages
        #临时增加：一个非常简单的诊断
        shell: bash
        run: |
          set -uo pipefail
          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "BPF trigger package state"
          echo "=========================================="

          grep -E '^CONFIG_PACKAGE_(bridger|qosify)=' .config || true

          echo
          echo "=========================================="
          echo "ALL configuration"
          echo "=========================================="

          grep -E '^CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED|BUILDBOT)=' .config || true

          echo
          echo "=========================================="
          echo "BPF toolchain configuration"
          echo "=========================================="

          grep -E '^CONFIG_(HAS_BPF_TOOLCHAIN|NEED_BPF_TOOLCHAIN|HAS_PREBUILT_LLVM_TOOLCHAIN|USE_LLVM_BUILD)=' .config || true


      - name: Identify BPF package selectors
        #临时增加：诊断步骤
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "ALL NEED_BPF_TOOLCHAIN references"
          echo "=========================================="

          grep -n -B15 -A15 \
            'select NEED_BPF_TOOLCHAIN' \
            tmp/.config-package.in || true

          echo
          echo "=========================================="
          echo "Selected BPF-related packages"
          echo "=========================================="

          grep -E '^CONFIG_PACKAGE_.*=(y|m)$' .config \
            | grep -Ei 'bpf|bridger|qosify|dae|daed|xdp|uspot|tcp-in-udp|sched' \
            || true

          echo
          echo "=========================================="
          echo "ALL / ALL_KMODS"
          echo "=========================================="

          grep -E '^CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED|BUILDBOT)=' .config || true

          echo
          echo "=========================================="
          echo "BPF toolchain state"
          echo "=========================================="

          grep -E '^CONFIG_(HAS_BPF_TOOLCHAIN|NEED_BPF_TOOLCHAIN|HAS_PREBUILT_LLVM_TOOLCHAIN|USE_LLVM_BUILD|BPF_TOOLCHAIN_)=' .config \
            || true
            

      - name: Find all NEED_BPF_TOOLCHAIN selectors
        #临时增加：全仓库搜索
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "ALL NEED_BPF_TOOLCHAIN references"
          echo "=========================================="

          grep -RniE \
            'select[[:space:]]+NEED_BPF_TOOLCHAIN|NEED_BPF_TOOLCHAIN' \
            . \
            --exclude-dir=.git \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.so' \
            --exclude='*.so.*' \
            2>/dev/null || true


      - name: Diagnose all generated BPF packages
        #临时增加：.config 到底有哪些 BPF 相关包
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "ALL GENERATED BPF CONFIG"
          echo "=========================================="

          grep -RniE \
            '^(CONFIG_|# CONFIG_).*(BPF|EBPF|LIBBPF|LLVM|CLANG)' \
            .config \
            || true


      - name: Diagnose BPF toolchain selectors
        #临时增加：最后一个非常精准的诊断
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "BPF TOOLCHAIN SELECTOR CONFIG"
          echo "=========================================="

          grep -E '^(CONFIG_BUILDBOT|CONFIG_SDK|CONFIG_SDK_LLVM_BPF|CONFIG_BPF_TOOLCHAIN_BUILD_LLVM|CONFIG_PACKAGE_unetd|CONFIG_UNETD_VXLAN_SUPPORT|CONFIG_NEED_BPF_TOOLCHAIN|CONFIG_USE_LLVM_BUILD)=' .config || true

          echo "=========================================="
          echo "SDK Config.in"
          echo "=========================================="

          nl -ba target/sdk/Config.in | sed -n '1,25p'

          echo "=========================================="
          echo "Toolchain BPF configuration"
          echo "=========================================="

          nl -ba toolchain/Config.in | sed -n '300,350p'

          echo "=========================================="
          echo "unetd configuration"
          echo "=========================================="

          nl -ba package/network/services/unetd/Makefile | sed -n '35,48p'

      - name: Diagnose generated build system config
        #临时增加：再确认
        #CONFIG_BUILDBOT=y
        #CONFIG_SDK=y
        #CONFIG_SDK_LLVM_BPF=y
        #CONFIG_ALL=y
        #CONFIG_ALL_KMODS=y
        #CONFIG_NEED_BPF_TOOLCHAIN=y
        #CONFIG_USE_LLVM_BUILD=y
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "Generated BUILD SYSTEM configuration"
          echo "=========================================="

          grep -E '^(CONFIG_BUILDBOT|CONFIG_SDK|CONFIG_SDK_LLVM_BPF|CONFIG_ALL|CONFIG_ALL_KMODS|CONFIG_NEED_BPF_TOOLCHAIN|CONFIG_USE_LLVM_BUILD|CONFIG_BPF_TOOLCHAIN)' .config || true


      - name: Diagnose ALL_KMODS source
        #临时增加：谁把 CONFIG_ALL_KMODS=y 打开的
        shell: bash
        run: |
          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "Search ALL_KMODS definition / selection"
          echo "=========================================="

          grep -RniE \
            'config[[:space:]]+ALL_KMODS|select[[:space:]]+ALL_KMODS|default[[:space:]].*ALL_KMODS' \
            target package toolchain feeds 2>/dev/null || true

          echo "=========================================="
          echo "Search BPF toolchain selectors"
          echo "=========================================="

          grep -RniE \
            'config[[:space:]]+NEED_BPF_TOOLCHAIN|select[[:space:]]+NEED_BPF_TOOLCHAIN|default[[:space:]].*NEED_BPF_TOOLCHAIN' \
            target package toolchain feeds 2>/dev/null || true

          echo "=========================================="
          echo "Search kselftests-bpf definitions"
          echo "=========================================="

          grep -RniE \
            'kselftests-bpf|PACKAGE_kselftests-bpf' \
            target package toolchain feeds 2>/dev/null || true


      - name: Diagnose unetd BPF dependency
        #临时增加：专门把 unetd 的 Kconfig 片段完整打印出来
        shell: bash
        run: |
          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "unetd Makefile"
          echo "=========================================="

          nl -ba package/network/services/unetd/Makefile | sed -n '1,80p'

          echo "=========================================="
          echo "SDK Config.in"
          echo "=========================================="

          nl -ba target/sdk/Config.in | sed -n '1,60p'

          echo "=========================================="
          echo "ALL_KMODS Config.in"
          echo "=========================================="

          nl -ba target/sdk/files/Config.in | sed -n '1,40p'

          echo "=========================================="
          echo "Generated unetd / SDK config"
          echo "=========================================="

          grep -E '^(CONFIG_PACKAGE_unetd|CONFIG_SDK|CONFIG_ALL_KMODS)=' .config || true
          

      - name: Diagnose generated BPF config
        #临时增加：检查 diffconfig
        shell: bash
        run: |
          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "Generated BPF / LLVM configuration"
          echo "=========================================="

          grep -E '^(CONFIG_NEED_BPF_TOOLCHAIN|CONFIG_HAS_BPF_TOOLCHAIN|CONFIG_HAS_PREBUILT_LLVM_TOOLCHAIN|CONFIG_USE_LLVM_BUILD|CONFIG_USE_LLVM_PREBUILT)=' .config || true

          grep -E '^CONFIG_PACKAGE_(kselftests-bpf|kmod-bpf-test|kmod-sched-bpf|libbpf)=' .config || true

          echo "=========================================="
          echo "Compare source config vs generated config"
          echo "=========================================="

          ./scripts/diffconfig.sh "${{ github.workspace }}/config/immortalwrt.config" .config || true


      - name: Check APK and kmods config
        #临时增加：看是否有下面类似的出现
        #CONFIG_USE_APK=y
        #CONFIG_BUILDBOT=y
        #CONFIG_PER_FEED_REPO=y
        shell: bash
        run: |
          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "APK / Buildbot configuration"
          echo "=========================================="

          grep -E '^(CONFIG_USE_APK|CONFIG_BUILDBOT|CONFIG_PER_FEED_REPO)=' .config || true

          echo "=========================================="
          echo "Kernel / RAID configuration"
          echo "=========================================="

          grep -E '^(CONFIG_TARGET_KERNEL|CONFIG_LINUX|CONFIG_PACKAGE_kmod-md|CONFIG_PACKAGE_mdadm)' .config || true


      - name: Check prebuilt LLVM BPF toolchain
        #临时增加：一个非常小的检查
        shell: bash
        run: |
          set -x
          cd "${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "Prebuilt LLVM BPF toolchain"
          echo "=========================================="

          echo "--- llvm-bpf directory ---"
          ls -la llvm-bpf 2>/dev/null || true
          
          echo "--- .llvm-version ---"
          cat llvm-bpf/.llvm-version 2>/dev/null || true

          echo "--- LLVM related config ---"
          grep -E '^(CONFIG_HAS_BPF_TOOLCHAIN|CONFIG_NEED_BPF_TOOLCHAIN|CONFIG_HAS_PREBUILT_LLVM_TOOLCHAIN|CONFIG_USE_LLVM_BUILD|CONFIG_USE_LLVM_PREBUILT|CONFIG_BUILDBOT)=' .config || true


      - name: Verify third-party APK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          cd "${SOURCE_DIR}"

          export SOURCE_DIR

          bash \
            "${{ github.workspace }}/shell/apk-verify-packages.sh"


      - name: Install third-party APK files and startup service
        shell: bash
        run: |
          set -Eeuo pipefail

          echo ">>> Preparing third-party APK files and startup service"

          # 当前工作目录应当是 OpenWrt 源码目录
          OPENWRT_DIR="${GITHUB_WORKSPACE}/openwrt"

          # 仓库根目录中的 files 目录
          REPO_FILES_DIR="${GITHUB_WORKSPACE}/files"

          # apk-prepare-packages.sh 生成的 APK 目录
          APK_SOURCE_DIR="${OPENWRT_DIR}/packages"

          # 固件最终使用的 files 目录
          FIRMWARE_FILES_DIR="${OPENWRT_DIR}/files"

          echo ">>> OPENWRT_DIR: ${OPENWRT_DIR}"
          echo ">>> REPO_FILES_DIR: ${REPO_FILES_DIR}"
          echo ">>> APK_SOURCE_DIR: ${APK_SOURCE_DIR}"
          echo ">>> FIRMWARE_FILES_DIR: ${FIRMWARE_FILES_DIR}"

          # 创建固件文件目录
          mkdir -p \
            "${FIRMWARE_FILES_DIR}/usr/share/third-party" \
            "${FIRMWARE_FILES_DIR}/etc/third-party" \
            "${FIRMWARE_FILES_DIR}/etc/init.d"        

          # 检查 APK 输出目录
          if [ ! -d "${APK_SOURCE_DIR}" ]; then
            echo "ERROR: APK source directory does not exist:"
            echo "       ${APK_SOURCE_DIR}"
            exit 1
          fi

          # 检查是否成功生成 APK
          APK_COUNT="$(
            find "${APK_SOURCE_DIR}" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | wc -l
          )"

          if [ "${APK_COUNT}" -eq 0 ]; then
            echo "ERROR: No third-party APK files found in:"
            echo "       ${APK_SOURCE_DIR}"
            exit 1
          fi

          echo ">>> Found ${APK_COUNT} third-party APK package(s)"

          # 复制 APK 到固件
          find "${APK_SOURCE_DIR}" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -exec cp -f {} \
              "${FIRMWARE_FILES_DIR}/usr/share/third-party/" \;

          # 检查仓库中的安装脚本
          if [ ! -f "${REPO_FILES_DIR}/etc/third-party/install_third_party_apk.sh" ]; then
            echo "ERROR: Installer script not found:"
            echo "       ${REPO_FILES_DIR}/etc/third-party/install_third_party_apk.sh"
            exit 1
          fi

          # 检查仓库中的 init.d 服务
          if [ ! -f "${REPO_FILES_DIR}/etc/init.d/apk-install" ]; then
            echo "ERROR: Init script not found:"
            echo "       ${REPO_FILES_DIR}/etc/init.d/apk-install"
            exit 1
          fi

          # 复制首次启动安装脚本
          install -m 0755 \
            "${REPO_FILES_DIR}/etc/third-party/install_third_party_apk.sh" \
            "${FIRMWARE_FILES_DIR}/etc/third-party/install_third_party_apk.sh"

          # 复制 init.d 服务
          install -m 0755 \
            "${REPO_FILES_DIR}/etc/init.d/apk-install" \
            "${FIRMWARE_FILES_DIR}/etc/init.d/apk-install"

          test -x \
            "${FIRMWARE_FILES_DIR}/etc/third-party/install_third_party_apk.sh"

          test -x \
            "${FIRMWARE_FILES_DIR}/etc/init.d/apk-install"

          if [ -e "${FIRMWARE_FILES_DIR}/etc/uci-defaults/99-third-party-apk" ]; then
            echo "ERROR: Old uci-defaults installer still exists."
            exit 1
          fi

          echo "Third-party APK integration completed successfully."


      - name: Verify third-party APK integration
        shell: bash
        run: |
          set -Eeuo pipefail

          OPENWRT_DIR="${GITHUB_WORKSPACE}/openwrt"

          echo ">>> Checking third-party APK files"

          test -d "${OPENWRT_DIR}/files/usr/share/third-party"

          APK_COUNT="$(find \
            "${OPENWRT_DIR}/files/usr/share/third-party" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | wc -l)"

          if [ "${APK_COUNT}" -eq 0 ]; then
            echo "ERROR: No APK files are present in firmware files directory."
            exit 1
          fi

          echo "APK count: ${APK_COUNT}"

          echo ">>> Checking installer script"

          test -f "${OPENWRT_DIR}/files/etc/third-party/install_third_party_apk.sh"
          test -x "${OPENWRT_DIR}/files/etc/third-party/install_third_party_apk.sh"

          echo ">>> Checking init.d service"

          test -f "${OPENWRT_DIR}/files/etc/init.d/apk-install"
          test -x "${OPENWRT_DIR}/files/etc/init.d/apk-install"

          echo ">>> Checking obsolete uci-defaults script"

          if [ -e "${OPENWRT_DIR}/files/etc/uci-defaults/99-third-party-apk" ]; then
            echo "ERROR: Obsolete uci-defaults installer still exists."
            exit 1
          fi

          echo ">>> Third-party APK integration verification passed."


      - name: Enable sonic fullcone

        if: ${{ inputs.sonic_fullcone == 'true' }}

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          echo "Enable sonic fullcone"

          echo "Enable sonic fullcone"

          echo "CONFIG_PACKAGE_kmod-nft-fullcone=y" >> .config 


      - name: Apply third-party source packages
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"
          THIRD_PARTY_CONFIG="${{ github.workspace }}/config/Third-Party/third-party.config"

          if [ ! -f "${THIRD_PARTY_CONFIG}" ]; then
            echo "No third-party.config"
            exit 0
          fi

          source "${THIRD_PARTY_CONFIG}"

          if [ -z "${CUSTOM_SOURCE_PACKAGES}" ]; then
            echo "No custom source packages"
            exit 0
          fi

          cd "${SOURCE_DIR}"

          echo "${CUSTOM_SOURCE_PACKAGES}" | while read -r PACKAGE
          do
            PACKAGE=$(echo "${PACKAGE}" | xargs)

            [ -z "${PACKAGE}" ] && continue

            echo "Enable source package: ${PACKAGE}"

            if ! grep -q "^CONFIG_PACKAGE_${PACKAGE}=y$" .config; then
              echo "CONFIG_PACKAGE_${PACKAGE}=y" >> .config
            fi
          done

          echo "=== Third-party source package config ==="

          echo "${CUSTOM_SOURCE_PACKAGES}" | while read -r PACKAGE
          do
            PACKAGE=$(echo "${PACKAGE}" | xargs)

            [ -z "${PACKAGE}" ] && continue

            grep "^CONFIG_PACKAGE_${PACKAGE}=y$" .config || true
          done


      - name: Prepare build download

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          mkdir -p dl

          make download -j$(nproc)


      - name: Check uci-defaults

        shell: bash

        run: |

          set -euxo pipefail

          find openwrt/files/etc/uci-defaults -type f -exec ls -l {} \; || true


      - name: Check LLVM build requirement
        #检查 确认 LLVM 是某个明确的 package 拉进来的
        shell: bash
        run: |
          set -x
          cd "${{ github.workspace }}/openwrt"

          echo "===== Config ====="
          grep -Ei 'LLVM|CLANG|BPF|KSELFTEST|LIBBPF' .config || true

          echo "===== LLVM references ====="
          grep -RniE 'llvm-project-21|llvm-bpf-21|kselftests-bpf|libbpf' \
            package feeds target toolchain 2>/dev/null | head -200 || true


      - name: Build firmware

        shell: bash

        run: |

          set -uo pipefail

          cd "${{ github.workspace }}/openwrt"

          export MAKEFLAGS="-j$(nproc)"
          export HOSTCFLAGS="-Wno-error"
          export HOSTCXXFLAGS="-Wno-error"
          export HOSTLDFLAGS=""

          echo "========================================"
          echo ">>> 开始 OpenWrt 编译"
          echo ">>> CPU: $(nproc)"
          echo "========================================"

          set +e
          make V=s 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "========================================"
          echo ">>> OpenWrt 构建结果"
          echo "========================================"
          echo "make exit code: ${BUILD_RC}"

          if [ "${BUILD_RC}" -ne 0 ]; then
            echo ""
            echo "========== FAILED PACKAGE =========="
            grep -E "ERROR: package/|failed to build" build.log | tail -30 || true

            echo ""
            echo "========== MAKE ERRORS =========="
            grep -E "make\[[0-9]+\]: \*\*\*" build.log | tail -50 || true

            echo ""
            echo "========== COMPILER FATAL ERRORS =========="
            grep -E "fatal error:|error:" build.log | tail -50 || true

            echo ""
            echo "========== LAST 200 LINES =========="
            tail -200 build.log

            exit "${BUILD_RC}"
          fi

          echo ""
          echo "========================================"
          echo ">>> OpenWrt 编译成功"
          echo "========================================"


      - name: Diagnose build failure
        #增加“失败包定位”
        if: failure()
        shell: bash
        run: |
          cd "${{ github.workspace }}/openwrt"

          echo "========================================"
          echo ">>> BUILD FAILURE DIAGNOSTICS"
          echo "========================================"

          if [ ! -f build.log ]; then
            echo "build.log 不存在"
            exit 0
          fi

          echo ""
          echo "===== ERROR ====="
          grep -inE \
           '(^|[^a-z])error([^a-z]|$)|fatal error|failed to build' \
           build.log \
           | tail -n 100 \
           || true

          echo ""
          echo "===== FAILED TARGET ====="
          grep -inE \
           'recipe for target.*failed|No rule to make target|undefined reference' \
           build.log \
           | tail -n 100 \
           || true

          echo ""
          echo "===== FAILED PACKAGE ====="
          grep -inE \
           'ERROR: .*failed to build' \
           build.log \
           | tail -n 100 \
           || true

          echo ""
          echo "===== MAKE ERROR CHAIN ====="
          grep -inE \
           '^make(\[[0-9]+\])?: \*\*\*' \
           build.log \
           | tail -n 100 \
           || true


      - name: Check kmods output
        #临时增加：检测是否有kmod-md-XXX等文件
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          echo "=========================================="
          echo "KMOD directories"
          echo "=========================================="

          find "${SOURCE_DIR}/bin/targets" \
            -type d \
            -path '*/kmods/*' \
            -print | sort || true

          echo "=========================================="
          echo "KMOD APK files"
          echo "=========================================="

          find "${SOURCE_DIR}/bin/targets" \
            -type f \
            -name 'kmod-*.apk' \
            -print | sort || true

          echo "=========================================="
          echo "MD KMOD files"
          echo "=========================================="

          find "${SOURCE_DIR}/bin/targets" \
            -type f \
            \( \
              -name 'kmod-md-mod*.apk' \
              -o -name 'kmod-md-raid0*.apk' \
              -o -name 'kmod-md-raid1*.apk' \
              -o -name 'kmod-md-raid10*.apk' \
            \) \
            -print | sort || true


      - name: Upload build log

        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.device }}-build-log-${{ github.run_id }}

          path: openwrt/build.log

          if-no-files-found: ignore


      - name: Collect firmware

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          mkdir -p "${SOURCE_DIR}/output/firmware"

          find "${SOURCE_DIR}/bin/targets" -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" \) -exec cp -f {} "${SOURCE_DIR}/output/firmware/" \; || true

          find "${SOURCE_DIR}/output/firmware" -type f | sort


      - name: Collect APK feed

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"
          FEED_DIR="${SOURCE_DIR}/output/apk-feed"

          rm -rf "${FEED_DIR}"
          mkdir -p "${FEED_DIR}"

          echo "=========================================="
          echo "Collect official APK feeds"
          echo "=========================================="

          # 普通架构软件包：
          # openwrt/bin/packages/<arch>/<feed>/
          if [ -d "${SOURCE_DIR}/bin/packages" ]; then
            mkdir -p "${FEED_DIR}/packages"

            cp -rf \
              "${SOURCE_DIR}/bin/packages/." \
              "${FEED_DIR}/packages/" \
              || true
          fi

          echo "=========================================="
          echo "Collect target APK feed and kmods"
          echo "=========================================="

          # target packages：
          # openwrt/bin/targets/x86/64/packages/
          if [ -d "${SOURCE_DIR}/bin/targets" ]; then
            mkdir -p "${FEED_DIR}/targets"

            cp -rf \
              "${SOURCE_DIR}/bin/targets/." \
              "${FEED_DIR}/targets/" \
              || true
          fi

          echo "=========================================="
          echo "Collect third-party APK packages"
          echo "=========================================="

          if compgen -G "${SOURCE_DIR}/packages/*.apk" > /dev/null; then
            mkdir -p "${FEED_DIR}/third-party"

            cp -f \
              "${SOURCE_DIR}"/packages/*.apk \
              "${FEED_DIR}/third-party/"
          fi

          echo "=========================================="
          echo "Collected APK feed"
          echo "=========================================="

          find "${FEED_DIR}" -type f | sort


      - name: Generate LuCI and third-party package lists
        # 生成 ${device}-luci.md，并额外生成 ${device}-third-party.md
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p release

          LUCI_LIST="release/${{ inputs.device }}-luci.md"
          THIRD_PARTY_LIST="release/${{ inputs.device }}-third-party.md"

          echo "#### ${{ inputs.device }}" > "${LUCI_LIST}"

          echo "" >> "${LUCI_LIST}"

          grep "^CONFIG_PACKAGE_luci" \
            openwrt/.config \
            | grep "=y" \
            | sed 's/CONFIG_PACKAGE_//' \
            | sed 's/=y//' \
            | sed 's/_/\\_/g' \
            | sed 's/^/- /' \
            >> "${LUCI_LIST}"

          echo "LuCI package list:"
          cat "${LUCI_LIST}"

          echo "third-party package list" > "${THIRD_PARTY_LIST}"

          echo "" >> "${THIRD_PARTY_LIST}"

          THIRD_PARTY_SOURCE="openwrt/tmp/third-party-packages"

          if [ -f "${THIRD_PARTY_SOURCE}" ]; then
            awk '
              NF {
                print "- " $0
              }
            ' "${THIRD_PARTY_SOURCE}" \
              >> "${THIRD_PARTY_LIST}"
          else
            echo "None" >> "${THIRD_PARTY_LIST}"
          fi

          echo "Third-party package list:"
          cat "${THIRD_PARTY_LIST}"


      - name: Prepare artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifact/${{ inputs.device }}

          cp -rf openwrt/output/firmware \
            artifact/${{ inputs.device }}/ || true

          cp -rf openwrt/output/apk-feed \
            artifact/${{ inputs.device }}/ || true

          cp -f release/${{ inputs.device }}-luci.md \
            artifact/${{ inputs.device }}/ || true

          cp -f release/${{ inputs.device }}-third-party.md \
            artifact/${{ inputs.device }}/ || true

          echo "Prepared artifact files:"
          find artifact -type f | sort


      - name: Upload firmware artifact

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.device }}-firmware-${{ github.run_id }}

          path: |
          
            artifact/${{ inputs.device }}/*-luci.md
            artifact/${{ inputs.device }}/*-third-party.md
          
          if-no-files-found: warn


      - name: Upload APK feed artifact

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.device }}-apk-feed-${{ github.run_id }}

          path: artifact/${{ inputs.device }}/apk-feed

          if-no-files-found: error


      - name: Upload release info artifact

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.device }}-release-info-${{ github.run_id }}

          path: release/${{ inputs.device }}-luci.md

          if-no-files-found: error
