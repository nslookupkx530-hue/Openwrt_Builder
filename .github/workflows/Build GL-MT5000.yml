name: Build GL-MT5000

on:

  workflow_dispatch:

    inputs:

      third_party:

        description: Enable third-party packages

        required: false

        default: disabled

        type: choice

        options:

         - disabled
         - enabled

      docker:

        description: Enable docker packages

        required: false

        default: false

        type: boolean

      release:

        description: Create GitHub release

        required: false

        default: false

        type: boolean


  schedule:

    - cron: "0 2 1 1,7 *"


concurrency:

  group: GL-MT5000-build

  cancel-in-progress: true


permissions:

  contents: write


jobs:


  build-standard:


    if: ${{ github.event_name == 'schedule' || inputs.third_party == 'disabled' }}


    uses: ./.github/workflows/_openwrt-build-device.yml


    with:

      device: GL-MT5000

      repo_url: https://github.com/m0eak/fanchmwrt.git

      repo_branch: mt5000

      config_file: config/mt5000.config

      sonic_fullcone: "true"

      third_party: disabled

      docker: ${{ inputs.docker }}

      release: ${{ inputs.release }}



  build-third-party:


    if: ${{ inputs.third_party == 'enabled' }}


    uses: ./.github/workflows/_openwrt-build-device_DSF.yml


    with:

      device: GL-MT5000

      repo_url: https://github.com/m0eak/fanchmwrt.git

      repo_branch: mt5000

      config_file: config/mt5000.config

      sonic_fullcone: "true"

      third_party: enabled

      docker: ${{ inputs.docker }}

      release: ${{ inputs.release }}
