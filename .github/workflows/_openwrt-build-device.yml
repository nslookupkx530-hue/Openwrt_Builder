name: OpenWrt Build Device


on:

  workflow_call:

    inputs:


      device:

        description: Device name

        required: true

        type: string



      repo_url:

        description: Source repository

        required: true

        type: string



      repo_branch:

        description: Source branch

        required: true

        type: string



      config_file:

        description: Config file path

        required: true

        type: string



      workflow_name:

        description: Build name

        required: false

        default: OpenWrt Build

        type: string



      install_automake_117:

        description: Install automake compatibility

        required: false

        default: "false"

        type: string



      sonic_fullcone:

        description: Enable fullcone

        required: false

        default: "false"

        type: string



      extra_config_file:

        description: Extra config

        required: false

        default: ""

        type: string



      docker:

        description: Enable docker

        required: false

        default: "false"

        type: string



      release:

        description: Upload release

        required: false

        default: "true"

        type: string





env:


  TZ: Asia/Shanghai


  WORKDIR: /workdir


  OPENWRT_PATH: /workdir/openwrt





permissions:


  contents: write





jobs:


  build:


    name: ${{ inputs.device }}


    runs-on: ubuntu-22.04





    steps:




      - name: Checkout builder

        uses: actions/checkout@v4






      - name: Free disk space

        shell: bash

        run: |

          set -euxo pipefail


          sudo rm -rf /usr/share/dotnet || true

          sudo rm -rf /usr/local/lib/android || true

          sudo rm -rf /opt/ghc || true


          sudo docker image prune -af || true


          df -h






      - name: Install dependencies

        shell: bash

        run: |

          set -euxo pipefail



          sudo apt-get update



          sudo apt-get install -y \

            curl \

            rsync \

            dos2unix \

            build-essential \

            libfuse-dev







      - name: Prepare workspace

        shell: bash

        run: |

          set -euxo pipefail



          sudo mkdir -p "${WORKDIR}"



          sudo chown -R "${USER}:${USER}" "${WORKDIR}"



          sudo timedatectl set-timezone "${TZ}"







      - name: Init ImmortalWrt build environment

        shell: bash

        run: |

          set -euxo pipefail



          curl -L \

          https://build-scripts.immortalwrt.org/init_build_environment.sh \

          -o /tmp/init_build_environment.sh





          chmod +x /tmp/init_build_environment.sh





          sudo bash /tmp/init_build_environment.sh







      - name: Clone ImmortalWrt source

        shell: bash

        working-directory: /workdir

        run: |

          set -euxo pipefail





          rm -rf openwrt





          git clone \

            --branch "${{ inputs.repo_branch }}" \

            "${{ inputs.repo_url }}" \

            openwrt






          cd openwrt





          echo "===== Git ====="



          git branch



          git log -1 --oneline





          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"







      - name: Verify source

        shell: bash

        run: |

          set -euxo pipefail



          test -f "${OPENWRT_PATH}/Makefile"



          echo "OpenWrt source OK"

name: OpenWrt Build Device


on:

  workflow_call:

    inputs:


      device:

        description: Device name

        required: true

        type: string



      repo_url:

        description: Source repository

        required: true

        type: string



      repo_branch:

        description: Source branch

        required: true

        type: string



      config_file:

        description: Config file path

        required: true

        type: string



      workflow_name:

        description: Build name

        required: false

        default: OpenWrt Build

        type: string



      install_automake_117:

        description: Install automake compatibility

        required: false

        default: "false"

        type: string



      sonic_fullcone:

        description: Enable fullcone

        required: false

        default: "false"

        type: string



      extra_config_file:

        description: Extra config

        required: false

        default: ""

        type: string



      docker:

        description: Enable docker

        required: false

        default: "false"

        type: string



      release:

        description: Upload release

        required: false

        default: "true"

        type: string





env:


  TZ: Asia/Shanghai


  WORKDIR: /workdir


  OPENWRT_PATH: /workdir/openwrt





permissions:


  contents: write





jobs:


  build:


    name: ${{ inputs.device }}


    runs-on: ubuntu-22.04





    steps:




      - name: Checkout builder

        uses: actions/checkout@v4






      - name: Free disk space

        shell: bash

        run: |

          set -euxo pipefail


          sudo rm -rf /usr/share/dotnet || true

          sudo rm -rf /usr/local/lib/android || true

          sudo rm -rf /opt/ghc || true


          sudo docker image prune -af || true


          df -h






      - name: Install dependencies

        shell: bash

        run: |

          set -euxo pipefail



          sudo apt-get update



          sudo apt-get install -y \

            curl \

            rsync \

            dos2unix \

            build-essential \

            libfuse-dev







      - name: Prepare workspace

        shell: bash

        run: |

          set -euxo pipefail



          sudo mkdir -p "${WORKDIR}"



          sudo chown -R "${USER}:${USER}" "${WORKDIR}"



          sudo timedatectl set-timezone "${TZ}"







      - name: Init ImmortalWrt build environment

        shell: bash

        run: |

          set -euxo pipefail



          curl -L \

          https://build-scripts.immortalwrt.org/init_build_environment.sh \

          -o /tmp/init_build_environment.sh





          chmod +x /tmp/init_build_environment.sh





          sudo bash /tmp/init_build_environment.sh







      - name: Clone ImmortalWrt source

        shell: bash

        working-directory: /workdir

        run: |

          set -euxo pipefail





          rm -rf openwrt





          git clone \

            --branch "${{ inputs.repo_branch }}" \

            "${{ inputs.repo_url }}" \

            openwrt






          cd openwrt





          echo "===== Git ====="



          git branch



          git log -1 --oneline





          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"







      - name: Verify source

        shell: bash

        run: |

          set -euxo pipefail



          test -f "${OPENWRT_PATH}/Makefile"



          echo "OpenWrt source OK"

      #
      # 编译固件
      #

      - name: Compile firmware

        id: compile

        shell: bash

        working-directory: ${{ env.OPENWRT_PATH }}

        run: |

          set -euxo pipefail


          echo "================================"

          echo " Build ${{ inputs.device }} "

          echo "================================"



          make -j$(nproc) V=s



          echo "compile_success=true" >> "$GITHUB_OUTPUT"








      #
      # 检查输出
      #

      - name: Check build output

        if: always()

        shell: bash

        working-directory: ${{ env.OPENWRT_PATH }}

        run: |


          set +e



          echo "===== TARGET DIRECTORY ====="



          find bin/targets \

            -maxdepth 5 \

            -type f \

            | sort




          echo ""

          echo "===== APK FILES ====="



          find bin \

            -type f \

            \( \

              -name "*.apk" \

              -o -name "packages.adb" \

            \) \

            | sort








      #
      # 上传固件
      #

      - name: Upload firmware


        if: steps.compile.outputs.compile_success == 'true'


        uses: actions/upload-artifact@v4



        with:



          name: firmware-${{ inputs.device }}-${{ github.run_number }}



          path: |


            /workdir/openwrt/bin/targets/**



          if-no-files-found: warn



          retention-days: 30







      #
      # 上传 target APK feed
      #

      - name: Upload target APK feed


        if: steps.compile.outputs.compile_success == 'true'


        uses: actions/upload-artifact@v4



        with:



          name: target-apk-${{ inputs.device }}-${{ github.run_number }}



          path: |


            /workdir/openwrt/bin/targets/**/packages/**


            /workdir/openwrt/bin/targets/**/packages.adb




          if-no-files-found: warn



          retention-days: 90







      #
      # 上传普通 APK feed
      #

      - name: Upload packages APK feed


        if: steps.compile.outputs.compile_success == 'true'


        uses: actions/upload-artifact@v4



        with:



          name: packages-apk-${{ inputs.device }}-${{ github.run_number }}



          path: |


            /workdir/openwrt/bin/packages/**




          if-no-files-found: warn



          retention-days: 90







      #
      # 上传编译信息
      #

      - name: Upload build info


        if: always()


        uses: actions/upload-artifact@v4



        with:



          name: build-info-${{ inputs.device }}-${{ github.run_number }}



          path: |


            /workdir/openwrt/.config


            /workdir/openwrt/.github-feed-lock/**


            /workdir/openwrt/bin/targets/**/*.buildinfo


            /workdir/openwrt/bin/targets/**/*.manifest


            /workdir/openwrt/bin/targets/**/*sha256sums



          if-no-files-found: ignore



          retention-days: 30







      #
      # GitHub Release
      #

      - name: Create GitHub Release


        if: steps.compile.outputs.compile_success == 'true' && inputs.release == 'true'


        uses: softprops/action-gh-release@v2



        with:



          tag_name: ${{ inputs.device }}-${{ github.run_number }}



          name: OpenWrt ${{ inputs.device }} Build ${{ github.run_number }}



          files: |


            /workdir/openwrt/bin/targets/**/*



        env:



          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}







      #
      # 构建总结
      #

      - name: Build summary


        if: always()


        shell: bash


        run: |


          echo "================================"

          echo " OpenWrt Build Summary "

          echo "================================"



          echo "Device:"

          echo "${{ inputs.device }}"



          echo ""

          echo "Branch:"

          echo "${{ inputs.repo_branch }}"



          echo ""

          echo "Commit:"

          echo "${OPENWRT_COMMIT:-unknown}"



          echo ""

          echo "Disk:"

          df -hT
