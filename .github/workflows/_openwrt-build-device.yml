name: OpenWrt Build Device


on:

  workflow_call:

    inputs:


      device:

        description: Device name

        required: true

        type: string



      repo_url:

        description: Source repository

        required: true

        type: string



      repo_branch:

        description: Source branch

        required: true

        type: string



      config_file:

        description: Config file

        required: true

        type: string



      workflow_name:

        description: Workflow name

        required: true

        type: string



      install_automake_117:

        description: Install automake 1.17

        required: false

        default: "false"

        type: string



      sonic_fullcone:

        description: Enable fullcone

        required: false

        default: "false"

        type: string



      extra_config_file:

        description: Extra config file

        required: false

        default: ""

        type: string





env:


  TZ: Asia/Shanghai


  WORKDIR: /workdir


  OPENWRT_PATH: /workdir/openwrt




jobs:


  build:



    name: Build ${{ inputs.device }}



    runs-on: ubuntu-22.04



    steps:




    - name: Checkout

      uses: actions/checkout@v4





    - name: Free disk space

      shell: bash

      run: |

        set -euxo pipefail



        sudo rm -rf /usr/share/dotnet || true

        sudo rm -rf /usr/local/lib/android || true

        sudo rm -rf /opt/ghc || true



        sudo docker image prune -af || true



        df -hT






    - name: Init build environment

      shell: bash

      run: |

        set -euxo pipefail



        sudo apt-get update



        sudo apt-get install -y \

          curl \

          rsync \

          dos2unix \

          libfuse-dev \

          build-essential





        sudo curl -L \

          https://build-scripts.immortalwrt.org/init_build_environment.sh \

          -o /tmp/init_build_environment.sh





        sudo chmod +x /tmp/init_build_environment.sh



        sudo bash /tmp/init_build_environment.sh





        sudo timedatectl set-timezone "$TZ"





    - name: Install automake 1.17

      if: inputs.install_automake_117 == 'true'

      shell: bash

      run: |

        set -euxo pipefail



        sudo apt-get install -y automake autoconf

    #
    # Clone OpenWrt source
    #

    - name: Clone source

      shell: bash

      working-directory: ${{ env.WORKDIR }}

      run: |

        set -euxo pipefail



        rm -rf openwrt



        git clone \

          --depth=1 \

          "${{ inputs.repo_url }}" \

          openwrt





        cd openwrt





        git fetch --tags





        git checkout "${{ inputs.repo_branch }}"





        echo "===== Source ====="

        git log -1 --oneline

        git remote -v





        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV






    #
    # Verify source
    #

    - name: Verify source

      shell: bash

      run: |

        set -euxo pipefail



        test -f "${OPENWRT_PATH}/Makefile"



        echo "OpenWrt source OK"






    #
    # Apply feeds configuration
    #

    - name: Apply feeds configuration


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |

        set -euxo pipefail





        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then



          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \

          feeds.conf.default



        fi





        echo "===== feeds.conf ====="



        cat feeds.conf.default






    #
    # Update feeds and lock
    #

    - name: Update feeds


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |

        set -euxo pipefail





        ./scripts/feeds update -a





        mkdir -p .github-feed-lock






        for feed in feeds/*; do



          if [ -d "$feed/.git" ]; then



            name=$(basename "$feed")



            (

              cd "$feed"



              git rev-parse HEAD \

              > "../../.github-feed-lock/${name}.commit"



            )



          fi



        done





        echo "===== Feed lock ====="



        cat .github-feed-lock/* || true






    #
    # Install feeds
    #

    - name: Install feeds


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |

        set -euxo pipefail



        ./scripts/feeds install -a






    #
    # Load device config
    #

    - name: Load config


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |

        set -euxo pipefail





        echo "Using config:"


        echo "${{ inputs.config_file }}"





        cp "${GITHUB_WORKSPACE}/${{ inputs.config_file }}" .config





        if [ -n "${{ inputs.extra_config_file }}" ]; then



          if [ -f "${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}" ]; then



            cat "${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}" \

            >> .config



          fi



        fi






        echo "===== Target ====="



        grep "^CONFIG_TARGET" .config || true






    #
    # Enable fullcone
    #

    - name: Enable sonic fullcone


      if: inputs.sonic_fullcone == 'true'


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |

        set -euxo pipefail





        echo "CONFIG_PACKAGE_kmod-ipt-fullcone=y" >> .config



        echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" >> .config






    #
    # Defconfig
    #

    - name: Defconfig


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |

        set -euxo pipefail





        make defconfig





        echo "===== diffconfig ====="



        ./scripts/diffconfig.sh || true






    #
    # Cache
    #

    - name: Generate cache key


      id: cache-key


      shell: bash


      run: |

        set -euxo pipefail





        HASH=$(sha256sum \

        "${OPENWRT_PATH}/.config" \

        "${OPENWRT_PATH}/feeds.conf.default" \

        "${OPENWRT_PATH}/.github-feed-lock/"* 2>/dev/null \

        | sha256sum | cut -d' ' -f1)





        echo "key=${{ runner.os }}-${{ inputs.device }}-${HASH}" >> $GITHUB_OUTPUT

    #
    # Restore cache
    #

    - name: Restore build cache

      uses: actions/cache@v4


      with:


        key: ${{ steps.cache-key.outputs.key }}



        restore-keys: |

          ${{ runner.os }}-${{ inputs.device }}-




        path: |


          /workdir/openwrt/dl


          /workdir/openwrt/build_dir


          /workdir/openwrt/staging_dir







    #
    # Download packages
    #

    - name: Download packages


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |

        set -euxo pipefail



        make download -j$(nproc)



        find dl -size -1024c -delete



        du -sh dl






    #
    # Compile firmware
    #

    - name: Compile firmware


      id: compile


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |

        set -euxo pipefail



        echo "=============================="


        echo " Build ${{ inputs.device }}"


        echo "=============================="





        make -j$(nproc) || make -j1 V=s





        echo "compile=success" >> $GITHUB_OUTPUT





        echo "===== Build output ====="



        find bin/targets \

          -maxdepth 5 \

          -type f \

          -printf "%p %s bytes\n" \

          | sort






    #
    # Check target packages
    #

    - name: Check target APK packages


      if: always()


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |



        echo "===== Target packages ====="



        find bin/targets \

          -type f \

          \( \

          -name "*.apk" \

          -o -name "packages.adb" \

          \) \

          | sort || true







    #
    # Upload firmware
    #

    - name: Upload firmware


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:


        name: firmware-${{ inputs.device }}



        path: |


          openwrt/bin/targets/**/*



        if-no-files-found: error



        retention-days: 30







    #
    # Upload target APK feed
    #
    # 包含:
    #
    # packages.adb
    # kernel.apk
    # kmod-*.apk
    #

    - name: Upload target APK feed


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:


        name: target-packages-${{ inputs.device }}



        path: |


          openwrt/bin/targets/**/packages/**



        if-no-files-found: error



        retention-days: 90







    #
    # Upload normal APK feed
    #
    # base/luci/packages/routing
    #

    - name: Upload package feed


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:


        name: package-feed-${{ inputs.device }}



        path: |


          openwrt/bin/packages/**/*



        if-no-files-found: error



        retention-days: 90







    #
    # Upload config
    #

    - name: Upload build config


      if: always()


      uses: actions/upload-artifact@v4



      with:


        name: config-${{ inputs.device }}



        path: |


          openwrt/.config


          openwrt/.github-feed-lock/**



        if-no-files-found: ignore



        retention-days: 30







    #
    # GitHub Release
    #

    - name: Create Release


      if: steps.compile.outputs.compile == 'success'


      uses: softprops/action-gh-release@v2



      with:


        tag_name: ${{ inputs.device }}-${{ github.run_number }}



        name: ${{ inputs.workflow_name }} Build ${{ github.run_number }}



        files: |


          openwrt/bin/targets/**/*



      env:


        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}








    #
    # Summary
    #

    - name: Build summary


      if: always()


      shell: bash


      run: |


        echo "================================"


        echo "Device:"


        echo "${{ inputs.device }}"



        echo ""


        echo "Source:"


        echo "${{ inputs.repo_url }}"



        echo ""


        echo "Branch:"


        echo "${{ inputs.repo_branch }}"



        echo ""


        echo "Commit:"


        echo "${OPENWRT_COMMIT}"



        echo ""


        df -hT
