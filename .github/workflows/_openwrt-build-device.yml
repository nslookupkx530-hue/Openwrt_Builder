name: OpenWrt Build Device


on:


  workflow_call:


    inputs:


      device:


        required: true


        type: string



      repo_url:


        required: true


        type: string



      repo_branch:


        required: true


        type: string



      config_file:


        required: true


        type: string



      sonic_fullcone:


        required: false


        type: string


        default: "false"





jobs:



  build:



    name: Build ${{ inputs.device }}


    runs-on: ubuntu-22.04





    steps:



      - name: Checkout builder repository


        uses: actions/checkout@v4





      - name: Install dependencies


        shell: bash


        run: |


          set -euxo pipefail


          sudo apt-get update


          sudo apt-get install -y build-essential clang flex bison gawk gcc g++ gettext git libncurses-dev libssl-dev python3 rsync unzip wget zstd curl dos2unix





      - name: Clone OpenWrt source


        shell: bash


        run: |


          set -euxo pipefail


          rm -rf /workdir


          mkdir -p /workdir


          git clone --depth=1 --branch "${{ inputs.repo_branch }}" "${{ inputs.repo_url }}" /workdir/openwrt





      - name: Prepare config


        shell: bash


        env:


          CONFIG_FILE: ${{ inputs.config_file }}


        run: |


          set -euxo pipefail


          cd /workdir/openwrt


          echo "Using config:"


          echo "${{ github.workspace }}/${CONFIG_FILE}"


          cp "${{ github.workspace }}/${CONFIG_FILE}" .config


          make defconfig V=s



      - name: Update feeds


        shell: bash


        run: |


          set -euxo pipefail


          cd /workdir/openwrt


          ./scripts/feeds update -a


          ./scripts/feeds install -a





      - name: Enable sonic fullcone


        if: ${{ inputs.sonic_fullcone == 'true' }}


        shell: bash


        run: |


          set -euxo pipefail


          cd /workdir/openwrt


          echo "Enable sonic fullcone"


          grep -q "CONFIG_PACKAGE_smartdns" .config || true


          echo "CONFIG_PACKAGE_luci-app-ssr-plus=y" >> .config || true


          make defconfig





      - name: Prepare build


        shell: bash


        run: |


          set -euxo pipefail


          cd /workdir/openwrt


          mkdir -p dl


          make download -j$(nproc)





      - name: Build firmware


        shell: bash


        run: |


          set -euxo pipefail


          cd /workdir/openwrt


          make -j$(nproc) V=s





      - name: Check build output


        shell: bash


        run: |


          set -euxo pipefail


          cd /workdir/openwrt


          echo "=============================="


          echo "Build output"


          echo "=============================="


          find bin -type f | sort



      - name: Collect firmware


        shell: bash


        run: |


          set -euxo pipefail


          cd /workdir/openwrt


          mkdir -p output/firmware


          find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" \) -exec cp -f {} output/firmware/ \; || true





      - name: Collect APK feed


        shell: bash


        run: |


          set -euxo pipefail


          cd /workdir/openwrt


          mkdir -p output/apk-feed





          find bin/packages -type f -name "*.apk" -exec cp -f {} output/apk-feed/ \; || true


          find bin/packages -type f -name "packages.adb" -exec cp -f {} output/apk-feed/ \; || true





          echo "APK files:"


          find output/apk-feed -type f | sort





      - name: Create artifact directory


        shell: bash


        run: |


          set -euxo pipefail





          mkdir -p artifact/${{ inputs.device }}





          cp -rf output/firmware artifact/${{ inputs.device }}/ || true


          cp -rf output/apk-feed artifact/${{ inputs.device }}/ || true





          echo "Artifact content:"


          find artifact -type f | sort





      - name: Upload firmware artifact


        uses: actions/upload-artifact@v4


        with:


          name: ${{ inputs.device }}-firmware-${{ github.run_id }}


          path: artifact/${{ inputs.device }}/firmware


          if-no-files-found: ignore





      - name: Upload APK feed artifact


        uses: actions/upload-artifact@v4


        with:


          name: ${{ inputs.device }}-apk-feed-${{ github.run_id }}


          path: artifact/${{ inputs.device }}/apk-feed


          if-no-files-found: ignore
