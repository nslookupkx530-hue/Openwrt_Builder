name: OpenWrt Build Device


on:

  workflow_call:


    inputs:


      device:


        description: Device name


        required: true


        type: string



      repo_url:


        description: Source repository


        required: true


        type: string



      repo_branch:


        description: Source branch


        required: true


        type: string



      config_file:


        description: Config file


        required: true


        type: string



      workflow_name:


        description: Build name


        required: false


        default: OpenWrt Build


        type: string



      install_automake_117:


        description: Install automake compatibility


        required: false


        default: "false"


        type: string



      sonic_fullcone:


        description: Enable fullcone


        required: false


        default: "false"


        type: string



      docker:


        description: Enable docker


        required: false


        default: "false"


        type: string



      extra_config_file:


        description: Extra config file


        required: false


        default: ""


        type: string



      release:


        description: Create release


        required: false


        default: "true"


        type: string





env:


  TZ: Asia/Shanghai


  WORKDIR: /workdir


  OPENWRT_PATH: /workdir/openwrt





permissions:


  contents: write





jobs:


  build:


    name: ${{ inputs.device }}


    runs-on: ubuntu-22.04



    steps:





      - name: Checkout


        uses: actions/checkout@v4






      - name: Free disk space


        shell: bash


        run: |


          set -euxo pipefail


          sudo rm -rf /usr/share/dotnet || true


          sudo rm -rf /usr/local/lib/android || true


          sudo rm -rf /opt/ghc || true


          sudo docker image prune -af || true


          df -h






      - name: Install dependencies


        shell: bash


        run: |


          set -euxo pipefail


          sudo apt-get update


          sudo apt-get install -y \


            build-essential \


            curl \


            rsync \


            dos2unix \


            libfuse-dev






      - name: Prepare workspace


        shell: bash


        run: |


          set -euxo pipefail


          sudo mkdir -p "${WORKDIR}"


          sudo chown "${USER}:${USER}" "${WORKDIR}"


          sudo timedatectl set-timezone "${TZ}"






      - name: Clone OpenWrt source


        shell: bash


        working-directory: /workdir


        run: |


          set -euxo pipefail


          rm -rf openwrt


          git clone \


            --branch "${{ inputs.repo_branch }}" \


            "${{ inputs.repo_url }}" \


            openwrt


          cd openwrt


          git log -1 --oneline


          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"






      - name: Verify source


        shell: bash


        run: |


          set -euxo pipefail


          test -f "${OPENWRT_PATH}/Makefile"


          echo "Source OK"

      #
      # 更新 feeds
      #

      - name: Update feeds


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail



          ./scripts/feeds update -a



          ./scripts/feeds install -a







      #
      # 导入配置
      #

      - name: Load config


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail



          echo "Using config:"


          echo "${{ inputs.config_file }}"





          if [ ! -f "${GITHUB_WORKSPACE}/${{ inputs.config_file }}" ]; then


            echo "ERROR: config file missing"


            ls -la "${GITHUB_WORKSPACE}/config" || true


            exit 1


          fi






          cp "${GITHUB_WORKSPACE}/${{ inputs.config_file }}" .config






          #
          # 追加额外配置
          #

          if [ -n "${{ inputs.extra_config_file }}" ]; then



            if [ -f "${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}" ]; then



              echo "Apply extra config"



              cat "${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}" >> .config



            fi



          fi





          echo "===== TARGET ====="



          grep "^CONFIG_TARGET" .config || true







      #
      # automake 1.17 兼容
      #

      - name: Install automake compatibility


        if: inputs.install_automake_117 == 'true'


        shell: bash


        run: |


          set -euxo pipefail



          sudo apt-get update



          sudo apt-get install -y automake autoconf libtool






      #
      # sonic fullcone
      #

      - name: Enable fullcone


        if: inputs.sonic_fullcone == 'true'


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail



          echo "Enable fullcone"



          echo "CONFIG_PACKAGE_kmod-nft-fullcone=y" >> .config



          echo "CONFIG_PACKAGE_luci-app-fullconenat=y" >> .config







      #
      # docker
      #

      - name: Enable docker


        if: inputs.docker == 'true'


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail



          echo "Enable docker"



          cat >> .config <<'EOF'


CONFIG_PACKAGE_dockerd=y

CONFIG_PACKAGE_docker=y

CONFIG_PACKAGE_luci-app-dockerman=y


EOF







      #
      # 生成最终配置
      #

      - name: Defconfig


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail



          make defconfig



          echo "===== CONFIG SUMMARY ====="



          ./scripts/diffconfig.sh || true







      #
      # 缓存 key
      #

      - name: Generate cache key


        id: cache


        shell: bash


        run: |


          set -euxo pipefail



          HASH=$(sha256sum \


          "${OPENWRT_PATH}/.config" \


          "${OPENWRT_PATH}/feeds.conf.default" \


          | sha256sum | cut -d' ' -f1)



          echo "key=openwrt-${{ inputs.device }}-${HASH}" >> "$GITHUB_OUTPUT"








      #
      # Cache
      #

      - name: Restore build cache


        uses: actions/cache@v4


        with:



          key: ${{ steps.cache.outputs.key }}



          restore-keys: |


            openwrt-${{ inputs.device }}-



          path: |


            /workdir/openwrt/dl


            /workdir/openwrt/build_dir


            /workdir/openwrt/staging_dir







      #
      # 下载源码包
      #

      - name: Download packages


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail



          make download -j$(nproc)



          find dl -size -1024c -delete



          du -sh dl

      #
      # 编译固件
      #

      - name: Compile firmware


        id: compile


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set -euxo pipefail



          echo "=================================="


          echo " Building ${{ inputs.device }}"


          echo "=================================="





          make -j$(nproc) V=s





          echo "success=true" >> "$GITHUB_OUTPUT"








      #
      # 检查生成文件
      #

      - name: Check firmware output


        if: always()


        shell: bash


        working-directory: ${{ env.OPENWRT_PATH }}


        run: |


          set +e



          echo "===== TARGET FILES ====="



          find bin/targets \


            -type f \


            | sort





          echo ""



          echo "===== APK FEED ====="



          find bin \


            -type f \


            \( \


              -name "*.apk" \


              -o -name "packages.adb" \


            \) \


            | sort







      #
      # 上传固件
      #

      - name: Upload firmware


        if: steps.compile.outputs.success == 'true'


        uses: actions/upload-artifact@v4



        with:



          name: firmware-${{ inputs.device }}-${{ github.run_number }}



          path: |


            /workdir/openwrt/bin/targets/**



          if-no-files-found: warn



          retention-days: 30







      #
      # 上传 target APK feed
      #

      - name: Upload target APK feed


        if: steps.compile.outputs.success == 'true'


        uses: actions/upload-artifact@v4



        with:



          name: apk-target-${{ inputs.device }}-${{ github.run_number }}



          path: |


            /workdir/openwrt/bin/targets/**/packages/**


            /workdir/openwrt/bin/targets/**/packages.adb



          if-no-files-found: warn



          retention-days: 90







      #
      # 上传普通 APK feed
      #

      - name: Upload packages APK feed


        if: steps.compile.outputs.success == 'true'


        uses: actions/upload-artifact@v4



        with:



          name: apk-packages-${{ inputs.device }}-${{ github.run_number }}



          path: |


            /workdir/openwrt/bin/packages/**



          if-no-files-found: warn



          retention-days: 90







      #
      # 上传编译信息
      #

      - name: Upload build information


        if: always()


        uses: actions/upload-artifact@v4



        with:



          name: build-info-${{ inputs.device }}-${{ github.run_number }}



          path: |


            /workdir/openwrt/.config


            /workdir/openwrt/bin/targets/**/*.manifest


            /workdir/openwrt/bin/targets/**/*.buildinfo


            /workdir/openwrt/bin/targets/**/*sha256sums



          if-no-files-found: ignore



          retention-days: 30







      #
      # GitHub Release
      #

      - name: Create GitHub Release


        if: steps.compile.outputs.success == 'true' && inputs.release == 'true'


        uses: softprops/action-gh-release@v2



        with:



          tag_name: ${{ inputs.device }}-${{ github.run_number }}



          name: "${{ inputs.device }} ImmortalWrt Build ${{ github.run_number }}"



          files: |


            /workdir/openwrt/bin/targets/**/*



        env:



          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}








      #
      # Summary
      #

      - name: Build summary


        if: always()


        shell: bash


        run: |


          echo "=================================="


          echo " OpenWrt Build Summary "


          echo "=================================="



          echo "Device:"


          echo "${{ inputs.device }}"



          echo ""



          echo "Repository:"


          echo "${{ inputs.repo_url }}"



          echo ""



          echo "Branch:"


          echo "${{ inputs.repo_branch }}"



          echo ""



          echo "Commit:"


          echo "${OPENWRT_COMMIT:-unknown}"



          echo ""



          df -hT
