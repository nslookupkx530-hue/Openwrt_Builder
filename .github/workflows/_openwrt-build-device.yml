name: OpenWrt Build Device


on:

  workflow_call:

    inputs:


      device:

        description: Device name

        required: true

        type: string



      repo_url:

        description: Source repository

        required: true

        type: string



      repo_branch:

        description: Source branch or tag

        required: true

        type: string



      config_file:

        description: Config file

        required: true

        type: string



      workflow_name:

        description: Workflow name

        required: true

        type: string



      install_automake_117:

        description: Install automake

        required: false

        default: "false"

        type: string



      sonic_fullcone:

        description: Enable fullcone

        required: false

        default: "false"

        type: string



      extra_config_file:

        description: Extra config

        required: false

        default: ""

        type: string





env:


  TZ: Asia/Shanghai


  WORKDIR: /workdir


  OPENWRT_PATH: /workdir/openwrt





jobs:


  build:



    name: Build ${{ inputs.device }}



    runs-on: ubuntu-22.04



    steps:




    - name: Checkout

      uses: actions/checkout@v4






    - name: Free disk space


      shell: bash


      run: |


        set -euxo pipefail



        sudo rm -rf /usr/share/dotnet || true


        sudo rm -rf /usr/local/lib/android || true


        sudo rm -rf /opt/ghc || true



        sudo docker image prune -af || true



        df -hT






    - name: Init build environment


      shell: bash


      run: |


        set -euxo pipefail



        sudo apt-get update



        sudo apt-get install -y \

          curl \

          rsync \

          dos2unix \

          libfuse-dev \

          build-essential






        curl -L \

          https://build-scripts.immortalwrt.org/init_build_environment.sh \

          -o /tmp/init.sh





        chmod +x /tmp/init.sh



        sudo bash /tmp/init.sh





        sudo timedatectl set-timezone "$TZ"







    - name: Install automake


      if: inputs.install_automake_117 == 'true'


      shell: bash


      run: |


        sudo apt-get install -y automake autoconf

    #
    # Clone OpenWrt source
    #

    - name: Clone source

      shell: bash

      working-directory: ${{ env.WORKDIR }}

      run: |

        set -euxo pipefail



        rm -rf openwrt





        git clone \

          --filter=blob:none \

          --no-checkout \

          "${{ inputs.repo_url }}" \

          openwrt





        cd openwrt





        echo "===== Fetch tags ====="



        git fetch --tags --force





        echo "===== Checkout ====="



        git checkout "${{ inputs.repo_branch }}"





        echo "===== SOURCE ====="



        git log -1 --oneline



        git status



        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV






    #
    # Verify source
    #

    - name: Verify OpenWrt source


      shell: bash


      run: |


        set -euxo pipefail



        test -f "${OPENWRT_PATH}/Makefile"



        echo "OpenWrt source OK"






    #
    # Apply feeds
    #

    - name: Apply feeds configuration


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then



          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \

          feeds.conf.default



        fi





        echo "===== feeds.conf ====="



        cat feeds.conf.default







    #
    # Update feeds
    #

    - name: Update feeds


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        ./scripts/feeds update -a






        mkdir -p .github-feed-lock






        for feed in feeds/*; do



          if [ -d "$feed/.git" ]; then



            name=$(basename "$feed")



            cd "$feed"



            git rev-parse HEAD \

              > "../../.github-feed-lock/${name}.commit"



            cd ../..



          fi



        done






        echo "===== Feed lock ====="



        cat .github-feed-lock/* || true






    #
    # Install feeds
    #

    - name: Install feeds


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        ./scripts/feeds install -a







    #
    # Load config
    #

    - name: Load device config


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        echo "Config:"


        echo "${{ inputs.config_file }}"





        cp "${GITHUB_WORKSPACE}/${{ inputs.config_file }}" .config





        if [ -n "${{ inputs.extra_config_file }}" ]; then



          if [ -f "${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}" ]; then



            cat "${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}" \

            >> .config



          fi



        fi





        echo "===== TARGET CONFIG ====="



        grep "^CONFIG_TARGET" .config || true






    #
    # Fullcone
    #

    - name: Enable fullcone


      if: inputs.sonic_fullcone == 'true'


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail



        echo "CONFIG_PACKAGE_kmod-ipt-fullcone=y" >> .config



        echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" >> .config






    #
    # Defconfig
    #

    - name: Defconfig


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail



        make defconfig





        echo "===== diffconfig ====="



        ./scripts/diffconfig.sh || true






    #
    # Generate cache key
    #

    - name: Generate cache key


      id: cache-key


      shell: bash


      run: |


        set -euxo pipefail





        HASH=$( \

        sha256sum \

        "${OPENWRT_PATH}/.config" \

        "${OPENWRT_PATH}/feeds.conf.default" \

        "${OPENWRT_PATH}/.github-feed-lock/"* 2>/dev/null \

        | sha256sum \

        | cut -d' ' -f1 )





        echo "key=${{ runner.os }}-${{ inputs.device }}-${HASH}" \

        >> $GITHUB_OUTPUT

    #
    # Restore cache
    #

    - name: Restore build cache

      uses: actions/cache@v4


      with:


        key: ${{ steps.cache-key.outputs.key }}


        restore-keys: |


          ${{ runner.os }}-${{ inputs.device }}-



        path: |


          ${{ env.OPENWRT_PATH }}/dl


          ${{ env.OPENWRT_PATH }}/staging_dir


          ${{ env.OPENWRT_PATH }}/build_dir






    #
    # Download packages
    #

    - name: Download packages


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail



        make download -j$(nproc)



        find dl -size -1024c -delete



        du -sh dl






    #
    # Compile
    #

    - name: Compile firmware


      id: compile


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail



        echo "===== Start compile ====="





        make -j$(nproc) V=s





        echo "compile=success" >> $GITHUB_OUTPUT






        echo "===== Target result ====="




        find bin/targets \

          -maxdepth 5 \

          -type f \

          -printf "%p %s bytes\n" \

          | sort || true






    #
    # Check build output
    #

    - name: Check build output


      if: always()


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        echo "===== TARGET DIRECTORY ====="





        if [ -d bin/targets ]; then



          find bin/targets -maxdepth 5 -type d



        else



          echo "bin/targets not found"



        fi






        echo ""


        echo "===== APK FILES ====="





        find bin/targets \

          -type f \

          -name "*.apk" \

          -print || true





        echo ""


        echo "===== packages.adb ====="





        find bin/targets \

          -type f \

          -name "packages.adb" \

          -print || true






    #
    # Upload firmware
    #

    - name: Upload firmware


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:



        name: firmware-${{ inputs.device }}



        path: |



          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.bin


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.img*


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.manifest


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/sha256sums


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.buildinfo



        retention-days: 14






    #
    # Upload target APK feed
    #

    - name: Upload target APK feed


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:



        name: target-packages-${{ inputs.device }}



        path: |



          ${{ env.OPENWRT_PATH }}/bin/targets/**/packages/**



        retention-days: 30






    #
    # Upload normal packages
    #

    - name: Upload package feed


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:



        name: package-feed-${{ inputs.device }}



        path: |



          ${{ env.OPENWRT_PATH }}/bin/packages/**



        retention-days: 30






    #
    # Upload config
    #

    - name: Upload build config


      if: always()


      uses: actions/upload-artifact@v4



      with:



        name: config-${{ inputs.device }}



        path: |



          ${{ env.OPENWRT_PATH }}/.config


          ${{ env.OPENWRT_PATH }}/.github-feed-lock/**



        retention-days: 30






    #
    # GitHub Release
    #

    - name: Release firmware


      if: steps.compile.outputs.compile == 'success'


      uses: softprops/action-gh-release@v2



      with:



        tag_name: immortalwrt-${{ inputs.device }}-${{ inputs.repo_branch }}



        name: ImmortalWrt ${{ inputs.device }} ${{ inputs.repo_branch }}



        files: |



          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.bin


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.img*


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/sha256sums



      env:



        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}






    #
    # Summary
    #

    - name: Build summary


      if: always()


      shell: bash


      run: |


        echo "============================="



        echo "Device:"


        echo "${{ inputs.device }}"




        echo ""


        echo "Source:"


        echo "${{ inputs.repo_url }}"




        echo ""


        echo "Branch / Tag:"


        echo "${{ inputs.repo_branch }}"




        echo ""


        echo "Commit:"


        echo "${OPENWRT_COMMIT}"




        echo "============================="




        df -hT
