name: OpenWrt build device


on:

  workflow_call:


    inputs:


      device:

        description: Device name used for artifact names.

        required: true

        type: string


      config_file:

        description: Repository config file.

        required: true

        type: string


      extra_config_file:

        description: Optional extra config.

        default: ""

        type: string


      workflow_name:

        description: Workflow name.

        required: true

        type: string


      repo_url:

        description: OpenWrt source repository.

        required: true

        type: string


      repo_branch:

        description: OpenWrt source branch/tag.

        required: true

        type: string


      repo_commit:

        description: Optional fixed OpenWrt commit.

        default: ""

        type: string


      feeds_conf:

        description: feeds.conf.default path.

        default: feeds.conf.default

        type: string


      diy_p1_sh:

        description: Part1 script.

        default: ./sh/scripts-part1.sh

        type: string


      diy_p2_sh:

        description: Part2 script.

        default: ./sh/scripts-part2.sh

        type: string


      default_setting:

        description: Default settings package.

        default: ./default-settings-m0eak

        type: string


      cache_toolchain:

        description: Enable cache.

        default: "true"

        type: string


      timezone:

        description: Timezone.

        default: Asia/Shanghai

        type: string


      install_automake_117:

        description: Install automake 1.17.

        default: "false"

        type: string


      sonic_fullcone:

        description: Enable sonic fullcone.

        default: "false"

        type: string



jobs:


  build:


    name: 编译 ${{ inputs.device }}


    runs-on: ubuntu-22.04


    permissions:

      contents: read



    steps:



      - name: Checkout repository

        uses: actions/checkout@v4





      - name: Show build information

        shell: bash

        run: |

          echo "::group::Build inputs"

          echo "device=${{ inputs.device }}"

          echo "workflow=${{ inputs.workflow_name }}"

          echo "repo=${{ inputs.repo_url }}"

          echo "branch=${{ inputs.repo_branch }}"

          echo "commit=${{ inputs.repo_commit }}"

          echo "config=${{ inputs.config_file }}"

          echo "::endgroup::"





      - name: Cleanup disk

        shell: bash

        run: |

          df -hT

          sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL


          sudo docker image prune --all --force


          df -hT





      - name: Initialize environment

        shell: bash

        env:

          DEBIAN_FRONTEND: noninteractive

          TZ: ${{ inputs.timezone }}

        run: |

          sudo -E apt-get update


          sudo -E apt-get install -y \
          dos2unix \
          libfuse-dev \
          clang \
          llvm


          sudo bash -c \
          'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'


          sudo timedatectl set-timezone "$TZ"


          sudo mkdir -p /workdir


          sudo chown "$USER:$(id -gn)" /workdir


          echo "WORKFLOW_NAME=${{ inputs.workflow_name }}" >> $GITHUB_ENV

          echo "TAG=${{ inputs.repo_branch }}" >> $GITHUB_ENV

                - name: Clone OpenWrt source

        id: clone-source

        shell: bash

        working-directory: /workdir

        run: |


          set -e



          echo "::group::Clone source"



          git clone \
          "${{ inputs.repo_url }}" \
          -b "${{ inputs.repo_branch }}" \
          openwrt



          cd openwrt



          echo "Remote:"

          git remote -v



          echo ""

          echo "Branch:"

          git branch --show-current





          # 如果指定 commit，则固定源码版本

          if [ -n "${{ inputs.repo_commit }}" ]; then


            echo "Checkout fixed commit:"

            echo "${{ inputs.repo_commit }}"



            git checkout "${{ inputs.repo_commit }}"


          fi





          SOURCE_COMMIT=$(git rev-parse HEAD)



          echo "OPENWRT_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"



          echo "openwrt-path=$PWD" >> "$GITHUB_OUTPUT"



          echo "::group::Source revision"


          git log -1 --oneline


          echo "Commit: $SOURCE_COMMIT"


          echo "::endgroup::"





          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"





      - name: Prepare feeds configuration


        shell: bash


        run: |


          cd openwrt



          if [ -e "$GITHUB_WORKSPACE/${{ inputs.feeds_conf }}" ]; then


            cp \
            "$GITHUB_WORKSPACE/${{ inputs.feeds_conf }}" \
            feeds.conf.default


          fi





          echo "::group::feeds.conf.default"


          cat feeds.conf.default



          echo "::endgroup::"






      - name: Update feeds and lock revisions


        id: feeds-lock


        shell: bash


        run: |


          set -e



          cd openwrt



          echo "::group::Update feeds"



          ./scripts/feeds update -a



          echo "::endgroup::"





          mkdir -p feeds.lock





          echo "::group::Generate feeds lock"





          for feed in $(ls feeds); do



            if [ -d "feeds/$feed/.git" ]; then



              COMMIT=$(git -C "feeds/$feed" rev-parse HEAD)



              echo "$feed=$COMMIT"



              echo "$COMMIT" > "feeds.lock/$feed.commit"



            fi



          done





          echo "::endgroup::"





          echo "::group::Feeds lock files"



          find feeds.lock \
          -type f \
          -printf '%f ' \
          -exec cat {} \;



          echo "::endgroup::"





          tar -czf feeds-lock.tar.gz feeds.lock





      - name: Save build revision info


        shell: bash


        run: |


          mkdir -p openwrt/build-info



          echo "OpenWrt source commit:" \
          > openwrt/build-info/revision.txt



          echo "${OPENWRT_SOURCE_COMMIT}" \
          >> openwrt/build-info/revision.txt




          echo "" >> openwrt/build-info/revision.txt



          echo "Feeds:" >> openwrt/build-info/revision.txt



          for file in feeds.lock/*.commit; do


            echo "$(basename "$file" .commit): $(cat "$file")" \
            >> openwrt/build-info/revision.txt


          done




          cat openwrt/build-info/revision.txt

                - name: Install feeds


        shell: bash


        run: |


          cd openwrt



          ./scripts/feeds install -a





      - name: Load custom configuration


        shell: bash


        run: |


          set -e



          cd openwrt





          ####################################
          # 默认设置包
          ####################################


          if [ -e "$GITHUB_WORKSPACE/${{ inputs.default_setting }}" ]; then


            rm -rf package/default-settings-m0eak


            cp -r \
            "$GITHUB_WORKSPACE/${{ inputs.default_setting }}" \
            package/default-settings-m0eak


          fi





          ####################################
          # files目录
          ####################################


          if [ -e "$GITHUB_WORKSPACE/files" ]; then


            cp -rf \
            "$GITHUB_WORKSPACE/files" \
            ./files


          fi





          ####################################
          # 主config
          ####################################


          if [ ! -e "$GITHUB_WORKSPACE/${{ inputs.config_file }}" ]; then


            echo "Config file not found:"


            echo "${{ inputs.config_file }}"


            exit 1


          fi





          cp \
          "$GITHUB_WORKSPACE/${{ inputs.config_file }}" \
          .config






          ####################################
          # Docker config
          ####################################


          if [ -n "${{ inputs.extra_config_file }}" ] \
          && [ -e "$GITHUB_WORKSPACE/${{ inputs.extra_config_file }}" ]; then


            cat \
            "$GITHUB_WORKSPACE/${{ inputs.extra_config_file }}" \
            >> .config


          fi





          ####################################
          # Sonic Fullcone
          ####################################


          if [ "${{ inputs.sonic_fullcone }}" = "true" ]; then


            echo "CONFIG_PACKAGE_luci-app-fullconenat=y" \
            >> .config


            echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" \
            >> .config


          fi





          echo "::group::Before defconfig"


          grep '^CONFIG_TARGET' .config || true


          echo "::endgroup::"





          make defconfig






          echo "::group::Final diffconfig"


          ./scripts/diffconfig.sh


          echo "::endgroup::"







      ########################################
      # Cache
      ########################################


      - name: Restore build cache


        if: inputs.cache_toolchain == 'true'


        uses: actions/cache@v4


        with:


          path: |


            openwrt/staging_dir/host


            openwrt/staging_dir/toolchain-*


            openwrt/build_dir/host


            openwrt/.ccache



          key: |


            ${{ runner.os }}-${{ inputs.device }}-${{ env.TAG }}-${{ hashFiles(
            'openwrt/.config',
            'openwrt/feeds.conf.default',
            'openwrt/feeds.lock/**'
            ) }}



          restore-keys: |


            ${{ runner.os }}-${{ inputs.device }}-${{ env.TAG }}-







      ########################################
      # Download package
      ########################################


      - name: Download packages


        shell: bash


        run: |


          cd openwrt



          make download -j8





          echo "::group::Download summary"


          du -sh dl || true


          find dl \
          -size -1024c \
          -exec ls -lh {} \;



          echo "::endgroup::"





          find dl \
          -size -1024c \
          -delete






      ########################################
      # Compile
      ########################################


      - name: Compile firmware


        id: compile


        shell: bash


        run: |


          cd openwrt





          THREADS=$(nproc)



          echo "Compile threads: $THREADS"





          make -j${THREADS} || make -j1 V=s





          DEVICE_NAME=$(grep \
          '^CONFIG_TARGET.*DEVICE.*=y' \
          .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' \
          | head -1)





          if [ -z "$DEVICE_NAME" ]; then


            DEVICE_NAME="${{ inputs.device }}"


          fi





          echo "device-name=$DEVICE_NAME" \
          >> "$GITHUB_OUTPUT"





          echo "compile=success" \
          >> "$GITHUB_OUTPUT"





          echo "::group::Compile output"


          find bin/targets \
          -maxdepth 3 \
          -type f \
          -printf '%p %s bytes\n' \
          | sort



          echo "::endgroup::"








      ########################################
      # 保存编译信息
      ########################################


      - name: Copy build metadata


        shell: bash


        run: |


          cd openwrt





          mkdir -p bin/build-info





          cp -rf \
          build-info \
          bin/build-info/





          cp \
          feeds-lock.tar.gz \
          bin/build-info/






      ########################################
      # Upload artifact
      ########################################


      - name: Upload firmware artifact


        if: steps.compile.outputs.compile == 'success'


        uses: actions/upload-artifact@v4



        with:


          name: firmware-${{ inputs.device }}


          path: |


            openwrt/bin/targets/**




      ########################################
      # Upload package list
      ########################################


      - name: Generate package list


        shell: bash


        run: |


          cd openwrt





          mkdir -p package-list-${{ inputs.device }}





          ./scripts/feeds list \
          -r \
          > package-list-${{ inputs.device }}/packages.txt






      - name: Upload package list


        uses: actions/upload-artifact@v4


        with:


          name: package-list-${{ inputs.device }}


          path: openwrt/package-list-${{ inputs.device }}
