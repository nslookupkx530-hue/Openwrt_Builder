name: OpenWrt Build Device


on:

  workflow_call:

    inputs:

      device:

        required: true

        type: string


      repo_url:

        required: true

        type: string


      repo_branch:

        required: true

        type: string


      config_file:

        required: true

        type: string


      sonic_fullcone:

        required: false

        type: string

        default: "false"


      install_automake_117:

        required: false

        type: string

        default: "false"


      docker:

        required: false

        type: boolean

        default: false


      release:

        required: false

        type: boolean

        default: false





jobs:

  build:

    name: Build ${{ inputs.device }}

    runs-on: ubuntu-22.04


    steps:


      - name: Checkout builder repository

        uses: actions/checkout@v4





      - name: Install dependencies

        shell: bash

        run: |

          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y build-essential clang flex bison gawk gcc g++ gettext git libncurses-dev libssl-dev python3 rsync unzip wget zstd curl dos2unix





      - name: Install automake 1.17

        if: ${{ inputs.install_automake_117 == 'true' }}

        shell: bash

        run: |

          set -euxo pipefail

          sudo apt-get install -y automake





      - name: Clone OpenWrt source

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          rm -rf "${SOURCE_DIR}"

          git clone --depth=1 --branch "${{ inputs.repo_branch }}" "${{ inputs.repo_url }}" "${SOURCE_DIR}"


          echo "OpenWrt source:"

          ls -la "${SOURCE_DIR}"



      - name: Prepare config

        shell: bash

        env:

          CONFIG_FILE: ${{ inputs.config_file }}

        run: |

          set -euxo pipefail


          SOURCE_DIR="${{ github.workspace }}/openwrt"


          CONFIG_PATH="${{ github.workspace }}/${CONFIG_FILE}"


          echo "Source directory:"

          echo "${SOURCE_DIR}"


          echo "Config file:"

          echo "${CONFIG_PATH}"


          if [ ! -f "${CONFIG_PATH}" ]; then

            echo "Config file does not exist"

            exit 1

          fi


          cd "${SOURCE_DIR}"


          cp "${CONFIG_PATH}" .config


          make defconfig V=s





      - name: Update feeds

        shell: bash

        run: |

          set -euxo pipefail


          cd "${{ github.workspace }}/openwrt"


          ./scripts/feeds update -a


          ./scripts/feeds install -a -f





      - name: Enable sonic fullcone

        if: ${{ inputs.sonic_fullcone == 'true' }}

        shell: bash

        run: |

          set -euxo pipefail


          cd "${{ github.workspace }}/openwrt"


          echo "Enable sonic fullcone"


          make defconfig V=s





      - name: Prepare build download

        shell: bash

        run: |

          set -euxo pipefail


          cd "${{ github.workspace }}/openwrt"


          mkdir -p dl


          make download -j$(nproc)



      - name: Build firmware

        shell: bash

        run: |

          set -euxo pipefail


          cd "${{ github.workspace }}/openwrt"


          make -j$(nproc) V=s WERROR=0





      - name: Collect firmware

        shell: bash

        run: |

          set -euxo pipefail


          SOURCE_DIR="${{ github.workspace }}/openwrt"


          mkdir -p "${SOURCE_DIR}/output/firmware"


          find "${SOURCE_DIR}/bin/targets" -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" \) -exec cp -f {} "${SOURCE_DIR}/output/firmware/" \; || true


          echo "Firmware files:"


          find "${SOURCE_DIR}/output/firmware" -type f | sort





      - name: Collect APK feed

        shell: bash

        run: |

          set -euxo pipefail


          SOURCE_DIR="${{ github.workspace }}/openwrt"


          mkdir -p "${SOURCE_DIR}/output/apk-feed"


          find "${SOURCE_DIR}/bin/packages" -type f -name "*.apk" -exec cp -f {} "${SOURCE_DIR}/output/apk-feed/" \; || true


          find "${SOURCE_DIR}/bin/packages" -type f -name "packages.adb" -exec cp -f {} "${SOURCE_DIR}/output/apk-feed/" \; || true


          echo "APK feed files:"


          find "${SOURCE_DIR}/output/apk-feed" -type f | sort





      - name: Prepare artifact

        shell: bash

        run: |

          set -euxo pipefail


          mkdir -p artifact/${{ inputs.device }}


          cp -rf "${{ github.workspace }}/openwrt/output/firmware" artifact/${{ inputs.device }}/ || true


          cp -rf "${{ github.workspace }}/openwrt/output/apk-feed" artifact/${{ inputs.device }}/ || true


          echo "Artifact files:"


          find artifact -type f | sort





      - name: Upload firmware artifact

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.device }}-firmware-${{ github.run_id }}

          path: artifact/${{ inputs.device }}/firmware

          if-no-files-found: ignore





      - name: Upload APK feed artifact

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.device }}-apk-feed-${{ github.run_id }}

          path: artifact/${{ inputs.device }}/apk-feed

          if-no-files-found: ignore
