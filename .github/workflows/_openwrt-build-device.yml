name: OpenWrt Build Device

on:
  workflow_call:
    inputs:
      device:
        required: true
        type: string

      repo_url:
        required: true
        type: string

      repo_branch:
        required: true
        type: string

      config_file:
        required: true
        type: string

      docker:
        required: false
        type: string
        default: "false"

      sonic_fullcone:
        required: false
        type: string
        default: "false"

      release:
        required: false
        type: string
        default: "true"

permissions:
  contents: write


env:
  WORKDIR: /workdir
  OPENWRT_PATH: /workdir/openwrt
  TZ: Asia/Shanghai


jobs:

  build:

    name: Build ${{ inputs.device }}

    runs-on: ubuntu-22.04


    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Free disk

        shell: bash

        run: |

          set -eux

          sudo rm -rf /usr/share/dotnet || true

          sudo rm -rf /usr/local/lib/android || true

          sudo rm -rf /opt/ghc || true

          sudo docker image prune -af || true

          df -h



      - name: Install dependencies

        shell: bash

        run: |

          set -eux

          sudo apt-get update

          sudo apt-get install -y build-essential curl rsync unzip file python3 gawk gettext libncurses5-dev zlib1g-dev libssl-dev



      - name: Prepare workdir

        shell: bash

        run: |

          set -eux

          sudo mkdir -p /workdir

          sudo chown $USER:$USER /workdir

          sudo timedatectl set-timezone Asia/Shanghai



      - name: Clone source

        shell: bash

        working-directory: /workdir

        run: |

          set -eux


          rm -rf openwrt


          echo "Repository:"

          echo "${{ inputs.repo_url }}"


          echo "Branch:"

          echo "${{ inputs.repo_branch }}"


          git clone --depth=1 --single-branch --branch "${{ inputs.repo_branch }}" "${{ inputs.repo_url }}" openwrt


          test -d /workdir/openwrt


          test -f /workdir/openwrt/Makefile


          cd /workdir/openwrt


          git log -1 --oneline


          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV



      - name: Verify source

        shell: bash

        run: |

          set -eux

          ls -la /workdir

          ls -la /workdir/openwrt

          test -f /workdir/openwrt/Makefile

          echo "SOURCE OK"



      - name: Update feeds

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          test -d /workdir/openwrt


          ./scripts/feeds update -a


          ./scripts/feeds install -a






      - name: Load config

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          CONFIG_FILE="${GITHUB_WORKSPACE}/${{ inputs.config_file }}"


          echo "Config file:"

          echo "$CONFIG_FILE"


          test -f "$CONFIG_FILE"


          cp "$CONFIG_FILE" .config


          echo "Target config:"


          grep "^CONFIG_TARGET" .config || true






      - name: Enable docker

        if: inputs.docker == 'true'

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          echo "Enable docker"


          echo "CONFIG_PACKAGE_dockerd=y" >> .config

          echo "CONFIG_PACKAGE_docker=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config






      - name: Enable fullcone

        if: inputs.sonic_fullcone == 'true'

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          echo "Enable fullcone"


          echo "CONFIG_PACKAGE_kmod-nft-fullcone=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-fullconenat=y" >> .config






      - name: Defconfig

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          make defconfig


          echo "===== CONFIG CHECK ====="


          grep "^CONFIG_TARGET" .config || true






      - name: Generate cache key

        id: cache

        shell: bash

        run: |

          set -eux


          HASH=$(sha256sum /workdir/openwrt/.config | cut -d' ' -f1)


          echo "key=openwrt-${{ inputs.device }}-${HASH}" >> $GITHUB_OUTPUT






      - name: Restore build cache

        uses: actions/cache@v4


        with:

          path: |

            /workdir/openwrt/dl

            /workdir/openwrt/build_dir

            /workdir/openwrt/staging_dir


          key: ${{ steps.cache.outputs.key }}


          restore-keys: |

            openwrt-${{ inputs.device }}-






      - name: Download packages

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          test -d /workdir/openwrt


          make download -j$(nproc)


          find dl -size -1024c -delete


          du -sh dl




      - name: Compile firmware

        id: compile

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          echo "=============================="

          echo "Building ${{ inputs.device }}"

          echo "=============================="


          make -j$(nproc) V=s


          echo "success=true" >> $GITHUB_OUTPUT






      - name: Check output

        if: always()

        shell: bash

        run: |

          set +e


          echo "===== TARGET FILES ====="


          if [ -d /workdir/openwrt/bin/targets ]; then

            find /workdir/openwrt/bin/targets -type f

          else

            echo "No target output"

          fi



          echo ""


          echo "===== PACKAGE FILES ====="


          if [ -d /workdir/openwrt/bin/packages ]; then

            find /workdir/openwrt/bin/packages -type f

          else

            echo "No packages output"

          fi



          echo ""


          echo "===== APK FILES ====="


          if [ -d /workdir/openwrt/bin ]; then

            find /workdir/openwrt/bin -name "*.apk"

            find /workdir/openwrt/bin -name "packages.adb"

          else

            echo "No bin directory"

          fi






      - name: Upload firmware

        if: steps.compile.outputs.success == 'true'

        uses: actions/upload-artifact@v4


        with:


          name: firmware-${{ inputs.device }}-${{ github.run_number }}


          path: /workdir/openwrt/bin/targets/


          if-no-files-found: warn


          retention-days: 30






      - name: Upload APK feed

        if: steps.compile.outputs.success == 'true'

        uses: actions/upload-artifact@v4


        with:


          name: apk-feed-${{ inputs.device }}-${{ github.run_number }}


          path: |

            /workdir/openwrt/bin/targets/

            /workdir/openwrt/bin/packages/


          if-no-files-found: warn


          retention-days: 90






      - name: Upload build information

        if: always()

        uses: actions/upload-artifact@v4


        with:


          name: build-info-${{ inputs.device }}-${{ github.run_number }}


          path: |

            /workdir/openwrt/.config

            /workdir/openwrt/bin/targets/


          if-no-files-found: warn


          retention-days: 30






      - name: Create GitHub Release

        if: steps.compile.outputs.success == 'true' && inputs.release == 'true'

        uses: softprops/action-gh-release@v2


        with:


          tag_name: ${{ inputs.device }}-${{ github.run_number }}


          name: "${{ inputs.device }} Build ${{ github.run_number }}"


          files: |

            /workdir/openwrt/bin/targets/**


        env:


          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}






      - name: Build summary

        if: always()

        shell: bash

        run: |

          echo "=============================="

          echo " OpenWrt Build Summary "

          echo "=============================="


          echo "Device: ${{ inputs.device }}"


          echo "Repository: ${{ inputs.repo_url }}"


          echo "Branch: ${{ inputs.repo_branch }}"


          echo "Commit: ${OPENWRT_COMMIT:-unknown}"


          df -h
