name: OpenWrt Build Device

on:
  workflow_call:
    inputs:

      device:
        description: Device name
        required: true
        type: string

      repo_url:
        description: Source repository
        required: true
        type: string

      repo_branch:
        description: Source branch
        required: true
        type: string

      config_file:
        description: Config file
        required: true
        type: string

      workflow_name:
        description: Workflow name
        required: true
        type: string

      install_automake_117:
        description: Install automake 1.17
        required: false
        default: "false"
        type: string

      sonic_fullcone:
        description: Enable sonic fullcone
        required: false
        default: "false"
        type: string

      extra_config_file:
        description: Extra config
        required: false
        default: ""
        type: string


env:

  TZ: Asia/Shanghai

  WORKDIR: /workdir

  OPENWRT_PATH: /workdir/openwrt


jobs:

  build:

    name: Build ${{ inputs.device }}

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout builder
      uses: actions/checkout@v4



    - name: Free disk space

      run: |

        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo docker image prune --all --force

        df -h



    - name: Init build environment

      run: |

        sudo apt-get update

        sudo apt-get install -y \
          dos2unix \
          libfuse-dev \
          rsync


        sudo bash -c \
        'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'


        sudo timedatectl set-timezone "$TZ"



    - name: Clone source

      working-directory: ${{ env.WORKDIR }}

      run: |


        git clone \
        --single-branch \
        --branch "${{ inputs.repo_branch }}" \
        "${{ inputs.repo_url }}" \
        openwrt



        cd openwrt


        echo "===== SOURCE ====="

        git log -1 --oneline

        git remote -v

        echo "=================="



        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

            - name: Install optional automake 1.17

      if: inputs.install_automake_117 == 'true'

      run: |

        sudo apt-get install -y \
          automake \
          autoconf



    - name: Apply feeds configuration

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        echo "===== Original feeds ====="

        sed -n '1,120p' feeds.conf.default || true


        #
        # 如果仓库存在自定义 feeds.conf.default
        #

        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then

          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \
          feeds.conf.default

        fi



        echo "===== Current feeds ====="

        cat feeds.conf.default



    - name: Lock feeds revision

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        echo "Updating feeds..."

        ./scripts/feeds update -a



        echo "===== Feed revisions ====="


        for dir in feeds/*; do

          if [ -d "$dir/.git" ]; then

            echo "---- $dir ----"

            cd "$dir"

            git rev-parse HEAD

            cd - >/dev/null

          fi

        done



        mkdir -p .github-feed-lock



        for dir in feeds/*; do

          if [ -d "$dir/.git" ]; then

            name=$(basename "$dir")

            (
              cd "$dir"

              git rev-parse HEAD \
              > "../../.github-feed-lock/${name}.commit"

            )

          fi

        done



        echo "===== Feed hash ====="

        cat .github-feed-lock/* || true



    - name: Install feeds

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        ./scripts/feeds install -a



    - name: Load device config

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        echo "Using config: ${{ inputs.config_file }}"


        cp "${GITHUB_WORKSPACE}/${{ inputs.config_file }}" \
        .config



        if [ -n "${{ inputs.extra_config_file }}" ]; then


          echo "Apply extra config"


          cat "${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}" \
          >> .config


        fi



        echo "===== Device config ====="


        grep "^CONFIG_TARGET" .config || true



    - name: Apply sonic fullcone

      if: inputs.sonic_fullcone == 'true'

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" >> .config

        echo "CONFIG_PACKAGE_kmod-ipt-fullconenat=y" >> .config



    - name: Defconfig

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        make defconfig



        echo "===== Diffconfig ====="


        ./scripts/diffconfig.sh



    - name: Prepare cache key

      id: cache-key

      run: |


        echo "key=${{ runner.os }}-${{ inputs.device }}-${{ hashFiles('openwrt/.config','openwrt/feeds.conf.default','.github-feed-lock/*') }}" \
        >> $GITHUB_OUTPUT



    - name: Restore build cache

      uses: actions/cache@v4

      with:

        key: ${{ steps.cache-key.outputs.key }}

        restore-keys: |

          ${{ runner.os }}-${{ inputs.device }}-

        path: |

          openwrt/dl

          openwrt/staging_dir

          openwrt/build_dir



    - name: Download packages

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        make download -j8



        find dl -size -1024c -delete



        du -sh dl

            - name: Compile firmware

      id: compile

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        echo "===== Start compile ====="


        make -j$(nproc) || make -j1 V=s



        echo "compile=success" >> $GITHUB_OUTPUT



        DEVICE_NAME=$(grep '^CONFIG_TARGET_DEVICE' .config \
        | head -1 \
        | cut -d '=' -f2 \
        | tr -d '"')



        echo "DEVICE_NAME=${DEVICE_NAME}" >> $GITHUB_ENV



        echo "===== Build result ====="


        find bin/targets \
        -maxdepth 4 \
        -type f \
        -printf "%p %s bytes\n" \
        | sort




    #
    # 保存固件
    #

    - name: Upload firmware

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4

      with:

        name: firmware-${{ inputs.device }}

        path: |

          openwrt/bin/targets/*/*/*.bin

          openwrt/bin/targets/*/*/*.img

          openwrt/bin/targets/*/*/*.manifest

          openwrt/bin/targets/*/*/*sha256sums

          openwrt/bin/targets/*/*/*.buildinfo

        retention-days: 7




    #
    # 关键：
    # 上传 target packages
    #
    # 包含：
    # kernel.apk
    # kmod-*.apk
    # packages.adb
    #

    - name: Upload target APK packages

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4

      with:

        name: target-packages-${{ inputs.device }}

        path: |

          openwrt/bin/targets/*/*/packages

        retention-days: 30





    #
    # 保存普通 feeds packages
    #

    - name: Upload package feed

      if: steps.compile.outputs.compile == 'success'

      uses: actions/upload-artifact@v4

      with:

        name: package-feed-${{ inputs.device }}

        path: |

          openwrt/bin/packages/*/*

        retention-days: 30




    #
    # 输出构建信息
    #

    - name: Build summary

      if: always()

      run: |


        echo "======================"

        echo "Device:"
        echo "${{ inputs.device }}"



        echo "Source:"
        echo "${{ inputs.repo_url }}"



        echo "Branch:"
        echo "${{ inputs.repo_branch }}"



        echo "Commit:"
        echo "${OPENWRT_COMMIT}"



        echo "======================"
