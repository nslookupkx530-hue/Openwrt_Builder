name: OpenWrt build device


on:

  workflow_call:


    inputs:


      device:

        description: Device name

        required: true

        type: string



      config_file:

        description: Device config file

        required: true

        type: string



      extra_config_file:

        description: Extra config file

        required: false

        default: ""

        type: string



      workflow_name:

        description: Workflow name

        required: true

        type: string



      repo_url:

        description: OpenWrt source repository

        required: true

        type: string



      repo_branch:

        description: OpenWrt source branch

        required: true

        type: string



      repo_commit:

        description: Fixed source commit

        required: false

        default: ""

        type: string



      feeds_conf:

        description: feeds.conf.default

        required: false

        default: ""

        type: string



      diy_p1_sh:

        description: DIY script part1

        required: false

        default: "./sh/scripts-part1.sh"

        type: string



      diy_p2_sh:

        description: DIY script part2

        required: false

        default: "./sh/scripts-part2.sh"

        type: string



      default_setting:

        description: Default settings

        required: false

        default: "./default-settings-m0eak"

        type: string



      install_automake_117:

        description: Install automake 1.17

        required: false

        default: "false"

        type: string



      sonic_fullcone:

        description: Enable fullcone

        required: false

        default: "false"

        type: string



      timezone:

        description: Timezone

        required: false

        default: "Asia/Shanghai"

        type: string




jobs:


  build:


    name: Build ${{ inputs.device }}


    runs-on: ubuntu-22.04



    permissions:

      contents: read




    steps:



      - name: Checkout repository

        uses: actions/checkout@v4






      - name: Show build parameters

        shell: bash

        run: |

          echo "::group::Build parameters"

          echo "Device=${{ inputs.device }}"

          echo "Workflow=${{ inputs.workflow_name }}"

          echo "Repository=${{ inputs.repo_url }}"

          echo "Branch=${{ inputs.repo_branch }}"

          echo "Commit=${{ inputs.repo_commit }}"

          echo "Config=${{ inputs.config_file }}"

          echo "::endgroup::"







      - name: Cleanup disk space

        shell: bash

        run: |

          df -hT


          sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL



          sudo docker image prune --all --force



          df -hT








      - name: Initialize build environment

        shell: bash

        env:

          DEBIAN_FRONTEND: noninteractive

          TZ: ${{ inputs.timezone }}


        run: |


          sudo -E apt-get update



          sudo -E apt-get install -y \

          dos2unix \

          libfuse-dev



          sudo bash -c \

          'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'



          sudo timedatectl set-timezone "$TZ"



          sudo mkdir -p /workdir



          sudo chown "$USER:$(id -gn)" /workdir



          echo "WORKDIR=/workdir" >> $GITHUB_ENV





      - name: Clone OpenWrt source

        shell: bash

        working-directory: /workdir

        run: |


          set -e



          git clone \

          -b "${{ inputs.repo_branch }}" \

          "${{ inputs.repo_url }}" \

          openwrt



          cd openwrt



          if [ -n "${{ inputs.repo_commit }}" ]; then


            git checkout "${{ inputs.repo_commit }}"


          fi



          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV



          git log -1 --oneline



          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
      - name: Prepare feeds configuration

        shell: bash

        run: |

          set -e


          cd openwrt



          if [ -n "${{ inputs.feeds_conf }}" ] && [ -f "$GITHUB_WORKSPACE/${{ inputs.feeds_conf }}" ]; then


            cp \
            "$GITHUB_WORKSPACE/${{ inputs.feeds_conf }}" \
            feeds.conf.default


          fi




          echo "::group::feeds.conf.default"


          cat feeds.conf.default


          echo "::endgroup::"







      - name: Update feeds and generate lock

        id: feeds-lock

        shell: bash

        run: |


          set -e



          cd openwrt



          echo "::group::Update feeds"



          ./scripts/feeds update -a



          echo "::endgroup::"





          mkdir -p feeds.lock





          echo "::group::Generate feeds commit lock"





          for feed in $(ls feeds); do



            if [ -d "feeds/$feed/.git" ]; then



              COMMIT=$(git -C "feeds/$feed" rev-parse HEAD)



              echo "$feed=$COMMIT"



              echo "$COMMIT" > "feeds.lock/$feed.commit"



            fi



          done





          echo "::endgroup::"





          echo "::group::Feeds lock result"



          for file in feeds.lock/*.commit; do


            echo "$(basename "$file" .commit): $(cat "$file")"


          done



          echo "::endgroup::"







      - name: Install feeds

        shell: bash

        run: |


          cd openwrt



          ./scripts/feeds install -a







      - name: Load device configuration

        shell: bash

        run: |


          set -e



          cd openwrt





          ####################################

          # Default settings

          ####################################


          if [ -d "$GITHUB_WORKSPACE/${{ inputs.default_setting }}" ]; then


            rm -rf package/default-settings-m0eak



            cp -r \

            "$GITHUB_WORKSPACE/${{ inputs.default_setting }}" \

            package/default-settings-m0eak



          fi





          ####################################

          # files overlay

          ####################################


          if [ -d "$GITHUB_WORKSPACE/files" ]; then


            cp -rf \

            "$GITHUB_WORKSPACE/files" \

            ./files



          fi






          ####################################

          # Device config

          ####################################


          if [ ! -f "$GITHUB_WORKSPACE/${{ inputs.config_file }}" ]; then


            echo "Missing config file:"


            echo "${{ inputs.config_file }}"


            exit 1



          fi





          cp \

          "$GITHUB_WORKSPACE/${{ inputs.config_file }}" \

          .config






          ####################################

          # Extra config (docker)

          ####################################


          if [ -n "${{ inputs.extra_config_file }}" ] && [ -f "$GITHUB_WORKSPACE/${{ inputs.extra_config_file }}" ]; then



            cat \

            "$GITHUB_WORKSPACE/${{ inputs.extra_config_file }}" \

            >> .config



          fi






          ####################################

          # Sonic Fullcone

          ####################################


          if [ "${{ inputs.sonic_fullcone }}" = "true" ]; then



            echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" >> .config



            echo "CONFIG_PACKAGE_luci-app-fullconenat=y" >> .config



          fi







          echo "::group::Target config"



          grep "^CONFIG_TARGET" .config || true



          echo "::endgroup::"







          make defconfig






          echo "::group::Final diffconfig"



          ./scripts/diffconfig.sh



          echo "::endgroup::"







      - name: Save build revision information

        shell: bash

        run: |


          cd openwrt



          mkdir -p build-info





          {

            echo "OpenWrt commit:"

            echo "$OPENWRT_COMMIT"

            echo ""

            echo "Feeds:"

            

            for file in feeds.lock/*.commit; do

              echo "$(basename "$file" .commit): $(cat "$file")"

            done


          } > build-info/revision.txt





          echo "::group::Build revision"



          cat build-info/revision.txt



          echo "::endgroup::"
      - name: Cache build environment

        uses: actions/cache@v4


        with:


          path: |


            openwrt/staging_dir/host

            openwrt/staging_dir/toolchain-*

            openwrt/build_dir/host

            openwrt/.ccache



          key: |

            ${{ runner.os }}-${{ inputs.device }}-${{ inputs.repo_branch }}-${{ hashFiles('openwrt/.config', 'openwrt/feeds.conf.default', 'openwrt/feeds.lock/**') }}



          restore-keys: |

            ${{ runner.os }}-${{ inputs.device }}-${{ inputs.repo_branch }}-






      - name: Download packages


        shell: bash


        run: |


          cd openwrt



          make download -j8





          echo "::group::Download directory"



          du -sh dl || true



          find dl \

          -size -1024c \

          -exec ls -lh {} \;



          echo "::endgroup::"





          find dl \

          -size -1024c \

          -delete






      - name: Compile firmware


        id: compile


        shell: bash


        run: |


          cd openwrt





          THREADS=$(nproc)



          echo "Using ${THREADS} threads"





          make -j${THREADS} || make -j1 V=s





          DEVICE_NAME=$(grep \

          '^CONFIG_TARGET.*DEVICE.*=y' \

          .config \

          | sed -r 's/.*DEVICE_(.*)=y/\1/' \

          | head -1)





          if [ -z "$DEVICE_NAME" ]; then


            DEVICE_NAME="${{ inputs.device }}"


          fi





          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV



          echo "device-name=$DEVICE_NAME" >> $GITHUB_OUTPUT



          echo "compile=success" >> $GITHUB_OUTPUT





          echo "::group::Firmware output"



          find bin/targets \

          -maxdepth 4 \

          -type f \

          -printf '%p %s bytes\n' \

          | sort



          echo "::endgroup::"







      - name: Copy build metadata


        shell: bash


        run: |


          cd openwrt



          mkdir -p bin/build-info





          cp -rf \

          build-info \

          bin/build-info/





          cp -rf \

          feeds.lock \

          bin/build-info/







      - name: Generate package list


        shell: bash


        run: |


          cd openwrt





          mkdir -p \

          ../package-list-${{ inputs.device }}





          ./scripts/feeds list \

          -r \

          > ../package-list-${{ inputs.device }}/packages.txt





      - name: Upload firmware artifact


        if: steps.compile.outputs.compile == 'success'


        uses: actions/upload-artifact@v4


        with:


          name: firmware-${{ inputs.device }}


          path: |


            openwrt/bin/targets/**






      - name: Upload package list


        uses: actions/upload-artifact@v4


        with:


          name: package-list-${{ inputs.device }}


          path: package-list-${{ inputs.device }}






      - name: Show disk usage


        if: always()


        shell: bash


        run: |


          df -hT
