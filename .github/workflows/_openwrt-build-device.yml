name: OpenWrt Build Device


on:

  workflow_call:


    inputs:


      device:

        description: Device name

        required: true

        type: string



      repo_url:

        description: OpenWrt repository

        required: true

        type: string



      repo_branch:

        description: Branch or tag

        required: true

        type: string



      config_file:

        description: Config file

        required: true

        type: string



      workflow_name:

        description: Workflow name

        required: true

        type: string



      sonic_fullcone:

        description: Enable fullcone

        required: false

        default: "false"

        type: string



      extra_config_file:

        description: Extra config

        required: false

        default: ""

        type: string




env:


  TZ: Asia/Shanghai


  WORKDIR: /workdir


  OPENWRT_PATH: /workdir/openwrt




permissions:


  contents: write




jobs:


  build:


    name: Build ${{ inputs.device }}


    runs-on: ubuntu-22.04



    steps:



    - name: Checkout


      uses: actions/checkout@v4






    - name: Free disk


      shell: bash


      run: |


        set -euxo pipefail



        sudo rm -rf /usr/share/dotnet || true


        sudo rm -rf /usr/local/lib/android || true


        sudo rm -rf /opt/ghc || true


        sudo docker image prune -af || true



        df -h






    - name: Install build dependencies


      shell: bash


      run: |


        set -euxo pipefail



        sudo apt-get update



        sudo apt-get install -y \

          curl \

          rsync \

          unzip \

          file \

          build-essential \

          libncurses5-dev \

          zlib1g-dev \

          gawk \

          gettext \

          libssl-dev \

          xsltproc \

          wget






    - name: Init ImmortalWrt build environment


      shell: bash


      run: |


        set -euxo pipefail



        mkdir -p ${WORKDIR}



        sudo timedatectl set-timezone "$TZ"


    - name: Clone OpenWrt source

      shell: bash

      working-directory: ${{ env.WORKDIR }}

      run: |

        set -euxo pipefail



        rm -rf openwrt



        echo "===== Clone repository ====="



        git clone \

          "${{ inputs.repo_url }}" \

          openwrt



        cd openwrt





        echo "===== Fetch tags ====="



        git fetch --tags --force





        echo "===== Check requested branch/tag ====="



        git tag -l "${{ inputs.repo_branch }}"





        echo "===== Checkout ====="



        git checkout "${{ inputs.repo_branch }}"





        echo "===== Source info ====="



        git log -1 --oneline



        git remote -v





        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV






    - name: Verify OpenWrt tree


      shell: bash


      run: |


        set -euxo pipefail



        test -f "${OPENWRT_PATH}/Makefile"



        echo "OpenWrt source OK"






    - name: Apply feeds configuration


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then



          echo "Using custom feeds.conf.default"



          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \

             feeds.conf.default



        fi





        echo "===== feeds.conf.default ====="



        cat feeds.conf.default






    - name: Update feeds


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        ./scripts/feeds update -a





        mkdir -p .github-feed-lock





        for feed in feeds/*; do



          if [ -d "$feed/.git" ]; then



            name=$(basename "$feed")



            (

              cd "$feed"



              git rev-parse HEAD \

              > "../../.github-feed-lock/${name}.commit"



            )



          fi



        done





        echo "===== Feed lock ====="



        cat .github-feed-lock/* || true






    - name: Install feeds


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        ./scripts/feeds install -a






    - name: Load device config


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        echo "Config file:"


        echo "${{ inputs.config_file }}"





        cp \

        "${GITHUB_WORKSPACE}/${{ inputs.config_file }}" \

        .config





        if [ -n "${{ inputs.extra_config_file }}" ]; then



          if [ -f "${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}" ]; then



            cat \

            "${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}" \

            >> .config



          fi



        fi





        echo "===== TARGET ====="



        grep "^CONFIG_TARGET" .config || true






    - name: Enable fullcone


      if: inputs.sonic_fullcone == 'true'


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        echo "CONFIG_PACKAGE_kmod-ipt-fullcone=y" >> .config


        echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" >> .config






    - name: Run defconfig


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        make defconfig





        echo "===== diffconfig ====="



        ./scripts/diffconfig.sh || true






    - name: Generate cache key


      id: cache-key


      shell: bash


      run: |


        set -euxo pipefail





        HASH=$( \

        sha256sum \

        "${OPENWRT_PATH}/.config" \

        "${OPENWRT_PATH}/feeds.conf.default" \

        "${OPENWRT_PATH}/.github-feed-lock/"* \

        2>/dev/null \

        | sha256sum \

        | cut -d' ' -f1 )





        echo "key=${{ runner.os }}-${{ inputs.device }}-${HASH}" \

        >> $GITHUB_OUTPUT






    - name: Restore build cache


      uses: actions/cache@v4



      with:



        key: ${{ steps.cache-key.outputs.key }}



        restore-keys: |


          ${{ runner.os }}-${{ inputs.device }}-



        path: |



          ${{ env.OPENWRT_PATH }}/dl


          ${{ env.OPENWRT_PATH }}/staging_dir


          ${{ env.OPENWRT_PATH }}/build_dir

    - name: Download packages

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        make download -j$(nproc)



        find dl -size -1024c -delete



        du -sh dl






    - name: Compile firmware


      id: compile


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail



        echo "===== Start Compile ====="




        make -j$(nproc) V=s || make -j1 V=s




        echo "compile=success" >> $GITHUB_OUTPUT






        echo "===== Build output ====="




        if [ -d bin/targets ]; then



          find bin/targets \

          -maxdepth 6 \

          -type f \

          -printf "%p %s bytes\n" \

          | sort



        else



          echo "No bin/targets generated"



        fi







    - name: Check target packages


      if: always()


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        echo "===== Target directories ====="



        find bin/targets -maxdepth 5 -type d || true





        echo ""



        echo "===== APK ====="



        find bin/targets \

        -type f \

        \( \

        -name "*.apk" \

        -o \

        -name "packages.adb" \

        \) \

        -print || true







    #
    # Firmware artifact
    #

    - name: Upload firmware


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:



        name: firmware-${{ inputs.device }}



        path: |



          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.bin


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.img*


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.manifest


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/sha256sums


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.buildinfo



        retention-days: 14







    #
    # ImmortalWrt APK target feed
    #

    - name: Upload target APK feed


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:



        name: target-packages-${{ inputs.device }}



        path: |



          ${{ env.OPENWRT_PATH }}/bin/targets/**/packages/**



        retention-days: 30






    #
    # 普通软件包 feed
    #

    - name: Upload package feed


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:



        name: package-feed-${{ inputs.device }}



        path: |



          ${{ env.OPENWRT_PATH }}/bin/packages/**



        retention-days: 30







    #
    # 保存配置
    #

    - name: Upload config


      if: always()


      uses: actions/upload-artifact@v4



      with:



        name: config-${{ inputs.device }}



        path: |



          ${{ env.OPENWRT_PATH }}/.config


          ${{ env.OPENWRT_PATH }}/.github-feed-lock/**



        retention-days: 30







    #
    # GitHub Release
    #

    - name: Create Release


      if: steps.compile.outputs.compile == 'success'


      uses: softprops/action-gh-release@v2



      with:



        tag_name: openwrt-${{ inputs.device }}-${{ github.run_number }}



        name: OpenWrt ${{ inputs.device }} build ${{ github.run_number }}



        files: |



          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.bin


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/*.img*


          ${{ env.OPENWRT_PATH }}/bin/targets/**/**/sha256sums



      env:



        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}







    - name: Final summary


      if: always()


      shell: bash


      run: |


        echo "============================"



        echo "Device:"


        echo "${{ inputs.device }}"



        echo ""



        echo "Repository:"


        echo "${{ inputs.repo_url }}"



        echo ""



        echo "Branch/Tag:"


        echo "${{ inputs.repo_branch }}"



        echo ""



        echo "Commit:"


        echo "${OPENWRT_COMMIT}"



        echo "============================"



        df -hT
