name: OpenWrt Build Device


on:

  workflow_call:

    inputs:

      device:

        description: Device name

        required: true

        type: string


      repo_url:

        description: Source repository

        required: true

        type: string


      repo_branch:

        description: Source branch

        required: true

        type: string


      config_file:

        description: Config file

        required: true

        type: string


      workflow_name:

        description: Workflow name

        required: true

        type: string


      install_automake_117:

        description: Install automake

        required: false

        default: "false"

        type: string


      sonic_fullcone:

        description: Enable fullcone

        required: false

        default: "false"

        type: string


      extra_config_file:

        description: Extra config

        required: false

        default: ""

        type: string



env:

  TZ: Asia/Shanghai

  WORKDIR: /workdir

  OPENWRT_PATH: /workdir/openwrt



jobs:


  build:


    name: Build ${{ inputs.device }}


    runs-on: ubuntu-22.04



    steps:



    - name: Checkout builder

      uses: actions/checkout@v4





    - name: Free disk space

      run: |


        sudo rm -rf /usr/share/dotnet

        sudo rm -rf /usr/local/lib/android

        sudo rm -rf /opt/ghc

        sudo docker image prune -af


        df -h






    - name: Init build environment

      run: |


        sudo apt-get update


        sudo apt-get install -y \

          dos2unix \

          libfuse-dev \

          rsync



        sudo bash -c \

        'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'



        sudo timedatectl set-timezone "$TZ"






    - name: Clone source

      working-directory: ${{ env.WORKDIR }}

      run: |


        git clone \

          --single-branch \

          --branch "${{ inputs.repo_branch }}" \

          "${{ inputs.repo_url }}" \

          openwrt



        cd openwrt



        echo "===== SOURCE ====="



        git log -1 --oneline



        git remote -v



        echo "================="



        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Apply feeds configuration

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |


        echo "===== Original feeds ====="


        cat feeds.conf.default || true




        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then


          echo "Using custom feeds.conf.default"


          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \

             feeds.conf.default


        fi




        echo "===== Current feeds ====="


        cat feeds.conf.default






    - name: Update feeds and lock hash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        echo "===== Update feeds ====="



        ./scripts/feeds update -a






        mkdir -p .github-feed-lock






        echo "===== Feed commit ====="




        for feed in feeds/*; do



          if [ -d "$feed/.git" ]; then



            NAME=$(basename "$feed")



            (

              cd "$feed"



              COMMIT=$(git rev-parse HEAD)



              echo "$NAME $COMMIT"



              echo "$COMMIT" \

              > "../.github-feed-lock/${NAME}.commit"



            )



          fi



        done






        echo "===== Locked feeds ====="



        cat .github-feed-lock/* || true








    - name: Install feeds


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        ./scripts/feeds install -a







    - name: Load device config


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |



        echo "===== Load config ====="



        echo "${{ inputs.config_file }}"





        cp \

        "${GITHUB_WORKSPACE}/${{ inputs.config_file }}" \

        .config






        if [ -n "${{ inputs.extra_config_file }}" ]; then



          echo "Apply extra config"



          cat \

          "${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}" \

          >> .config



        fi






        echo "===== Target ====="



        grep "^CONFIG_TARGET" .config || true







    - name: Enable fullcone


      if: inputs.sonic_fullcone == 'true'


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |



        echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" >> .config



        echo "CONFIG_PACKAGE_kmod-ipt-fullcone=y" >> .config








    - name: Defconfig


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |



        make defconfig




        echo "===== diffconfig ====="



        ./scripts/diffconfig.sh || true







    - name: Generate cache key


      id: cache-key


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |



        HASH=$(sha256sum \

        .config \

        feeds.conf.default \

        .github-feed-lock/* 2>/dev/null \

        | sha256sum | cut -d' ' -f1)





        echo "key=${{ runner.os }}-${{ inputs.device }}-${HASH}" \

        >> $GITHUB_OUTPUT







    - name: Restore build cache


      uses: actions/cache@v4


      with:



        key: ${{ steps.cache-key.outputs.key }}



        restore-keys: |


          ${{ runner.os }}-${{ inputs.device }}-



        path: |


          /workdir/openwrt/dl


          /workdir/openwrt/staging_dir


          /workdir/openwrt/build_dir






    - name: Download packages


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |



        make download -j$(nproc)




        find dl -size -1024c -delete




        echo "===== dl size ====="



        du -sh dl

    - name: Compile firmware


      id: compile


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |



        echo "===== Start compile ====="




        make -j$(nproc) V=s || make -j1 V=s






        echo "compile=success" >> $GITHUB_OUTPUT







        echo "===== Build output ====="




        find bin/targets \

          -maxdepth 5 \

          -type f \

          -printf "%p %s bytes\n" \

          | sort






    #
    # Firmware
    #

    - name: Upload firmware


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:


        name: firmware-${{ inputs.device }}



        path: |


          openwrt/bin/targets/*/*/*.bin


          openwrt/bin/targets/*/*/*.img*


          openwrt/bin/targets/*/*/*.manifest


          openwrt/bin/targets/*/*/*sha256sums


          openwrt/bin/targets/*/*/*.buildinfo



        retention-days: 30







    #
    # Target APK feed
    #
    # ImmortalWrt 25.12:
    #
    # packages.adb
    # kernel.apk
    # kmod-*.apk
    #

    - name: Upload target APK packages


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:


        name: target-packages-${{ inputs.device }}



        path: |


          openwrt/bin/targets/*/*/packages/**



        retention-days: 30







    #
    # 普通 APK packages
    #
    # base
    # luci
    # packages
    # routing
    # telephony
    #

    - name: Upload APK feeds


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:


        name: package-feed-${{ inputs.device }}



        path: |


          openwrt/bin/packages/**



        retention-days: 30







    #
    # 上传配置和 feeds hash
    #

    - name: Upload build config


      if: always()


      uses: actions/upload-artifact@v4



      with:


        name: build-config-${{ inputs.device }}



        path: |


          openwrt/.config


          openwrt/.github-feed-lock/*



        retention-days: 30







    #
    # 构建信息
    #

    - name: Build summary


      if: always()


      run: |



        echo "============================="



        echo "Device:"


        echo "${{ inputs.device }}"




        echo ""



        echo "Source:"


        echo "${{ inputs.repo_url }}"




        echo ""



        echo "Branch:"


        echo "${{ inputs.repo_branch }}"




        echo ""



        echo "Commit:"


        echo "${OPENWRT_COMMIT}"




        echo "============================="




        df -h
