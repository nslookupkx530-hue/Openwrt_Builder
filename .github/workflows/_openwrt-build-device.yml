name: OpenWrt Build Device

on:

  workflow_call:

    inputs:

      device:
        required: true
        type: string

      repo_url:
        required: true
        type: string

      repo_branch:
        required: true
        type: string

      config_file:
        required: true
        type: string

      sonic_fullcone:
        required: false
        type: string
        default: "false"

      third_party:
        required: false
        type: string
        default: disabled

      docker:
        required: false
        type: boolean
        default: false

      release:
        required: false
        type: boolean
        default: false


jobs:

  build:

    name: Build ${{ inputs.device }}

    runs-on: ubuntu-22.04


    steps:


      - name: Checkout builder repository

        uses: actions/checkout@v4


      - name: Install dependencies

        shell: bash

        run: |

          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y build-essential clang flex bison gawk gcc g++ gettext git libncurses-dev libssl-dev python3 rsync unzip wget zstd curl dos2unix


      - name: Clone OpenWrt source

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          rm -rf "${SOURCE_DIR}"

          git clone --depth=1 --branch "${{ inputs.repo_branch }}" "${{ inputs.repo_url }}" "${SOURCE_DIR}"

          ls -la "${SOURCE_DIR}"


      - name: Clean build environment

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          rm -rf staging_dir build_dir tmp

          mkdir -p dl


      - name: Check source version

        shell: bash

        run: |

          set -euxo pipefail

          cd openwrt

          git describe --tags || true
          git branch
          git log -1


      - name: Check APK package mirror
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          cd "${SOURCE_DIR}"

          echo "=== Search current APK mirror ==="

          grep -Rni \
            "mirrors.vsean.net" \
            . \
            --exclude-dir=.git \
            --exclude-dir=build_dir \
            --exclude-dir=staging_dir \
            --exclude-dir=tmp \
            | head -100


      - name: Apply device files

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          FILE_DIR="${{ github.workspace }}/files/${{ inputs.device }}"

          if [ -d "${FILE_DIR}" ]; then

            cp -rf "${FILE_DIR}/." "${SOURCE_DIR}/files/"

            echo "Applied files for ${{ inputs.device }}"


          # 保证 uci-defaults 脚本可执行
          if [ -d "${SOURCE_DIR}/files/etc/uci-defaults" ]; then

            chmod 755 "${SOURCE_DIR}/files/etc/uci-defaults/"*

            echo "uci-defaults permissions fixed"

            ls -la "${SOURCE_DIR}/files/etc/uci-defaults/"

          fi

            echo "Applied files list:"
            find "${SOURCE_DIR}/files" -type f

          else
            
            echo "No custom files for ${{ inputs.device }}"

          fi


      - name: Check custom files

        shell: bash

        run: |

          set -euxo pipefail

          if [ -d "openwrt/files" ]; then

             find openwrt/files -type f | sort

          else
          
             echo "No custom files directory"

          fi


      - name: Add third-party source feeds

        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"          

          THIRD_PARTY_CONFIG="${{ github.workspace }}/config/Third-Party/third-party.config"
          
          if [ ! -f "${THIRD_PARTY_CONFIG}" ]; then

            echo "No third-party.config"
            
            exit 0
            
          fi
          
          echo "Load third-party.config"
          source "${THIRD_PARTY_CONFIG}"

          if [ -z "${CUSTOM_SOURCE_FEEDS:-}" ]; then

            echo "No custom source feeds"
            
            exit 0

          fi

          echo "${CUSTOM_SOURCE_FEEDS}" | while IFS='|' read -r name url branch

          do
          
            [ -z "${name}" ] && continue

            echo "Add source feed: ${name}"
            
            echo "src-git ${name} ${url};${branch}" \
              >> "${SOURCE_DIR}/feeds.conf.default"

          done

          echo "Current feeds.conf.default"

          cat "${SOURCE_DIR}/feeds.conf.default"


      - name: Update feeds

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          ./scripts/feeds update -a


      - name: Install feeds

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          ./scripts/feeds install -a -f


      - name: Check luci packages

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          find feeds -path "*luci*" -print | sed -n '1,50p'
         

      - name: Prepare config

        shell: bash

        env:

          CONFIG_FILE: ${{ inputs.config_file }}

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          CONFIG_PATH="${{ github.workspace }}/${CONFIG_FILE}"

          if [ ! -f "${CONFIG_PATH}" ]; then

            echo "Missing config: ${CONFIG_PATH}"

            exit 1

          fi


          cd "${SOURCE_DIR}"

          cp "${CONFIG_PATH}" .config

          echo "Base config applied"


      - name: Load third-party config

        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        run: |

          set -euxo pipefail

          CONFIG_PATH="${{ github.workspace }}/config/Third-Party/third-party.config"
          
          if [ ! -f "${CONFIG_PATH}" ]; then

            echo "Missing third-party config:"
            echo "${CONFIG_PATH}"
            exit 1
          fi
          
          source "${CONFIG_PATH}"

          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES:-}" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Third-party CUSTOM_PACKAGES:"
          echo "${CUSTOM_PACKAGES:-}"
          echo "=========================================="


      - name: Apply third-party APK feeds

        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          THIRD_CONFIG="${{ github.workspace }}/config/Third-Party/third-party.config"


          if [ ! -f "${THIRD_CONFIG}" ]; then

            echo "No third-party.config"

            exit 0

          fi

          source "${THIRD_CONFIG}"

          if [ -z "${CUSTOM_APK_FEEDS:-}" ]; then

            echo "No custom APK feeds"

            exit 0

          fi

          mkdir -p "${SOURCE_DIR}/files/etc/apk/repositories.d"

          echo "${CUSTOM_APK_FEEDS}" | while IFS='|' read -r name url

          do

            [ -z "${name}" ] && continue

            echo "Add custom APK feed: ${name}"


            echo "${url}" \
              >> "${SOURCE_DIR}/files/etc/apk/repositories.d/${name}.list"

          done

          echo "Custom APK feeds:"

          find "${SOURCE_DIR}/files/etc/apk/repositories.d" -type f \
            -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;          
 

      - name: Check target architecture
        #检测当前的硬件架构，X86、arm64、arm64-a53
        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          cd "${SOURCE_DIR}"

          echo "=========================================="
          echo "Target architecture configuration"
          echo "=========================================="

          grep -E \
            '^CONFIG_TARGET_|^CONFIG_ARCH_' \
            .config \
            | head -100 || true


      - name: Prepare third-party APK packages

        if: ${{ inputs.third_party == 'enabled' && env.CUSTOM_PACKAGES != '' }}

        shell: bash

        env:

          CUSTOM_PACKAGES: ${{ env.CUSTOM_PACKAGES }}

        run: |

          set -euxo pipefail


          SOURCE_DIR="${{ github.workspace }}/openwrt"

          cd "${SOURCE_DIR}"

          export SOURCE_DIR

          bash "${{ github.workspace }}/shell/apk-custom-packages.sh"


      - name: Prepare third-party APK package list

        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        env:

          CUSTOM_PACKAGES: ${{ env.CUSTOM_PACKAGES }}

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          cd "${SOURCE_DIR}"

          rm -f tmp/third-party-apk-packages
          mkdir -p tmp

          for PACKAGE in ${CUSTOM_PACKAGES:-}; do
            echo "${PACKAGE}" >> tmp/third-party-apk-packages
          done

          echo "=========================================="
          echo "Third-party APK package list"
          echo "=========================================="

          if [ -s tmp/third-party-apk-packages ]; then
         
            cat tmp/third-party-apk-packages

          else

            echo "No third-party APK packages"

          fi


      - name: Generate third-party APK package selection

        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        run: |

          set -euxo pipefail


          SOURCE_DIR="${{ github.workspace }}/openwrt"


          cd "${SOURCE_DIR}"


          echo "=========================================="
          echo "Generate third-party APK package selection"
          echo "=========================================="


          if [ ! -f "tmp/third-party-apk-packages" ]; then

            echo "No third-party APK package list"

            exit 0

          fi


          rm -f tmp/third-party-apk-selection


          touch tmp/third-party-apk-selection


          while read -r PACKAGE

          do

            PACKAGE=$(echo "${PACKAGE}" | xargs)


            [ -z "${PACKAGE}" ] && continue


            grep -qx "${PACKAGE}" tmp/third-party-apk-selection || \
            echo "${PACKAGE}" >> tmp/third-party-apk-selection


          done < tmp/third-party-apk-packages



          echo "=========================================="
          echo "Third-party APK package selection"
          echo "=========================================="


          if [ -s tmp/third-party-apk-selection ]; then

            cat tmp/third-party-apk-selection

          else

            echo "No third-party APK packages selected"

          fi


      - name: Register third-party APK feed

        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        run: |

          set -euxo pipefail


          SOURCE_DIR="${{ github.workspace }}/openwrt"


          cd "${SOURCE_DIR}"


          mkdir -p packages


          echo "=========================================="
          echo "Register third-party APK feed"
          echo "=========================================="


          echo "src-apk third-party packages" \
          >> feeds.conf.default


          tail -n 20 feeds.conf.default


      - name: Make defconfig

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          make defconfig V=s


      - name: Prepare third-party APK repository

        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        run: |

          set -euxo pipefail


          SOURCE_DIR="${{ github.workspace }}/openwrt"


          cd "${SOURCE_DIR}"


          echo "=========================================="
          echo "Prepare third-party APK repository"
          echo "=========================================="


          mkdir -p packages



          echo "Copy third-party APK:"


          find packages -name "*.apk" -type f | sort



          echo "Generate APK repository index"


          if [ -x "staging_dir/host/bin/apk" ]; then

              staging_dir/host/bin/apk \
              index \
              packages

          else

              echo "OpenWrt host apk not ready"

              echo "Skip index generation"

          fi


      - name: Enable sonic fullcone

        if: ${{ inputs.sonic_fullcone == 'true' }}

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          echo "Enable sonic fullcone"

          echo "Enable sonic fullcone"

          echo "CONFIG_PACKAGE_kmod-nft-fullcone=y" >> .config 


      - name: Prepare third-party APK install list

        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        run: |

          set -euxo pipefail


          SOURCE_DIR="${{ github.workspace }}/openwrt"


          cd "${SOURCE_DIR}"


          echo "=========================================="
          echo "Prepare third-party APK install list"
          echo "=========================================="


          if [ ! -f tmp/third-party-apk-selection ]; then

            echo "No third-party APK selection"

            exit 0

          fi


          mkdir -p files/etc/apk


          rm -f files/etc/apk/world


          while read -r PACKAGE

          do

            PACKAGE=$(echo "${PACKAGE}" | xargs)


            [ -z "${PACKAGE}" ] && continue


            echo "${PACKAGE}" >> files/etc/apk/world


          done < tmp/third-party-apk-selection



          echo "=========================================="
          echo "APK world list"
          echo "=========================================="


          cat files/etc/apk/world


      - name: Apply third-party source packages
        if: ${{ inputs.third_party == 'enabled' }}
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"
          THIRD_PARTY_CONFIG="${{ github.workspace }}/config/Third-Party/third-party.config"

          if [ ! -f "${THIRD_PARTY_CONFIG}" ]; then
            echo "No third-party.config"
            exit 0
          fi

          source "${THIRD_PARTY_CONFIG}"

          if [ -z "${CUSTOM_SOURCE_PACKAGES}" ]; then
            echo "No custom source packages"
            exit 0
          fi

          cd "${SOURCE_DIR}"

          echo "${CUSTOM_SOURCE_PACKAGES}" | while read -r PACKAGE
          do
            PACKAGE=$(echo "${PACKAGE}" | xargs)

            [ -z "${PACKAGE}" ] && continue

            echo "Enable source package: ${PACKAGE}"

            if ! grep -q "^CONFIG_PACKAGE_${PACKAGE}=y$" .config; then
              echo "CONFIG_PACKAGE_${PACKAGE}=y" >> .config
            fi
          done

          echo "=== Third-party source package config ==="

          echo "${CUSTOM_SOURCE_PACKAGES}" | while read -r PACKAGE
          do
            PACKAGE=$(echo "${PACKAGE}" | xargs)

            [ -z "${PACKAGE}" ] && continue

            grep "^CONFIG_PACKAGE_${PACKAGE}=y$" .config || true
          done


      - name: Check third-party APK packages

        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        env:

          CUSTOM_PACKAGES: ${{ env.CUSTOM_PACKAGES }}

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          PACKAGE_DIR="${SOURCE_DIR}/packages"

          cd "${SOURCE_DIR}"

          echo "=========================================="
          echo "Check third-party APK packages"
          echo "=========================================="

          if [ -z "${CUSTOM_PACKAGES// }" ]; then

            echo "ℹ️ No third-party APK packages enabled."

            exit 0

          fi

          for PACKAGE in ${CUSTOM_PACKAGES}; do

            echo
            echo "----- ${PACKAGE} -----"

            MATCH_COUNT=$(
              find "${PACKAGE_DIR}" \
                -maxdepth 1 \
                -type f \
                -name "${PACKAGE}-*.apk" \
                | wc -l
            )

            if [ "${MATCH_COUNT}" -eq 0 ]; then

              echo "❌ APK not found: ${PACKAGE}"

              exit 1

            fi

            find "${PACKAGE_DIR}" \
              -maxdepth 1 \
              -type f \
              -name "${PACKAGE}-*.apk" \
              -printf '✅ %f\n'

          done

          echo
          echo "✅ All requested third-party APK packages were found."


      - name: Prepare rootfs APK install list

        if: ${{ inputs.third_party == 'enabled' }}

        shell: bash

        run: |

          set -euxo pipefail


          SOURCE_DIR="${{ github.workspace }}/openwrt"


          cd "${SOURCE_DIR}"


          if [ -f tmp/third-party-apk-packages ]; then


              mkdir -p files/etc/apk


              cp tmp/third-party-apk-packages \
              files/etc/apk/third-party-packages


              echo "Third party APK install list:"
              cat files/etc/apk/third-party-packages


          fi


      - name: Prepare build download

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          mkdir -p dl

          make download -j$(nproc)


      - name: Check uci-defaults

        shell: bash

        run: |

          set -euxo pipefail

          find openwrt/files/etc/uci-defaults -type f -exec ls -l {} \; || true


      - name: Build firmware

        shell: bash

        run: |

          set -euxo pipefail

          cd "${{ github.workspace }}/openwrt"

          export MAKEFLAGS="-j$(nproc)"

          export HOSTCFLAGS="-Wno-error"

          export HOSTCXXFLAGS="-Wno-error"

          export HOSTLDFLAGS=""

          make V=s 2>&1 | tee build.log


      - name: Upload build log

        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.device }}-build-log-${{ github.run_id }}

          path: openwrt/build.log

          if-no-files-found: ignore


      - name: Collect firmware

        shell: bash

        run: |

          set -euxo pipefail

          SOURCE_DIR="${{ github.workspace }}/openwrt"

          mkdir -p "${SOURCE_DIR}/output/firmware"

          find "${SOURCE_DIR}/bin/targets" -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" \) -exec cp -f {} "${SOURCE_DIR}/output/firmware/" \; || true

          find "${SOURCE_DIR}/output/firmware" -type f | sort


      - name: Collect APK feed

        shell: bash

        run: |

          set -euxo pipefail


          SOURCE_DIR="${{ github.workspace }}/openwrt"


          mkdir -p "${SOURCE_DIR}/output/apk-feed"


          # OpenWrt 官方 APK feed
          find "${SOURCE_DIR}/bin/packages" \
          -type f \
          -name "*.apk" \
          -exec cp -f {} "${SOURCE_DIR}/output/apk-feed/" \; || true


          find "${SOURCE_DIR}/bin/packages" \
          -type f \
          -name "packages.adb" \
          -exec cp -f {} "${SOURCE_DIR}/output/apk-feed/" \; || true



          # 第三方预编译 APK
          if [ -d "${SOURCE_DIR}/packages" ]; then

              echo "Copy third-party APK packages"

              cp -f \
              "${SOURCE_DIR}"/packages/*.apk \
              "${SOURCE_DIR}/output/apk-feed/" \
              || true

          fi



          echo "=========================================="
          echo "Collected APK feed"
          echo "=========================================="


          find "${SOURCE_DIR}/output/apk-feed" -type f | sort


      - name: Generate LuCI package list

        shell: bash

        run: |

          set -euxo pipefail

          mkdir -p release

          echo "#### ${{ inputs.device }}" > release/${{ inputs.device }}-luci.md

          echo "" >> release/${{ inputs.device }}-luci.md

          grep "^CONFIG_PACKAGE_luci" \
          openwrt/.config \
          | grep "=y" \
          | sed 's/CONFIG_PACKAGE_//' \
          | sed 's/=y//' \
          | sed 's/_/\\_/g' \
          | sed 's/^/- /' \
          >> release/${{ inputs.device }}-luci.md

          cat release/${{ inputs.device }}-luci.md


      - name: Prepare artifact

        shell: bash

        run: |

          set -euxo pipefail

          mkdir -p artifact/${{ inputs.device }}

          cp -rf openwrt/output/firmware \
          artifact/${{ inputs.device }}/ || true

          cp -rf openwrt/output/apk-feed \
          artifact/${{ inputs.device }}/ || true

          cp -f release/${{ inputs.device }}-luci.md \
          artifact/${{ inputs.device }}/ || true

          find artifact -type f | sort


      - name: Upload firmware artifact

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.device }}-firmware-${{ github.run_id }}

          path: artifact/${{ inputs.device }}/firmware

          if-no-files-found: error


      - name: Upload APK feed artifact

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.device }}-apk-feed-${{ github.run_id }}

          path: artifact/${{ inputs.device }}/apk-feed

          if-no-files-found: error


      - name: Upload release info artifact

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.device }}-release-info-${{ github.run_id }}

          path: release/${{ inputs.device }}-luci.md

          if-no-files-found: error
