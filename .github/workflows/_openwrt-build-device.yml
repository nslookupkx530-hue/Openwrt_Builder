name: OpenWrt Build Device


on:


  workflow_call:


    inputs:


      device:

        description: Device name

        required: true

        type: string



      repo_url:

        description: Source repository

        required: true

        type: string



      repo_branch:

        description: Source branch

        required: true

        type: string



      config_file:

        description: Config file

        required: true

        type: string



      workflow_name:

        description: Workflow name

        required: false

        default: OpenWrt Build

        type: string



      install_automake_117:

        description: Install automake

        required: false

        default: "false"

        type: string



      sonic_fullcone:

        description: Enable fullcone

        required: false

        default: "false"

        type: string



      extra_config_file:

        description: Extra config

        required: false

        default: ""

        type: string



      docker:

        description: Enable docker

        required: false

        default: "false"

        type: string



      release:

        description: Create release

        required: false

        default: "true"

        type: string





env:


  TZ: Asia/Shanghai


  WORKDIR: /workdir


  OPENWRT_PATH: /workdir/openwrt





permissions:


  contents: write






jobs:


  build:


    name: Build ${{ inputs.device }}



    runs-on: ubuntu-22.04





    steps:




    - name: Checkout builder

      uses: actions/checkout@v4






    - name: Free disk space

      shell: bash

      run: |


        set -euxo pipefail



        sudo rm -rf /usr/share/dotnet || true

        sudo rm -rf /usr/local/lib/android || true

        sudo rm -rf /opt/ghc || true



        sudo docker image prune -af || true



        df -h






    - name: Init build environment

      shell: bash

      run: |


        set -euxo pipefail



        sudo apt-get update



        sudo apt-get install -y \

          curl \

          rsync \

          dos2unix \

          libfuse-dev \

          build-essential





        sudo mkdir -p "$WORKDIR"



        sudo chown "$USER:$USER" "$WORKDIR"





        curl -L \

        https://build-scripts.immortalwrt.org/init_build_environment.sh \

        -o /tmp/init_build_environment.sh




        chmod +x /tmp/init_build_environment.sh




        sudo bash /tmp/init_build_environment.sh




        sudo timedatectl set-timezone "$TZ"







    - name: Clone source


      working-directory: ${{ env.WORKDIR }}


      shell: bash


      run: |


        set -euxo pipefail




        rm -rf openwrt





        git clone \

          --branch "${{ inputs.repo_branch }}" \

          "${{ inputs.repo_url }}" \

          openwrt





        cd openwrt





        git log -1 --oneline





        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

    #
    # 检查源码
    #

    - name: Verify source

      shell: bash

      run: |

        set -euxo pipefail



        test -d "${OPENWRT_PATH}"

        test -f "${OPENWRT_PATH}/Makefile"



        echo "Source OK"







    #
    # 安装 automake 兼容旧设备
    #

    - name: Install automake 1.17

      if: inputs.install_automake_117 == 'true'

      shell: bash

      run: |

        set -euxo pipefail



        sudo apt-get update



        sudo apt-get install -y \

          automake \

          autoconf






    #
    # feeds配置
    #

    - name: Configure feeds

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        echo "===== feeds.conf.default ====="



        cat feeds.conf.default || true






        if [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ]; then



          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \

             feeds.conf.default



        fi





        echo "===== Final feeds ====="



        cat feeds.conf.default







    #
    # 更新feeds
    #

    - name: Update feeds


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail



        ./scripts/feeds update -a





        mkdir -p .github-feed-lock






        for feed in feeds/*; do


          if [ -d "$feed/.git" ]; then



            name=$(basename "$feed")



            (

              cd "$feed"



              git rev-parse HEAD \

              > "../../.github-feed-lock/${name}.commit"


            )


          fi


        done






        echo "===== Feed lock ====="



        cat .github-feed-lock/* || true







    #
    # 安装feeds
    #

    - name: Install feeds


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail



        ./scripts/feeds install -a







    #
    # 导入config
    #

    - name: Load config


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        CONFIG="${GITHUB_WORKSPACE}/${{ inputs.config_file }}"





        echo "Using config: ${CONFIG}"





        if [ ! -f "$CONFIG" ]; then



          echo "Config not found"



          exit 1



        fi





        cp "$CONFIG" .config





        echo "===== TARGET ====="



        grep "^CONFIG_TARGET" .config || true








    #
    # extra config
    #

    - name: Apply extra config


      if: inputs.extra_config_file != ''

      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        EXTRA="${GITHUB_WORKSPACE}/${{ inputs.extra_config_file }}"





        if [ -f "$EXTRA" ]; then



          cat "$EXTRA" >> .config



        fi








    #
    # fullcone兼容
    #

    - name: Enable fullcone


      if: inputs.sonic_fullcone == 'true'

      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        echo "Enable fullcone"





        echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" >> .config

        echo "CONFIG_PACKAGE_kmod-ipt-fullconenat=y" >> .config







    #
    # docker
    #

    - name: Enable docker


      if: inputs.docker == 'true'


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        echo "Enable docker packages"





        cat >> .config <<EOF

CONFIG_PACKAGE_docker=y

CONFIG_PACKAGE_dockerd=y

CONFIG_PACKAGE_containerd=y

EOF







    #
    # 生成最终配置
    #

    - name: Defconfig


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        make defconfig





        echo "===== FINAL CONFIG ====="



        ./scripts/diffconfig.sh || true







    #
    # Cache key
    #

    - name: Generate cache key


      id: cache


      shell: bash


      run: |


        set -euxo pipefail





        HASH=$(sha256sum \

        "${OPENWRT_PATH}/.config" \

        "${OPENWRT_PATH}/feeds.conf.default" \

        ${OPENWRT_PATH}/.github-feed-lock/* \

        2>/dev/null \

        | sha256sum \

        | cut -d' ' -f1)





        echo "key=openwrt-${{ inputs.device }}-${HASH}" >> $GITHUB_OUTPUT







    #
    # Cache
    #

    - name: Restore cache


      uses: actions/cache@v4



      with:



        key: ${{ steps.cache.outputs.key }}



        restore-keys: |


          openwrt-${{ inputs.device }}-





        path: |


          /workdir/openwrt/dl


          /workdir/openwrt/build_dir


          /workdir/openwrt/staging_dir







    #
    # 下载源码包
    #

    - name: Download packages


      shell: bash


      working-directory: ${{ env.OPENWRT_PATH }}


      run: |


        set -euxo pipefail





        make download -j$(nproc)





        find dl -size -1024c -delete





        du -sh dl

    #
    # 编译固件
    #

    - name: Compile firmware

      id: compile

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set -euxo pipefail



        echo "================================="

        echo " Build ${{ inputs.device }} "

        echo "================================="





        make -j$(nproc) V=s





        echo "compile=success" >> $GITHUB_OUTPUT







    #
    # 编译结果检查
    #

    - name: Check firmware output

      if: always()

      shell: bash

      working-directory: ${{ env.OPENWRT_PATH }}

      run: |

        set +e





        echo "===== DEVICE ====="

        echo "${{ inputs.device }}"





        echo ""

        echo "===== TARGET FILES ====="





        find bin/targets \

          -type f \

          | sort || true





        echo ""

        echo "===== APK FILES ====="





        find bin \

          -type f \

          \( \

          -name "*.apk" \

          -o -name "packages.adb" \

          \) \

          | sort || true







    #
    # 上传完整固件
    #

    - name: Upload firmware


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:



        name: firmware-${{ inputs.device }}-${{ github.run_number }}



        path: |


          /workdir/openwrt/bin/targets/**





        if-no-files-found: warn



        retention-days: 30







    #
    # 上传 target APK feed
    #

    - name: Upload target APK feed


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:



        name: target-apk-${{ inputs.device }}-${{ github.run_number }}



        path: |


          /workdir/openwrt/bin/targets/**/packages/**


          /workdir/openwrt/bin/targets/**/packages.adb





        if-no-files-found: warn



        retention-days: 90







    #
    # 上传普通APK feed
    #

    - name: Upload package APK feed


      if: steps.compile.outputs.compile == 'success'


      uses: actions/upload-artifact@v4



      with:



        name: packages-apk-${{ inputs.device }}-${{ github.run_number }}



        path: |


          /workdir/openwrt/bin/packages/**





        if-no-files-found: warn



        retention-days: 90







    #
    # 上传编译配置
    #

    - name: Upload build information


      if: always()


      uses: actions/upload-artifact@v4



      with:



        name: build-info-${{ inputs.device }}-${{ github.run_number }}



        path: |


          /workdir/openwrt/.config


          /workdir/openwrt/.github-feed-lock/**


          /workdir/openwrt/bin/targets/**/*.buildinfo


          /workdir/openwrt/bin/targets/**/*.manifest


          /workdir/openwrt/bin/targets/**/*sha256sums





        if-no-files-found: ignore



        retention-days: 30







    #
    # GitHub Release
    #

    - name: Create GitHub Release


      if: |

        steps.compile.outputs.compile == 'success' &&

        inputs.release == 'true'


      uses: softprops/action-gh-release@v2



      with:



        tag_name: |

          ${{ inputs.device }}-${{ github.run_number }}



        name: |

          OpenWrt ${{ inputs.device }} Build ${{ github.run_number }}



        files: |


          /workdir/openwrt/bin/targets/**/*





      env:



        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}









    #
    # 保存缓存
    #

    - name: Save build cache


      if: always()


      uses: actions/cache/save@v4



      with:



        key: ${{ steps.cache.outputs.key }}



        path: |


          /workdir/openwrt/dl


          /workdir/openwrt/build_dir


          /workdir/openwrt/staging_dir







    #
    # 构建总结
    #

    - name: Build summary


      if: always()


      shell: bash


      run: |


        echo "================================="

        echo " OpenWrt Build Summary "

        echo "================================="





        echo "Device:"

        echo "${{ inputs.device }}"





        echo ""

        echo "Commit:"

        echo "${OPENWRT_COMMIT}"





        echo ""

        echo "Target:"

        grep "^CONFIG_TARGET.*=y" \

        "${OPENWRT_PATH}/.config" || true





        echo ""

        echo "Disk:"

        df -hT
