name: Publish OpenWrt APK Feed


on:


  workflow_call:


    inputs:


      feed_path:


        description: Feed directory


        required: false


        default: feed


        type: string





permissions:


  contents: write


  pages: write


  id-token: write





jobs:


  deploy-feed:





    name: Deploy APK Feed





    runs-on: ubuntu-22.04





    steps:





      - name: Checkout


        uses: actions/checkout@v4





      - name: Prepare Pages directory


        shell: bash


        run: |


          set -euxo pipefail





          rm -rf public





          mkdir -p public/packages





      - name: Download merged feed artifact


        uses: actions/download-artifact@v4


        with:


          name: merged-openwrt-apk-feed


          path: public





      - name: Check feed files


        shell: bash


        run: |


          set +e





          echo "=============================="


          echo "FINAL APK FEED"


          echo "=============================="





          find public -type f | sort





      - name: Upload Pages artifact


        uses: actions/upload-pages-artifact@v3


        with:


          path: public





      - name: Deploy GitHub Pages


        uses: actions/deploy-pages@v4
