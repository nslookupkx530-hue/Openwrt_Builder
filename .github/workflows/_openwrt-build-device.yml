name: OpenWrt Build Device


on:

  workflow_call:

    inputs:


      device:

        description: Device name

        required: true

        type: string



      repo_url:

        description: OpenWrt source repository

        required: true

        type: string



      repo_branch:

        description: OpenWrt source branch

        required: true

        type: string



      config_file:

        description: Build config file

        required: true

        type: string



      workflow_name:

        description: Workflow name

        required: false

        type: string

        default: ""



      install_automake_117:

        description: Install automake compatibility

        required: false

        type: string

        default: "false"



      docker:

        description: Enable docker packages

        required: false

        type: string

        default: "false"



      sonic_fullcone:

        description: Enable fullcone

        required: false

        type: string

        default: "false"



      release:

        description: Create release

        required: false

        type: string

        default: "true"





permissions:


  contents: write






env:


  TZ: Asia/Shanghai

  WORKDIR: /workdir

  OPENWRT_PATH: /workdir/openwrt






jobs:



  build:



    name: Build ${{ inputs.device }}



    runs-on: ubuntu-22.04



    steps:



      - name: Checkout

        uses: actions/checkout@v4





      - name: Free disk space

        shell: bash

        run: |

          set -eux


          sudo rm -rf /usr/share/dotnet || true

          sudo rm -rf /usr/local/lib/android || true

          sudo rm -rf /opt/ghc || true


          sudo docker image prune -af || true


          df -h






      - name: Install build dependencies

        shell: bash

        run: |

          set -eux


          sudo apt-get update


          sudo apt-get install -y \

            build-essential \

            gcc \

            g++ \

            make \

            curl \

            rsync \

            unzip \

            file \

            python3 \

            python3-distutils \

            gawk \

            gettext \

            libncurses-dev \

            zlib1g-dev \

            libssl-dev \

            wget \

            git






      - name: Prepare work directory

        shell: bash

        run: |

          set -eux


          sudo mkdir -p "${WORKDIR}"


          sudo chown -R "$USER:$USER" "${WORKDIR}"


          sudo timedatectl set-timezone "${TZ}"






      - name: Clone OpenWrt source

        shell: bash

        working-directory: /workdir

        run: |

          set -eux


          rm -rf openwrt


          echo "================================"

          echo "Repository"

          echo "${{ inputs.repo_url }}"

          echo "Branch"

          echo "${{ inputs.repo_branch }}"

          echo "================================"



          git clone \

            --depth=1 \

            --single-branch \

            --branch "${{ inputs.repo_branch }}" \

            "${{ inputs.repo_url }}" \

            openwrt



          test -f openwrt/Makefile



          cd openwrt



          git log -1 --oneline



          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"






      - name: Verify OpenWrt source

        shell: bash

        run: |

          set -eux


          test -f /workdir/openwrt/Makefile


          echo "OpenWrt source OK"






      - name: Update feeds

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          ./scripts/feeds update -a


          ./scripts/feeds install -a






      - name: Load device config

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          CONFIG_FILE="${GITHUB_WORKSPACE}/${{ inputs.config_file }}"


          echo "Using config:"

          echo "${CONFIG_FILE}"


          test -f "${CONFIG_FILE}"



          cp "${CONFIG_FILE}" .config



          echo "===== TARGET CONFIG ====="


          grep "^CONFIG_TARGET" .config || true



      - name: Enable Docker

        if: inputs.docker == 'true'

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          echo "Enable docker packages"


          cat >> .config <<EOF

CONFIG_PACKAGE_dockerd=y

CONFIG_PACKAGE_docker=y

CONFIG_PACKAGE_luci-app-dockerman=y

EOF






      - name: Enable FullCone

        if: inputs.sonic_fullcone == 'true'

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          echo "Enable fullcone packages"



          grep -q "^CONFIG_PACKAGE_kmod-nft-fullcone=y" .config || \

          echo "CONFIG_PACKAGE_kmod-nft-fullcone=y" >> .config



          grep -q "^CONFIG_PACKAGE_luci-app-fullconenat=y" .config || \

          echo "CONFIG_PACKAGE_luci-app-fullconenat=y" >> .config






      - name: Install automake compatibility

        if: inputs.install_automake_117 == 'true'

        shell: bash

        run: |

          set -eux


          sudo apt-get update


          sudo apt-get install -y \

            automake \

            autoconf \

            libtool






      - name: Defconfig

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux


          make defconfig



          echo "=============================="

          echo "Target config"

          echo "=============================="


          grep "^CONFIG_TARGET" .config || true






      - name: Generate cache key

        id: cache

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux



          CONFIG_HASH=$(sha256sum .config | awk '{print $1}')


          SOURCE_HASH=$(git rev-parse HEAD)



          KEY="openwrt-${{ inputs.device }}-${SOURCE_HASH}-${CONFIG_HASH}"



          echo "key=${KEY}" >> "$GITHUB_OUTPUT"



          echo "Cache key: ${KEY}"








      - name: Restore build cache

        uses: actions/cache@v4


        with:


          path: |

            /workdir/openwrt/dl

            /workdir/openwrt/build_dir

            /workdir/openwrt/staging_dir



          key: ${{ steps.cache.outputs.key }}



          restore-keys: |

            openwrt-${{ inputs.device }}-






      - name: Download source packages

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux



          make download -j$(nproc)



          find dl -size -1024c -delete || true



          du -sh dl || true






      - name: Compile firmware

        id: compile

        shell: bash

        working-directory: /workdir/openwrt

        run: |

          set -eux



          echo "================================"

          echo "Building: ${{ inputs.device }}"

          echo "================================"



          make -j$(nproc) V=s 2>&1 | tee build.log



          echo "success=true" >> "$GITHUB_OUTPUT"



      - name: Upload compile log

        if: failure()

        uses: actions/upload-artifact@v4


        with:


          name: compile-log-${{ inputs.device }}-${{ github.run_number }}


          path: /workdir/openwrt/build.log


          if-no-files-found: warn


          retention-days: 30






      - name: Check build output

        if: always()

        shell: bash

        run: |

          set +e


          echo "================================"

          echo " Firmware output "

          echo "================================"



          if [ -d /workdir/openwrt/bin/targets ]; then


            find /workdir/openwrt/bin/targets -type f | sort


          else


            echo "No firmware output"


          fi





          echo ""


          echo "================================"

          echo " Packages output "

          echo "================================"



          if [ -d /workdir/openwrt/bin/packages ]; then


            find /workdir/openwrt/bin/packages -type f | sort


          else


            echo "No packages output"


          fi






      - name: Upload firmware

        if: steps.compile.outputs.success == 'true'

        uses: actions/upload-artifact@v4


        with:


          name: firmware-${{ inputs.device }}-${{ github.run_number }}


          path: |

            /workdir/openwrt/bin/targets/**



          if-no-files-found: warn


          retention-days: 30






      - name: Upload APK feed

        if: steps.compile.outputs.success == 'true'

        uses: actions/upload-artifact@v4


        with:


          name: apk-feed-${{ inputs.device }}-${{ github.run_number }}



          path: |

            /workdir/openwrt/bin/packages/**

            /workdir/openwrt/bin/targets/**



          if-no-files-found: warn


          retention-days: 90






      - name: Upload build information

        if: always()

        uses: actions/upload-artifact@v4


        with:


          name: build-info-${{ inputs.device }}-${{ github.run_number }}



          path: |

            /workdir/openwrt/.config

            /workdir/openwrt/build.log



          if-no-files-found: warn


          retention-days: 30






      - name: Create GitHub Release

        if: steps.compile.outputs.success == 'true' && inputs.release == 'true'

        uses: softprops/action-gh-release@v2



        with:



          tag_name: ${{ inputs.device }}-${{ github.run_number }}



          name: "${{ inputs.device }} Build ${{ github.run_number }}"



          files: |

            /workdir/openwrt/bin/targets/**



        env:



          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}






      - name: Build summary

        if: always()

        shell: bash

        run: |


          echo "================================"

          echo " OpenWrt Build Summary "

          echo "================================"



          echo "Device: ${{ inputs.device }}"


          echo "Repository: ${{ inputs.repo_url }}"


          echo "Branch: ${{ inputs.repo_branch }}"


          echo "Commit: ${OPENWRT_COMMIT:-unknown}"



          echo ""


          df -h
