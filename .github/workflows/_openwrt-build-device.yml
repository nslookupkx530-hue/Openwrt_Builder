name: OpenWrt Build Device


on:


  workflow_call:


    inputs:


      device:


        description: Device name


        required: true


        type: string



      repo_url:


        description: OpenWrt source repository


        required: true


        type: string



      repo_branch:


        description: OpenWrt source branch


        required: true


        type: string



      config_file:


        description: Device config file


        required: true


        type: string



      install_automake_117:


        description: Install automake


        required: false


        default: "false"


        type: string



      sonic_fullcone:


        description: Enable sonic fullcone


        required: false


        default: "false"


        type: string



      docker:


        description: Enable docker packages


        required: false


        default: false


        type: boolean



      release:


        description: Create GitHub release


        required: false


        default: false


        type: boolean





permissions:


  contents: write





env:


  TZ: Asia/Shanghai





jobs:



  build:



    name: Build ${{ inputs.device }}



    runs-on: ubuntu-22.04





    steps:



      - name: Checkout repository


        uses: actions/checkout@v4





      - name: Free disk space


        shell: bash


        run: |


          set -euxo pipefail


          sudo rm -rf /usr/share/dotnet || true


          sudo rm -rf /usr/local/lib/android || true


          sudo rm -rf /opt/ghc || true


          sudo docker image prune -af || true


          df -hT





      - name: Install build dependencies


        shell: bash


        run: |


          set -euxo pipefail


          sudo apt-get update


          sudo apt-get install -y build-essential clang flex bison gawk gcc g++ gettext git libncurses-dev libssl-dev python3 rsync unzip wget zstd curl dos2unix


          sudo timedatectl set-timezone "${TZ}"





      - name: Prepare work directory


        shell: bash


        run: |


          set -euxo pipefail


          sudo mkdir -p /workdir


          sudo chown -R "${USER}:${USER}" /workdir


          rm -rf /workdir/openwrt


          ls -la /workdir



      - name: Clone OpenWrt source

        shell: bash

        run: |

          set -euxo pipefail


          cd /workdir


          echo "=============================="

          echo "Clone source"

          echo "=============================="


          git clone \
            --depth=1 \
            --branch "${{ inputs.repo_branch }}" \
            "${{ inputs.repo_url }}" \
            openwrt



          if [ ! -f "/workdir/openwrt/Makefile" ]; then

            echo "OpenWrt source clone failed"

            exit 1

          fi



          cd /workdir/openwrt



          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"



          echo "=============================="

          echo "Source"

          echo "=============================="


          git log -1 --oneline





      - name: Update feeds

        shell: bash

        run: |

          set -euxo pipefail


          cd /workdir/openwrt


          ./scripts/feeds update -a



          mkdir -p .github-feed-lock



          for feed in feeds/*; do

            if [ -d "${feed}/.git" ]; then

              name=$(basename "${feed}")

              (

                cd "${feed}"

                git rev-parse HEAD > "/workdir/openwrt/.github-feed-lock/${name}.commit"

              )

            fi

          done



          echo "=============================="

          echo "Feed lock"

          echo "=============================="


          cat .github-feed-lock/* || true





      - name: Install feeds

        shell: bash

        run: |

          set -euxo pipefail


          cd /workdir/openwrt


          ./scripts/feeds install -a





      - name: Load device config

        shell: bash

        run: |

          set -euxo pipefail


          cd /workdir/openwrt



          CONFIG="${GITHUB_WORKSPACE}/${{ inputs.config_file }}"



          echo "Config file:"

          echo "${CONFIG}"



          if [ ! -f "${CONFIG}" ]; then

            echo "Config file not found"

            exit 1

          fi



          cp "${CONFIG}" .config



          echo "=============================="

          echo "Target config"

          echo "=============================="


          grep "^CONFIG_TARGET" .config || true





      - name: Enable docker packages

        if: inputs.docker == true

        shell: bash

        run: |

          set -euxo pipefail


          cd /workdir/openwrt



          if [ -f "${GITHUB_WORKSPACE}/config/docker.config" ]; then

            cat "${GITHUB_WORKSPACE}/config/docker.config" >> .config

          fi





      - name: Generate config

        shell: bash

        run: |

          set -euxo pipefail


          cd /workdir/openwrt



          make defconfig



          echo "=============================="

          echo "Final target"

          echo "=============================="


          grep "^CONFIG_TARGET.*=y" .config || true





      - name: Generate cache key

        id: cache-key

        shell: bash

        run: |

          set -euxo pipefail


          cd /workdir/openwrt



          HASH=$(sha256sum \
            .config \
            feeds.conf.default \
            .github-feed-lock/* \
            2>/dev/null \
            | sha256sum \
            | cut -d' ' -f1)



          echo "key=openwrt-${{ inputs.device }}-${HASH}" >> "${GITHUB_OUTPUT}"





      - name: Restore download cache

        uses: actions/cache@v4

        with:


          path: |

            /workdir/openwrt/dl


          key: ${{ steps.cache-key.outputs.key }}


          restore-keys: |

            openwrt-${{ inputs.device }}-



      - name: Download packages


        shell: bash


        run: |


          set -euxo pipefail


          cd /workdir/openwrt





          echo "=============================="


          echo "Download packages"


          echo "=============================="





          make download -j$(nproc)





          find dl -size -1024c -delete





          du -sh dl || true





      - name: Compile firmware


        id: compile


        shell: bash


        run: |


          set -euxo pipefail


          cd /workdir/openwrt





          echo "=============================="


          echo "Start build"


          echo "=============================="





          make -j$(nproc) V=s





          echo "compile=success" >> "${GITHUB_OUTPUT}"





      - name: Check firmware output


        if: always()


        shell: bash


        run: |


          set +e


          cd /workdir/openwrt





          echo "=============================="


          echo "Firmware files"


          echo "=============================="





          if [ -d "bin/targets" ]; then





            find bin/targets \

              -maxdepth 5 \

              -type f \

              | sort





          else





            echo "No firmware output"





          fi





          echo ""





          echo "=============================="


          echo "APK Feed files"


          echo "=============================="





          find bin \

            -type f \

            \( \

              -name "*.apk" \

              -o -name "packages.adb" \

            \) \

            | sort || true





      - name: Upload firmware artifact


        if: steps.compile.outputs.compile == 'success'


        uses: actions/upload-artifact@v4


        with:





          name: ${{ inputs.device }}-firmware-${{ github.run_number }}





          path: |


            /workdir/openwrt/bin/targets/**





          if-no-files-found: warn





          retention-days: 30





      - name: Upload device APK feed artifact


        if: steps.compile.outputs.compile == 'success'


        uses: actions/upload-artifact@v4


        with:





          name: ${{ inputs.device }}-apk-feed-${{ github.run_number }}





          path: |


            /workdir/openwrt/bin/targets/**/packages/**


            /workdir/openwrt/bin/targets/**/packages.adb


            /workdir/openwrt/bin/packages/**





          if-no-files-found: warn





          retention-days: 90





      - name: Upload build information


        if: always()


        uses: actions/upload-artifact@v4


        with:





          name: ${{ inputs.device }}-build-info-${{ github.run_number }}





          path: |


            /workdir/openwrt/.config


            /workdir/openwrt/.github-feed-lock/**


            /workdir/openwrt/bin/targets/**/*.buildinfo


            /workdir/openwrt/bin/targets/**/*.manifest


            /workdir/openwrt/bin/targets/**/*sha256sums





          if-no-files-found: ignore





          retention-days: 30





      - name: Create GitHub Release


        if: inputs.release == true && steps.compile.outputs.compile == 'success'


        uses: softprops/action-gh-release@v2


        with:





          tag_name: ${{ inputs.device }}-${{ github.run_number }}





          name: ${{ inputs.device }} Build ${{ github.run_number }}





          files: |


            /workdir/openwrt/bin/targets/**/*





        env:


          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}





      - name: Build summary


        if: always()


        shell: bash


        run: |


          echo "================================"


          echo " OpenWrt Build Summary "


          echo "================================"





          echo "Device:"


          echo "${{ inputs.device }}"





          echo ""





          echo "Repository:"


          echo "${{ inputs.repo_url }}"





          echo ""





          echo "Branch:"


          echo "${{ inputs.repo_branch }}"





          echo ""





          echo "Commit:"


          echo "${OPENWRT_COMMIT:-unknown}"





          echo ""





          echo "Disk usage:"


          df -hT
