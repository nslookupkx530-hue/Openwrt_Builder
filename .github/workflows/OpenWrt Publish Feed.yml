name: OpenWrt Publish Feed


on:

  workflow_run:

    workflows:

      - Build filogic
      - Build immortalWrt x86_64

    types:

      - completed



permissions:

  contents: write



jobs:


  publish:


    if: ${{ github.event.workflow_run.conclusion == 'success' }}


    runs-on: ubuntu-22.04



    steps:



      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Download build artifacts

        uses: actions/download-artifact@v4

        with:

          github-token: ${{ secrets.GITHUB_TOKEN }}

          run-id: ${{ github.event.workflow_run.id }}

          path: downloaded



      - name: Check downloaded artifacts

        shell: bash

        run: |

          set +e


          echo "=============================="

          echo "Downloaded artifacts"

          echo "=============================="


          if [ -d downloaded ]; then

            find downloaded -type f | sort

          else

            echo "downloaded directory not found"

          fi



      - name: Prepare APK feed

        shell: bash

        run: |

          set -euxo pipefail


          rm -rf publish-feed


          mkdir -p publish-feed


          echo "=============================="

          echo "Collect APK files"

          echo "=============================="


          if [ -d downloaded ]; then


            find downloaded \
              -type f \
              -name "*.apk" \
              -exec cp -f {} publish-feed/ \;


            find downloaded \
              -type f \
              -name "packages.adb" \
              -exec cp -f {} publish-feed/ \;


          fi



          echo "=============================="

          echo "Feed files"

          echo "=============================="


          find publish-feed -type f | sort || true



      - name: Prepare Pages directory

        shell: bash

        run: |

          set -euxo pipefail


          rm -rf pages


          mkdir -p pages


          echo "=============================="

          echo "Copy feed"

          echo "=============================="


          if [ -d publish-feed ]; then


            cp -rf publish-feed/. pages/


          fi



          echo "=============================="

          echo "Pages files"

          echo "=============================="


          find pages -type f | sort || true



      - name: Create feed index

        shell: bash

        run: |

          set -euxo pipefail


          cat > pages/index.html <<'EOF'

          <!DOCTYPE html>

          <html>

          <head>

          <meta charset="utf-8">

          <title>OpenWrt APK Feed</title>

          </head>


          <body>


          <h1>OpenWrt APK Feed</h1>


          <p>

          Generated by GitHub Actions

          </p>


          <hr>


          <ul>

          EOF


          if [ -d pages ]; then


            find pages \
              -maxdepth 1 \
              -type f \
              -printf "<li>%f</li>\n" \
              >> pages/index.html


          fi


          cat >> pages/index.html <<'EOF'


          </ul>


          </body>


          </html>

          EOF



      - name: Publish feed to gh-pages

        uses: peaceiris/actions-gh-pages@v4


        with:


          github_token: ${{ secrets.GITHUB_TOKEN }}


          publish_dir: pages


          publish_branch: gh-pages


          force_orphan: false



      - name: Publish summary

        if: always()

        shell: bash

        run: |

          echo "================================"

          echo " OpenWrt APK Feed Publish "

          echo "================================"


          echo "Source workflow:"


          echo "${{ github.event.workflow_run.name }}"


          echo ""


          echo "Workflow run id:"


          echo "${{ github.event.workflow_run.id }}"


          echo ""


          echo "Published branch:"


          echo "gh-pages"
