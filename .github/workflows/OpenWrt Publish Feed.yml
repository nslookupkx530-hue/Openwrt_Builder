name: OpenWrt Publish Feed


on:


  workflow_run:


    workflows:


      - Build filogic


      - Build immortalWrt x86_64





    types:


      - completed





permissions:


  contents: write





jobs:





  publish:





    if: ${{ github.event.workflow_run.conclusion == 'success' }}





    runs-on: ubuntu-22.04





    steps:





      - name: Checkout repository


        uses: actions/checkout@v4





      - name: Download build artifacts


        uses: actions/download-artifact@v4





        with:


          path: downloaded


          github-token: ${{ secrets.GITHUB_TOKEN }}


          run-id: ${{ github.event.workflow_run.id }}





      - name: Check downloaded artifacts


        shell: bash


        run: |


          set +e





          echo "=============================="


          echo "Downloaded artifacts"


          echo "=============================="





          if [ -d downloaded ]; then


            find downloaded -type f | sort


          else


            echo "No downloaded directory"


          fi





      - name: Prepare APK feed


        shell: bash


        run: |


          set -euxo pipefail





          rm -rf publish-feed





          mkdir -p publish-feed





          echo "=============================="


          echo "Copy APK files"


          echo "=============================="





          if [ -d downloaded ]; then


            find downloaded -type f -name "*.apk" -exec cp {} publish-feed/ \;


          fi





          if [ -d downloaded ]; then


            find downloaded -type f -name "packages.adb" -exec cp {} publish-feed/ \;


          fi





          echo "Feed files:"





          find publish-feed -type f | sort || true



      - name: Generate APK index


        shell: bash


        run: |


          set -euxo pipefail





          cd publish-feed





          if command -v apk; then


            echo "apk tool exists"


          else


            echo "apk tool not found"


          fi





          echo "=============================="


          echo "Feed content"


          echo "=============================="





          ls -lah





      - name: Prepare Pages directory


        shell: bash


        run: |


          set -euxo pipefail





          mkdir -p pages





          cp -r publish-feed/* pages/ || true





          echo "=============================="


          echo "Pages content"


          echo "=============================="





          find pages -type f | sort || true





      - name: Publish APK feed to gh-pages


        uses: peaceiris/actions-gh-pages@v4





        with:


          github_token: ${{ secrets.GITHUB_TOKEN }}





          publish_dir: pages





          publish_branch: gh-pages





          force_orphan: false





      - name: Publish summary


        if: always()


        shell: bash


        run: |


          echo "================================"


          echo " OpenWrt APK Feed Publish "


          echo "================================"





          echo "Source workflow:"


          echo "${{ github.event.workflow_run.name }}"





          echo "Run ID:"


          echo "${{ github.event.workflow_run.id }}"





          echo ""





          echo "Published branch:"


          echo "gh-pages"
