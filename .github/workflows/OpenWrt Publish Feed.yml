name: OpenWrt Publish Feed


on:

  workflow_run:

    workflows:

      - Build filogic
      - Build immortalWrt x86_64

    types:

      - completed


permissions:

  contents: write


jobs:


  publish:


    if: ${{ github.event.workflow_run.conclusion == 'success' }}


    runs-on: ubuntu-22.04


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Download build artifacts

        uses: actions/download-artifact@v4

        with:

          github-token: ${{ secrets.GITHUB_TOKEN }}

          run-id: ${{ github.event.workflow_run.id }}

          path: ./downloaded



      - name: Check artifacts

        shell: bash

        run: |

          set -euxo pipefail

          echo "=============================="

          echo "Downloaded artifacts"

          echo "=============================="

          if [ -d "./downloaded" ]; then

            find "./downloaded" -type f | sort || true

          else

            echo "downloaded directory missing"

          fi



      - name: Prepare APK feed

        shell: bash

        run: |

          set -euxo pipefail


          FEED_DIR="./publish-feed"


          rm -rf "${FEED_DIR}"


          mkdir -p "${FEED_DIR}"


          if [ -d "./downloaded" ]; then


            find "./downloaded" -type f -name "*.apk" -exec cp -f {} "${FEED_DIR}/" \;


            find "./downloaded" -type f -name "packages.adb" -exec cp -f {} "${FEED_DIR}/" \;


          fi



          echo "=============================="

          echo "APK Feed"

          echo "=============================="



          find "${FEED_DIR}" -type f | sort || true



      - name: Prepare Pages directory

        shell: bash

        run: |

          set -euxo pipefail


          PAGES_DIR="./pages"


          FEED_DIR="./publish-feed"


          rm -rf "${PAGES_DIR}"


          mkdir -p "${PAGES_DIR}"


          if [ -d "${FEED_DIR}" ]; then


            cp -rf "${FEED_DIR}/." "${PAGES_DIR}/"


          fi



          echo "=============================="

          echo "Pages content"

          echo "=============================="



          find "${PAGES_DIR}" -type f | sort || true



      - name: Create index

        shell: bash

        run: |

          set -euxo pipefail


          cat > pages/index.html <<'EOF'

          <!DOCTYPE html>

          <html>

          <head>

          <meta charset="utf-8">

          <title>OpenWrt APK Feed</title>

          </head>

          <body>

          <h1>OpenWrt APK Feed</h1>

          <p>Generated by GitHub Actions</p>

          </body>

          </html>

          EOF



      - name: Publish to gh-pages

        uses: peaceiris/actions-gh-pages@v4

        with:

          github_token: ${{ secrets.GITHUB_TOKEN }}

          publish_dir: ./pages

          publish_branch: gh-pages

          force_orphan: false



      - name: Publish summary

        if: always()

        shell: bash

        run: |

          echo "=============================="

          echo " OpenWrt Feed Publish Summary "

          echo "=============================="

          echo "Workflow:"

          echo "${{ github.event.workflow_run.name }}"

          echo ""

          echo "Run ID:"

          echo "${{ github.event.workflow_run.id }}"

          echo ""

          echo "Branch:"

          echo "gh-pages"
