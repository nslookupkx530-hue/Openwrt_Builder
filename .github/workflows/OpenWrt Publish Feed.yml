name: OpenWrt Publish Feed


on:


  workflow_run:


    workflows:


      - Build filogic
      - Build immortalWrt x86_64


    types:


      - completed





permissions:


  contents: write





jobs:



  publish:



    if: ${{ github.event.workflow_run.conclusion == 'success' }}



    runs-on: ubuntu-22.04





    steps:



      - name: Checkout repository


        uses: actions/checkout@v4





      - name: Download build artifacts


        uses: actions/download-artifact@v4


        with:


          github-token: ${{ secrets.GITHUB_TOKEN }}


          run-id: ${{ github.event.workflow_run.id }}


          path: downloaded





      - name: Detect device


        shell: bash


        run: |


          set -euxo pipefail





          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"





          echo "Source workflow:"


          echo "${WORKFLOW_NAME}"





          if [[ "${WORKFLOW_NAME}" == *"GL-MT5000"* ]]; then


            DEVICE="GL-MT5000"





          elif [[ "${WORKFLOW_NAME}" == *"Tenda-BE12PRO"* ]]; then


            DEVICE="Tenda-BE12PRO"





          elif [[ "${WORKFLOW_NAME}" == *"x86_64"* ]]; then


            DEVICE="x86_64"





          else


            DEVICE="unknown"





          fi





          echo "DEVICE=${DEVICE}" >> $GITHUB_ENV





          echo "Detected device:"


          echo "${DEVICE}"





      - name: Prepare version


        shell: bash


        run: |


          set -euxo pipefail





          DATE=$(date +%Y-%m-%d)


          RUN_ID="${{ github.event.workflow_run.id }}"





          VERSION="${DATE}-${RUN_ID}"





          echo "VERSION=${VERSION}" >> $GITHUB_ENV





          echo "=============================="


          echo "Feed version"


          echo "${VERSION}"


          echo "Device"


          echo "${DEVICE}"


          echo "=============================="



      - name: Prepare gh-pages workspace

        shell: bash

        run: |

          set -euxo pipefail


          rm -rf gh-pages


          git clone \
            --branch gh-pages \
            --single-branch \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            gh-pages \
            || mkdir -p gh-pages



          echo "=============================="

          echo "Existing gh-pages"

          echo "=============================="


          find gh-pages -maxdepth 3 -type d | sort || true





      - name: Create device feed directories

        shell: bash

        run: |

          set -euxo pipefail


          DEVICE_PATH="latest/${DEVICE}"


          ARCHIVE_PATH="archive/${VERSION}/${DEVICE}"



          mkdir -p "gh-pages/${DEVICE_PATH}"


          mkdir -p "gh-pages/${ARCHIVE_PATH}"



          echo "=============================="

          echo "Device path"

          echo "${DEVICE_PATH}"


          echo "Archive path"

          echo "${ARCHIVE_PATH}"

          echo "=============================="





      - name: Copy APK feed files

        shell: bash

        run: |

          set -euxo pipefail


          DEVICE_PATH="gh-pages/latest/${DEVICE}"


          ARCHIVE_PATH="gh-pages/archive/${VERSION}/${DEVICE}"



          echo "=============================="

          echo "Copy APK files"

          echo "=============================="



          if [ -d downloaded ]; then



            find downloaded \
              -type f \
              -name "*.apk" \
              -exec cp -f {} "${DEVICE_PATH}/" \;



            find downloaded \
              -type f \
              -name "packages.adb" \
              -exec cp -f {} "${DEVICE_PATH}/" \;



          fi




          echo "=============================="

          echo "Sync archive"

          echo "=============================="



          cp -rf "${DEVICE_PATH}/." "${ARCHIVE_PATH}/" || true




          echo "=============================="

          echo "Latest ${DEVICE}"

          echo "=============================="



          find "${DEVICE_PATH}" -type f | sort || true




          echo "=============================="

          echo "Archive ${DEVICE}"

          echo "=============================="



          find "${ARCHIVE_PATH}" -type f | sort || true



      - name: Generate feed index

        shell: bash

        run: |

          set -euxo pipefail



          cat > gh-pages/index.html <<'EOF'

          <!DOCTYPE html>

          <html>

          <head>

          <meta charset="utf-8">

          <title>OpenWrt APK Feed</title>

          </head>


          <body>


          <h1>OpenWrt APK Feed</h1>


          <h2>Latest Feed</h2>


          <ul>

          <li>
          <a href="latest/GL-MT5000/">
          GL-MT5000
          </a>
          </li>


          <li>
          <a href="latest/Tenda-BE12PRO/">
          Tenda-BE12PRO
          </a>
          </li>


          <li>
          <a href="latest/x86_64/">
          x86_64
          </a>
          </li>

          </ul>


          <h2>Archive</h2>


          <ul>


          <li>

          <a href="archive/">

          Archive versions

          </a>

          </li>


          </ul>


          </body>


          </html>

          EOF





      - name: Generate device index

        shell: bash

        run: |

          set -euxo pipefail



          for device in GL-MT5000 Tenda-BE12PRO x86_64

          do


            if [ -d "gh-pages/latest/${device}" ]; then



              cat > "gh-pages/latest/${device}/index.html" <<EOF


              <!DOCTYPE html>

              <html>

              <head>

              <meta charset="utf-8">

              <title>${device} APK Feed</title>

              </head>


              <body>


              <h1>${device} APK Feed</h1>


              <ul>


              $(find "gh-pages/latest/${device}" \
                -maxdepth 1 \
                -type f \
                -printf "<li>%f</li>\n")


              </ul>


              </body>


              </html>


EOF


            fi


          done





      - name: Commit and push gh-pages

        shell: bash

        working-directory: gh-pages

        run: |

          set -euxo pipefail



          git config user.name "github-actions"


          git config user.email "github-actions@github.com"





          git add .





          if git diff --cached --quiet; then


            echo "No changes"


            exit 0


          fi





          git commit \

            -m "Update OpenWrt APK feed ${VERSION} ${DEVICE}"





          git push origin gh-pages





      - name: Publish summary

        if: always()

        shell: bash

        run: |

          echo "================================"

          echo " OpenWrt APK Feed Publish "

          echo "================================"



          echo "Device:"

          echo "${DEVICE}"



          echo ""


          echo "Version:"

          echo "${VERSION}"



          echo ""


          echo "Latest URL:"


          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest/${DEVICE}/"



          echo ""


          echo "Archive URL:"


          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/archive/${VERSION}/${DEVICE}/"
