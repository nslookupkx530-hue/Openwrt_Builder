name: OpenWrt release firmware

description: |
  Upload firmware,
  merge target packages,
  publish release.



inputs:


  upload-firmware:

    description: Upload firmware artifact

    required: false

    default: "true"



  upload-release:

    description: Create github release

    required: false

    default: "true"



  workflow-name:

    description: Workflow name

    required: true



  source-tag:

    description: Source tag

    required: true



  release-tag-prefix:

    description: Release prefix

    required: true



  source-url:

    description: Source url

    required: true



  artifact-name:

    description: Artifact name

    required: false

    default: firmware



runs:


  using: composite



  steps:



  #
  # 下载 firmware artifact
  #

  - name: Download firmware artifact

    uses: actions/download-artifact@v4

    with:

      path: artifacts




  #
  # 查看结构
  #

  - name: Show artifacts

    shell: bash

    run: |


      find artifacts -maxdepth 4 -type f | sort





  #
  # 整理 release 文件
  #

  - name: Prepare release files


    shell: bash


    run: |


      mkdir -p release


      mkdir -p release/packages



      echo "===== firmware ====="



      find artifacts \

      -name "*.bin" \

      -o -name "*.img*" \

      -o -name "*sha256sums" \

      -o -name "*.manifest" \

      -o -name "*.buildinfo" \

      | while read file

      do

        cp "$file" release/

      done





      #
      # 处理 x86 target packages
      #

      if [ -d artifacts/target-packages-x86 ]; then


        echo "Found x86 target packages"



        mkdir -p \

        release/packages/x86_64/targets/x86/64



        cp -rv \

        artifacts/target-packages-x86/* \

        release/packages/x86_64/targets/x86/64/



      fi






      echo "===== release tree ====="


      find release -type f | sort





  #
  # 生成 release tag
  #

  - name: Generate release metadata


    id: meta


    shell: bash


    run: |


      DATE=$(date +"%Y%m%d-%H%M")


      TAG="${{ inputs.release-tag-prefix }}-${DATE}"



      echo "tag=$TAG" >> "$GITHUB_OUTPUT"



      cat > release-body.md <<EOF


# OpenWrt Firmware



Device:

${{ inputs.workflow-name }}



Version:

${{ inputs.source-tag }}



Source:

${{ inputs.source-url }}



Build:

${DATE}



## APK Feed



After download:



\`\`\`text

packages/x86_64/targets/x86/64/

\`\`\`



EOF




  #
  # 上传 release
  #

  - name: Create Github Release


    if: inputs.upload-release == 'true'


    uses: softprops/action-gh-release@v2


    with:


      tag_name:

        ${{ steps.meta.outputs.tag }}



      body_path:

        release-body.md



      files:

        release/**





  #
  # 删除旧 release
  #

  - name: Delete old releases


    if: inputs.upload-release == 'true'


    uses: dev-drprasad/delete-older-releases@v0.1.0


    with:


      keep_latest: 10


      delete_tags: true


    env:


      GITHUB_TOKEN: ${{ github.token }}





  #
  # 删除旧 workflow
  #

  - name: Delete old workflow runs


    uses: GitRML/delete-workflow-runs@main


    with:


      retain_days: 7


      keep_minimum_runs: 5


    env:


      GITHUB_TOKEN: ${{ github.token }}
